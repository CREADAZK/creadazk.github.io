:root{--bg:#0e0c0a;--bg2:#15120f;--bg3:#1d1915;--ink:#efe8dc;--mut:#9f978a;--g:#c2a273;--g2:#d9bd8c;--line:rgba(194,162,115,.28);--line2:rgba(239,232,220,.1);--verde:#25a95a;--r:4px;
  --serif:'Cormorant Garamond',Garamond,Georgia,serif;--sans:'Jost','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:70px;scroll-padding-bottom:110px}
body{background:var(--bg);color:var(--ink);font:300 16px/1.6 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
em{font-style:italic;color:var(--g)}

h1,h2{font-family:var(--serif);font-weight:400;line-height:1.02;letter-spacing:.2px}
h3{font:400 11.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin:34px 0 14px}
.sub,.nota{color:var(--mut);font-size:14.5px}.sub{margin:-4px 0 18px}.nota{margin-top:12px}

/* encabezado */
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.top.solido{background:rgba(14,12,10,.94);backdrop-filter:blur(12px);border-color:var(--line2)}
.logo img{height:26px;width:auto}
.top nav{display:flex;gap:14px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--line);font:500 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink);background:transparent;transition:.2s}
.btn:hover{border-color:var(--g)}

.btn:disabled{opacity:.3;cursor:default}

/* portada: una pantalla, una foto, un botón */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 22px 64px;overflow:hidden}

.datos{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}

/* configurador */

.modelos,.piedras,.bases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.modelo.sel::after,.piedra.sel::after,.base.sel::after{content:'✓';position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--g);color:#16120d;display:grid;place-items:center;font-size:14px;font-weight:600}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-width:58px;height:58px;border:1px solid var(--line2);border-radius:999px;font:400 26px/1 var(--serif);padding:0 16px;background:var(--bg2)}

.medidas h3:empty{display:none}

.total{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:18px 20px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-top:10px}

.foto{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r);background:#ddd6cb}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(14,12,10,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line2);transform:translateY(110%);transition:transform .35s}

footer{padding:56px 18px 120px;text-align:center;color:var(--mut);font-size:13px;border-top:1px solid var(--line2);background:var(--bg)}

/* ---- medidas libres, factibilidad y ficha técnica (versión para arquitectos) ---- */

/* táctil (nov 2026): respuesta al tocar, sin el recuadro gris de iOS, y botones del 3D del tamaño de un dedo */

/* DKAS · Cotiza en 1 minuto: pantallas cortas, fotos grandes, un toque por decisión */
.cz{max-width:720px;margin:0 auto;padding:86px 18px 130px}

.cz-ops{display:grid;gap:10px}.cz-op{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:18px 18px;border:1.5px solid var(--line2);border-radius:12px;background:var(--bg2);text-align:left}

.cz-chips{display:flex;flex-wrap:wrap;gap:8px}.cz-chip{min-width:64px;padding:14px 18px;border:1.5px solid var(--line2);border-radius:12px;background:var(--bg2);font:500 18px/1 var(--sans);display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.cz-chip small{font-size:11.5px;color:var(--mut)}.cz-chip.on{border-color:var(--g);background:var(--g);color:#16120d}.cz-chip.on small{color:#3b2f1e}
.cz-col{flex-direction:row;font-size:14px;padding:11px 14px;min-width:0}.cz-col i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.cz-med{margin:14px 0 4px;color:var(--mut);font-size:14px}.cz-med b{color:var(--ink)}

.cz-h2{font:400 13px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--g);margin:24px 0 10px}

.cz-yo{width:100%;min-height:52px;margin-top:14px;display:flex;align-items:center;justify-content:center}.cz-yo.on{border-color:var(--g);color:var(--g)}

.cz-otra-f{margin-top:8px}.cz-otra-f .lnk-g{display:block;margin-top:10px;color:var(--g);font-size:14px}
