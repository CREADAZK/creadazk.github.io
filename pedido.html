<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DKAS · Mi pedido</title><meta name="description" content="Sigue tu mesa DKAS."><meta name="theme-color" content="#0e0c0a">
<meta property="og:title" content="DKAS · Mi pedido"><meta property="og:description" content="Sigue tu mesa DKAS."><meta property="og:image" content="https://creadazk.github.io/og.jpg">
<link rel="icon" href="img/dkas-oscuro.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><meta name="robots" content="noindex"><style>/* DKAS · Crea tu mesa, con el lenguaje del catálogo 2026: negro cálido, serif con acentos dorados en itálica, números grandes y fotos reales */
:root{--bg:#0e0c0a;--bg2:#15120f;--bg3:#1d1915;--ink:#efe8dc;--mut:#9f978a;--g:#c2a273;--g2:#d9bd8c;--line:rgba(194,162,115,.28);--line2:rgba(239,232,220,.1);--verde:#25a95a;--r:4px;
  --serif:'Cormorant Garamond',Garamond,Georgia,serif;--sans:'Jost','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:70px;scroll-padding-bottom:110px}
body{background:var(--bg);color:var(--ink);font:300 16px/1.6 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
em{font-style:italic;color:var(--g)}
.et{font:400 11.5px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--g)}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.02;letter-spacing:.2px}
h3{font:400 11.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin:34px 0 14px}
.sub,.nota{color:var(--mut);font-size:14.5px}.sub{margin:-4px 0 18px}.nota{margin-top:12px}

/* encabezado */
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.top.solido{background:rgba(14,12,10,.94);backdrop-filter:blur(12px);border-color:var(--line2)}
.logo img{height:26px;width:auto}
.top nav{display:flex;gap:14px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--line);font:500 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink);background:transparent;transition:.2s}
.btn:hover{border-color:var(--g)}
.btn.oro{background:var(--g);border-color:var(--g);color:#16120d}.btn.oro:hover{background:var(--g2)}
.btn.verde{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.chico{min-height:38px;padding:0 16px;font-size:11.5px}
.btn:disabled{opacity:.3;cursor:default}
.btn svg{width:18px;height:18px}
.lnk{color:var(--mut);font-size:13px;text-decoration:none;letter-spacing:.12em;text-transform:uppercase}

/* portada: una pantalla, una foto, un botón */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 22px 64px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,10,.55) 0,rgba(14,12,10,.1) 35%,rgba(14,12,10,.6) 62%,var(--bg) 100%)}
.hero>div{position:relative;z-index:2;max-width:640px}
.hero h1{font-size:clamp(46px,11vw,92px);margin:16px 0 18px}
.hero p.l{font-size:17px;color:#d9d1c3;max-width:430px;margin-bottom:28px}
.hero .bot{display:flex;gap:10px;flex-wrap:wrap}
.datos{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.datos div{border-left:1px solid var(--line);padding-left:14px}
.datos b{display:block;font:400 34px/1 var(--serif);color:var(--g)}
.datos span{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}

/* configurador */
.app{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--line2)}
.app>*{min-width:0}
.stage{position:sticky;top:62px;z-index:10;height:42vh;min-height:250px;background:radial-gradient(120% 90% at 50% 40%,#f1ece4 0,#ddd6cb 70%,#cfc7ba 100%)}
#v3d{position:absolute;inset:0;cursor:grab}
.chip{position:absolute;left:12px;top:12px;background:rgba(14,12,10,.82);color:var(--ink);border-radius:999px;padding:7px 15px;font-size:13px;pointer-events:none;backdrop-filter:blur(6px)}
.chip b{font-weight:500;color:var(--g2)}
.vistas{position:absolute;right:12px;top:12px;display:flex;background:rgba(14,12,10,.82);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.vistas button{padding:6px 12px;border-radius:999px;font-size:12px;color:var(--mut);letter-spacing:.06em}
.vistas button.on{background:var(--g);color:#16120d;font-weight:500}
.abajo{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.abajo>*{pointer-events:auto}
.tg{display:flex;align-items:center;gap:8px;background:rgba(14,12,10,.82);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
.tg input{accent-color:var(--g)}
.abajo .btn{background:rgba(14,12,10,.82);backdrop-filter:blur(6px);border-color:transparent}

.panel{padding:26px 18px 130px;background:var(--bg)}
.pasos{display:flex;gap:4px;margin:0 0 30px;border-bottom:1px solid var(--line2)}
.pasos button{flex:1;padding:0 0 12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.pasos button span{display:block;font:400 22px/1 var(--serif);letter-spacing:0;margin-bottom:6px;color:inherit}
.pasos .on{color:var(--ink);border-color:var(--g)}.pasos .on span{color:var(--g)}
.pasos .hecho{color:#cfc5b4}
.tt{position:relative;margin-bottom:22px}
.tt .num{display:block;font:300 74px/.8 var(--serif);color:transparent;-webkit-text-stroke:1px var(--g);margin-bottom:24px}
.tt h2{font-size:clamp(34px,8vw,44px);margin-top:10px}
.tt::after{content:'';display:block;width:54px;height:1px;background:var(--g);margin-top:18px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button,.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 8px 14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg2);transition:.2s}
.seg b,.card b{font:400 21px/1.1 var(--serif);color:var(--ink)}
.seg small,.card small{color:var(--mut);font-size:12px;line-height:1.35}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ico{width:50px;height:50px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;opacity:.9}
.ico .f{stroke:var(--mut);stroke-width:1.4}
.sel{border-color:var(--g)!important;background:linear-gradient(180deg,rgba(194,162,115,.14),rgba(194,162,115,.04))!important}
.sel .ico{stroke:var(--g2)}
.sel b{color:var(--g2)!important}

.modelos,.piedras,.bases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.modelo,.piedra,.base{position:relative;text-align:left;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--bg2);padding:0 0 12px;transition:.2s}
.modelo img,.piedra img,.base img{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--bg3);margin-bottom:10px;transition:transform .5s}
.modelo:hover img,.piedra:hover img,.base:hover img{transform:scale(1.04)}
.piedra img{aspect-ratio:4/3}
.modelo b,.piedra b,.base b{display:block;padding:0 12px;font:400 21px/1.1 var(--serif)}
.modelo small,.piedra small,.base small{display:block;padding:3px 12px 0;color:var(--mut);font-size:12.5px;line-height:1.35}
.modelo.sel::after,.piedra.sel::after,.base.sel::after{content:'✓';position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--g);color:#16120d;display:grid;place-items:center;font-size:14px;font-weight:600}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-width:58px;height:58px;border:1px solid var(--line2);border-radius:999px;font:400 26px/1 var(--serif);padding:0 16px;background:var(--bg2)}
.pill.sel{background:var(--g)!important;color:#16120d}.pill.sel b{color:inherit}
.medidas h3:empty{display:none}
.rango{display:block;margin:20px 0}
.rango span{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.rango span b{font:400 28px/1 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink)}
.rango input{width:100%;accent-color:var(--g);height:34px}
.rango i{display:flex;justify-content:space-between;font-style:normal;font-size:12px;color:var(--mut)}
.rango em{font-style:normal;color:var(--mut)}
.total{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:18px 20px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
.total b{font:400 32px/1 var(--serif);color:var(--g2)}.total span{color:#d9d1c3;font-size:14.5px}

.foto{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r);background:#ddd6cb}
.res{list-style:none;padding:0;margin:16px 0 24px;border-top:1px solid var(--line2)}
.res li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:15px}
.res span{color:var(--mut);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.res b{font-weight:400}
form label{display:block;margin:16px 0 0;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
form input,form textarea{display:block;width:100%;margin-top:8px;padding:14px 16px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg2);font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink)}
form input:focus,form textarea:focus{outline:1px solid var(--g);border-color:var(--g)}
.form-btn{width:100%;margin-top:22px;min-height:56px;font-size:13.5px}
.err{color:#f08a7e;margin-top:12px;font-size:14px}
.listo{text-align:center;padding:12px 0}
.listo h2{font-size:42px}.listo .folio{font:400 30px/1 var(--serif);color:var(--g);margin:10px 0 14px}
.listo .btn{width:100%;margin-top:12px;min-height:54px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(14,12,10,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line2);transform:translateY(110%);transition:transform .35s}
.bar.ver{transform:none}
.bar #cuenta{font:400 18px/1 var(--serif);color:var(--mut)}
.bar .btn{min-width:118px}

footer{padding:56px 18px 120px;text-align:center;color:var(--mut);font-size:13px;border-top:1px solid var(--line2);background:var(--bg)}
footer img{height:44px;margin:0 auto 14px}
footer .et{margin-bottom:18px}
footer .bot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal .caja{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:8px;width:min(720px,100%);height:min(620px,88vh);display:flex;flex-direction:column;overflow:hidden}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:14px}
.modal header b{font:400 19px/1.2 var(--serif)}
#ar-box{position:relative;flex:1;background:#ddd6cb}
#ar-box model-viewer{width:100%;height:100%}
#ar-msg,.ar-desk{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#3a352f;font-size:13.5px;padding:0 20px}
.ar-go{position:absolute;bottom:16px;left:50%;transform:translateX(-50%)}

@media (min-width:980px){
  .hero{padding:0 6vw 9vh}
  .app{grid-template-columns:minmax(0,1.3fr) minmax(430px,1fr)}
  .stage{height:calc(100vh - 62px)}
  .panel{padding:40px 44px 130px;border-left:1px solid var(--line2)}
  .bar{left:auto;width:calc(100% / 2.3);min-width:430px}
  .modelos,.piedras{grid-template-columns:repeat(3,1fr)}
  .cards{grid-template-columns:repeat(3,1fr)}
  footer{padding-bottom:56px}
}
@media (max-width:700px){.vistas{top:54px}.chip{right:12px;text-align:center}.hero::after{background:linear-gradient(180deg,rgba(14,12,10,.5) 0,rgba(14,12,10,.15) 25%,rgba(14,12,10,.82) 48%,var(--bg) 100%)}.datos{gap:16px}.datos b{font-size:28px}.datos span{font-size:10px;letter-spacing:.18em}}
@media (max-width:400px){.seg small{display:none}.ico{width:40px;height:40px}.pasos button{font-size:9.5px;letter-spacing:.1em}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.pm{max-width:680px;margin:0 auto;padding:96px 18px 80px}
.linea{list-style:none;padding:0;display:flex;justify-content:space-between;margin:6px 0 26px;position:relative}
.linea::before{content:'';position:absolute;left:8px;right:8px;top:7px;height:1px;background:var(--line2)}
.linea li{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.04em;line-height:1.25;padding:0 2px;text-transform:uppercase;color:var(--mut);text-align:center;flex:1}
.linea span{width:15px;height:15px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.linea .hecho span{background:var(--g);border-color:var(--g)}.linea .on span{background:var(--g);box-shadow:0 0 0 5px rgba(194,162,115,.25)}.linea .on{color:var(--ink)}
.coti{margin-top:8px;padding:22px 18px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.cifras span{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}.cifras b{font:400 38px/1.1 var(--serif);color:var(--g2)}
.croquis{margin-top:12px;overflow:auto;border-radius:4px;background:#fff}.croquis svg{display:block;width:100%;height:auto;min-width:560px}
.btn.grande{width:100%;min-height:56px;margin-top:16px}
.ok{color:#7fd39d;margin-top:10px}.espera{margin:16px 0}
.res a{color:var(--ink)}</style></head><body>
