<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0907;--sheet:#13100d;--line:rgba(236,228,214,.12);--ink:#ece4d6;--mut:#9a8f7d;--g:#c2a273;--g2:#d9bd8c;--gl:rgba(194,162,115,.42);--wa:#25d366;
--serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;--sans:'Jost','Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:300 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--g)}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);max-width:860px;margin:0 auto}
.top img{height:40px;mix-blend-mode:lighten}.top span{margin-left:auto;font-size:13px;color:var(--mut)}.top button{color:var(--g);text-decoration:underline;text-underline-offset:3px}
.demo{background:#7a4a12;color:#fff;font-size:12px;text-align:center;padding:6px 12px}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
.k{display:block;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--g);margin-bottom:8px}
h1{font:300 clamp(30px,7vw,44px)/1.05 var(--serif);margin-bottom:6px;overflow-wrap:anywhere}h1 em{color:var(--g)}
h3{font:400 21px/1.2 var(--serif);margin-bottom:6px;overflow-wrap:anywhere}
.lead{color:var(--mut);font-size:15px;margin-bottom:16px}
section{margin-top:28px}
.card{border:1px solid var(--gl);padding:16px;margin-top:12px;background:var(--sheet)}
dl.specs div{display:flex;align-items:baseline;gap:10px;padding:4px 0}
dl.specs dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
dl.specs i{flex:1;border-bottom:1px dotted rgba(194,162,115,.4);min-width:10px}dl.specs dd{font-size:14.5px;text-align:right}
.link{display:inline-block;margin-top:10px;font-size:13.5px;text-underline-offset:3px}
.note{margin-top:12px;padding:10px 12px;border-left:2px solid var(--g);background:rgba(194,162,115,.1);font-size:14px;overflow-wrap:anywhere}
.track{list-style:none;display:flex;margin:18px 0 4px}
.track li{flex:1;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:center;line-height:1.3}
.track i{display:block;height:3px;background:var(--line);margin:0 2px 8px}
.track .done{color:#cfc5b4}.track .done i{background:rgba(194,162,115,.5)}.track .on{color:var(--g)}.track .on i{background:var(--g)}
.tl{list-style:none;margin-top:6px}
.tl li{padding:12px 0 12px 14px;border-left:1px solid var(--gl);position:relative}
.tl li::before{content:'';position:absolute;left:-4px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--g)}
.tl li div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.tl b{font-weight:400;font-size:13px;color:var(--g2)}.tl time{font-size:12px;color:var(--mut)}
.tl p{font-size:14.5px;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere}
.tl li.msg p{color:var(--ink);background:var(--sheet);border:1px solid var(--line);padding:10px 12px;margin-top:6px}
.tl li.cliente::before{background:var(--ink)}.tl li.cliente b{color:var(--ink)}
.tl li.int p{color:var(--ink);background:rgba(217,180,90,.1);border:1px dashed rgba(217,180,90,.5);padding:10px 12px;margin-top:6px}
form{margin-top:14px}
label{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);margin:10px 0 0}label.chk input{width:20px;height:20px;accent-color:var(--g)}
input:not([type=checkbox]),textarea,select{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:300 16px/1.5 var(--sans);padding:12px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:10px 16px;border:1px solid var(--gl);color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-align:center;width:100%;margin-top:12px}
.btn.gold{background:var(--g);border-color:var(--g);color:#0b0907;font-weight:400}.btn.wa{background:var(--wa);border-color:var(--wa);color:#08140c;font-weight:400}.btn:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.two{grid-template-columns:1fr;gap:0}}
.err{margin-top:12px;padding:10px 12px;border-left:2px solid #d98a6a;background:rgba(217,138,106,.12);font-size:13.5px}[hidden]{display:none!important}
.rows{list-style:none;margin-top:14px}.rows a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rows b{display:block;font:400 20px/1.2 var(--serif);overflow-wrap:anywhere}.rows span{display:block;font-size:13.5px;color:var(--mut);overflow-wrap:anywhere}.rows .meta{margin-top:6px;font-size:12px}
mark{background:var(--g);color:#0b0907;font:400 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;vertical-align:middle}
.badge{display:inline-block;font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gl);padding:2px 8px;color:var(--g2);margin-right:6px}
.badge.nuevo{background:var(--g);color:#0b0907;border-color:var(--g)}.badge.entregado,.badge.cancelado,.badge.off{color:var(--mut);border-color:var(--line)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);padding:8px 12px;font-size:13px;color:var(--mut);white-space:nowrap}.filters button.on{border-color:var(--g);color:var(--ink);background:rgba(194,162,115,.13)}.filters b{font-weight:400;color:var(--g)}
.back{display:inline-block;margin-bottom:14px;font-size:13px;text-decoration:none}
details.fab{margin-top:14px;border-top:1px solid var(--line)}section>details.fab{border:1px solid var(--gl);background:var(--sheet);padding:0 16px;margin-top:12px}
details.fab summary{cursor:pointer;list-style:none;padding:14px 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.fab summary::-webkit-details-marker{display:none}details.fab summary::after{content:'+';margin-left:auto;font:300 24px/1 var(--serif)}details.fab[open] summary::after{content:'–'}
details.fab summary .badge{margin:0;letter-spacing:.08em}details.fab form{margin:0 0 16px}
.draw svg{width:100%;max-width:420px;display:block;margin:0 auto}
fieldset{border:0;margin-top:18px}legend{font:400 19px/1.2 var(--serif);color:var(--ink);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px}.grid label.wide{grid-column:1/-1}
.scroll{overflow-x:auto;margin-top:8px}.tab{border-collapse:collapse;width:100%;font-size:14px}.tab th,.tab td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:right;font-weight:300;font-variant-numeric:tabular-nums}.tab th:first-child{text-align:left;color:var(--g2)}.tab thead th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.tab td{font:400 20px/1 var(--serif)}
.cot .card{border-color:var(--g)}.cot-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;border-bottom:1px solid var(--gl);padding-bottom:10px;margin-bottom:6px;font-size:13px;color:var(--mut)}.cot-h b{color:var(--g);letter-spacing:.3em}
.cot h3{margin-top:14px}.specs.tot{margin-top:14px;border-top:1px solid var(--gl);padding-top:8px}.specs.tot dd{font:400 22px/1.2 var(--serif);color:var(--g2)}
.ok{margin-top:14px;padding:10px 12px;border-left:2px solid var(--wa);background:rgba(37,211,102,.1);font-size:14.5px}
@media print{body:has(#cot)>*:not(main),body:has(#cot) main>*:not(#cot),#cot .btn,#cot .lead,#cot .two,#cot .err,#cot>.k{display:none!important}
body:has(#cot){background:#fff!important}#cot .card{background:#fff;border:0;color:#000;padding:0}#cot *{color:#000!important}#cot dl.specs i{border-color:#999}}
.funnel .fl{display:grid;grid-template-columns:minmax(110px,38%) 1fr 44px 44px;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}.funnel .fl i{display:block;height:10px;background:var(--g);min-width:2px}
.funnel .fl b{font:400 20px/1 var(--serif);text-align:right}.funnel .fl em{font-style:normal;font-size:12px;color:var(--mut);text-align:right}
.canales{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0 10px}.canal{padding:12px}.canal h3{font-size:18px}.canal .two{grid-template-columns:1fr;gap:0}.canal .btn{min-height:44px;margin-top:8px;font-size:11px;letter-spacing:.1em}.canal code{display:block;font-size:12px;color:var(--mut);overflow-wrap:anywhere;margin:4px 0 10px}
.qr{background:#fff;padding:8px;width:120px;margin:0 auto}.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
.stars{display:flex;gap:6px}.stars button{font-size:34px;line-height:1;color:var(--line);min-width:44px;min-height:44px}.stars button.on{color:var(--g)}
#print{display:none}
@media print{html,body{background:#fff!important}body>*:not(#print){display:none!important}

#print header{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;font-size:15px}#print header b{letter-spacing:.3em}#print header span{font-size:12px}

<script>window.DAZK_FB={"apiKey":"AIzaSyBBJqI7K_xY9RDPFzAVedS_5EyplehRATg","db":"https://dazk-pedidos-default-rtdb.firebaseio.com"};window.DAZK_WA=[{"label":"+52 55 5109 0027","num":"525551090027"},{"label":"+52 55 8556 1037","num":"525585561037"}];</script><script>/* DAZK · pedidos: one data layer for the client page, the client's tracking page and the workshop panel.
   With window.DAZK_FB = { apiKey, db } it talks to Firebase (Realtime Database + Auth over REST; rules in firebase/database.rules.json).
   Without it, it runs in demo mode: everything stays in this browser's localStorage.
   Clients are anonymous: an order lives at pedidos/<secret token>, readable only by whoever has the token.
   The workshop enters with one shared 8-digit code (the password of a single Auth account listed in staff/); each person also types their name, which signs the history. */
(function () {
  const FB = window.DAZK_FB || null, SITE = 'https://creadazk.github.io/';
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const ESTADOS = [['nuevo', 'Recibido'], ['cotizado', 'Cotizado'], ['confirmado', 'Confirmado'], ['fabricacion', 'En fabricación'], ['listo', 'Listo'], ['entregado', 'Entregado'], ['cancelado', 'Cancelado']];
  const estado = k => (ESTADOS.find(e => e[0] === k) || [k, k])[1];
  const digits = t => String(t || '').replace(/\D/g, '');
  // Mexican numbers are stored as typed; WhatsApp links need the country code
  const waNum = t => { const d = digits(t); return d.length === 10 ? '52' + d : d; };
  const sortP = p => { p.items = (p.items || []).slice().sort((a, b) => a.pos - b.pos); p.eventos = (p.eventos || []).slice().sort((a, b) => a.id - b.id); return p; };
  const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  // where a visitor came from, as a short channel name: a campaign link (?c=instagram) or the site that sent them
  function canalDe(x) {
    const s = String(x || '').toLowerCase();
    if (/instagram/.test(s)) return 'instagram'; if (/facebook|fb\.(com|me)|messenger/.test(s)) return 'facebook'; if (/whatsapp|wa\.me/.test(s)) return 'whatsapp';
    if (/tiktok/.test(s)) return 'tiktok'; if (/google/.test(s)) return 'google'; if (s === 'link compartido') return 'compartido';
    return s.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').slice(0, 30);
  }
  // first name and last initial for public reviews
  const corto = n => { const w = String(n).trim().split(/\s+/); return w[0] + (w[1] ? ' ' + w[1][0].toUpperCase() + '.' : ''); };
  function cliente(p) {
    const nombre = String(p.nombre || '').trim().slice(0, 80), tel = digits(p.tel);
    if (nombre.length < 2) throw new Error('Escribe a nombre de quién apartamos la mesa.');
    if (tel && (tel.length < 10 || tel.length > 13)) throw new Error('Revisa tu número de WhatsApp (10 dígitos) o déjalo vacío.');
    if (!p.items || !p.items.length || p.items.length > 12) throw new Error('El pedido debe tener entre 1 y 12 productos.');
    const canal = canalDe(p.canal);
    return Object.assign({ nombre, notas: String(p.notas || '').trim().slice(0, 1000) }, tel ? { tel } : {}, canal ? { canal } : {});
  }

  // ---------- Firebase ----------
  const TS = { '.sv': 'timestamp' };
  let ses = load('dazk-ses', null), yoCache = null;
  async function jfetch(url, opt) {
    let r;
    try { r = await fetch(url, opt); } catch (e) { throw new Error('Sin conexión. Revisa tu internet e intenta de nuevo.'); }
    const j = await r.json().catch(() => null);
    if (!r.ok) { const m = j && j.error && (j.error.message || j.error); const e = new Error(m || 'Error ' + r.status); e.status = r.status; e.code = String(m || ''); throw e; }
    return j;
  }
  const idp = (path, body) => jfetch('https://' + path + '?key=' + FB.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const setSes = j => { ses = j && { idToken: j.idToken, refreshToken: j.refreshToken, uid: j.localId, email: j.email, exp: Date.now() + j.expiresIn * 1000 }; yoCache = null; save('dazk-ses', ses); };
  async function idToken() {
    if (!ses) throw new Error('Tu sesión terminó. Vuelve a entrar.');
    if (Date.now() > ses.exp - 60000) {
      try { const j = await idp('securetoken.googleapis.com/v1/token', { grant_type: 'refresh_token', refresh_token: ses.refreshToken }); Object.assign(ses, { idToken: j.id_token, refreshToken: j.refresh_token, exp: Date.now() + j.expires_in * 1000 }); save('dazk-ses', ses); }
      catch (e) { setSes(null); throw new Error('Tu sesión terminó. Vuelve a entrar.'); }
    }
    return ses.idToken;
  }
  async function db(path, method, body, auth) {
    const q = auth ? '?auth=' + await idToken() : '';
    return jfetch(FB.db + '/' + path + '.json' + q, { method: method || 'GET', body: body === undefined ? undefined : JSON.stringify(body) });
  }
  const denied = e => e.status === 401 || e.status === 403;
  // one order as the pages expect it; internal notes (staff only) are merged into the history
  function shape(t, p, notas) {
    const ev = Object.entries(p.eventos || {}).map(([k, e]) => Object.assign({ key: k, interno: false }, e))
      .concat(Object.entries(notas || {}).map(([k, e]) => Object.assign({ key: k }, e, { interno: true })))
      .sort((a, b) => a.creado - b.creado || (a.key < b.key ? -1 : 1));
    return Object.assign({}, p, { id: t, token: t, notas: p.notas || '', items: Object.values(p.items || {}).map((it, i) => Object.assign({ cantidad: 1 }, it, { pos: i + 1 })), eventos: ev.map((e, i) => Object.assign(e, { id: i + 1 })) });
  }
  const ACCESO = 'acceso@dazk-pedidos.firebaseapp.com', quien = () => load('dazk-quien', '');
  const codigoOk = c => { if (!/^[0-9]{8}$/.test(String(c))) throw new Error('El código son 8 números.'); };
  const real = {
    async crearPedido(p) {
      const c = cliente(p);
      const items = p.items.map(it => Object.assign({ tipo: ['mesa', 'sillas', 'bancos'].includes(it.tipo) ? it.tipo : 'mesa', titulo: String(it.titulo || 'Mesa').slice(0, 160), cantidad: Math.max(1, Math.min(99, +it.cantidad || 1)),
        specs: (it.specs || []).slice(0, 20).map(s => [String(s[0]).slice(0, 120), String(s[1]).slice(0, 120)]) }, it.uso ? { uso: String(it.uso).slice(0, 20) } : {},
        // only links to our own configurator are stored, so staff never open a foreign URL
        String(it.link || '').startsWith(SITE) ? { link: it.link.slice(0, 600) } : {}));
      // the folio counter and the order are written together; if someone else took the number first the rules reject it and we try the next one
      for (let i = 0; i < 6; i++) {
        const folio = ((await db('folio')) || 1000) + 1, t = rnd();
        const ped = Object.assign({ folio, estado: 'nuevo', creado: TS, actualizado: TS, items, eventos: { e0: { creado: TS, autor: 'cliente', autor_nombre: c.nombre, tipo: 'creado', texto: 'Pedido enviado desde Crea tu mesa.' } } }, c);
        try { await db('', 'PATCH', { folio, ['pedidos/' + t]: ped }); return { folio, token: t }; }
        catch (e) { if (!denied(e)) throw e; }
      }
      throw new Error('No se pudo enviar el pedido. Intenta de nuevo en un momento.');
    },
    async verPedido(t) { const p = await db('pedidos/' + t); if (!p) throw new Error('No encontramos ese pedido.'); return shape(t, p); },
    async clienteMensaje(t, texto) {
      const nombre = await db('pedidos/' + t + '/nombre'); if (!nombre) throw new Error('No encontramos ese pedido.');
      await db('pedidos/' + t + '/eventos', 'POST', { creado: TS, autor: 'cliente', autor_nombre: nombre, tipo: 'mensaje', texto: String(texto).slice(0, 2000) });
      await db('pedidos/' + t + '/actualizado', 'PUT', TS);
    },
    async login(codigo, nombre) {
      codigoOk(codigo); nombre = String(nombre || '').trim().slice(0, 60); if (nombre.length < 2) throw new Error('Escribe tu nombre: así queda en el historial quién hizo cada cosa.');
      try { setSes(await idp('identitytoolkit.googleapis.com/v1/accounts:signInWithPassword', { email: ACCESO, password: codigo, returnSecureToken: true })); }
      catch (e) { throw new Error(/TOO_MANY_ATTEMPTS/.test(e.code) ? 'Demasiados intentos. Espera unos minutos.' : e.status ? 'Código incorrecto.' : e.message); }
      save('dazk-quien', nombre);
      const me = await this.yo(); if (!me) { setSes(null); throw new Error('Este código no tiene acceso al taller.'); }
      return me;
    },
    async cambiarCodigo(codigo) {
      codigoOk(codigo);
      try { const j = await idp('identitytoolkit.googleapis.com/v1/accounts:update', { idToken: await idToken(), password: codigo, returnSecureToken: true }); setSes(Object.assign({ email: ACCESO }, j)); }
      catch (e) { throw new Error(/CREDENTIAL_TOO_OLD|TOKEN_EXPIRED/.test(e.code) ? 'Por seguridad, sal y vuelve a entrar con el código actual antes de cambiarlo.' : e.message); }
    },
    logout() { setSes(null); },
    async yo() {
      if (!ses) return null;
      if (!yoCache) { const s = await db('staff/' + ses.uid, 'GET', undefined, true).catch(e => { if (denied(e)) return null; throw e; }); yoCache = s && { uid: ses.uid, rol: s.rol }; }
      return yoCache && Object.assign({ nombre: quien() || 'DAZK' }, yoCache);
    },
    async listar() {
      const [ps, ns, fs, rp] = await Promise.all(['pedidos', 'interno', 'fichas', 'resenas_publicas'].map(n => db(n, 'GET', undefined, true)));
      return Object.entries(ps || {}).map(([t, p]) => Object.assign(shape(t, p, (ns || {})[t]), { fichas: (fs || {})[t] || {}, resenaPublica: !!(rp || {})[t] })).sort((a, b) => b.actualizado - a.actualizado);
    },
    async staffMensaje(id, texto, interno) {
      const me = await this.yo(), ev = { creado: TS, autor: 'dazk', autor_nombre: me.nombre, tipo: interno ? 'nota' : 'mensaje', texto: String(texto).slice(0, 4000) };
      await db((interno ? 'interno/' + id : 'pedidos/' + id + '/eventos'), 'POST', ev, true);
      await db('pedidos/' + id + '/actualizado', 'PUT', TS, true);
    },
    // the quote the client sees in their link; sending it marks the order as quoted
    async enviarCotizacion(id, cot) {
      const me = await this.yo(), k = Date.now().toString(36) + rnd().slice(0, 6);
      await db('pedidos/' + id, 'PATCH', { cotizacion: Object.assign({}, cot, { enviada: TS }), estado: 'cotizado', actualizado: TS,
        ['eventos/' + k]: { creado: TS, autor: 'dazk', autor_nombre: me.nombre, tipo: 'estado', texto: 'Cotizado' },
        ['eventos/' + k + 'm']: { creado: TS, autor: 'dazk', autor_nombre: me.nombre, tipo: 'mensaje', texto: 'Te enviamos tu cotización. Revísala arriba y, si estás de acuerdo, toca «Acepto la cotización».' } }, true);
    },
    async dejarResena(t, r) { await db('pedidos/' + t, 'PATCH', { resena: Object.assign({}, r, { creado: TS }), actualizado: TS }); },
    async publicarResena(p) { await db('resenas_publicas/' + p.id, 'PUT', { nombre: corto(p.nombre), estrellas: p.resena.estrellas, texto: p.resena.texto || '', fecha: TS }, true); },
    async quitarResena(id) { await db('resenas_publicas/' + id, 'DELETE', undefined, true); },
    async resenas() { return Object.values((await jfetch(FB.db + '/resenas_publicas.json?orderBy=' + encodeURIComponent('"fecha"') + '&limitToLast=12')) || {}).sort((a, b) => b.fecha - a.fecha); },
    async aceptarCotizacion(p) {
      const k = Date.now().toString(36) + rnd().slice(0, 6);
      await db('pedidos/' + p.token, 'PATCH', Object.assign({ 'cotizacion/aceptada': TS, actualizado: TS,
        ['eventos/' + k]: { creado: TS, autor: 'cliente', autor_nombre: p.nombre, tipo: 'acepto', texto: 'Aceptó la cotización.' } }, p.estado === 'cotizado' ? { estado: 'confirmado' } : {}));
    },
    async staffEstado(id, est) {
      const me = await this.yo();
      await db('pedidos/' + id, 'PATCH', { estado: est, actualizado: TS }, true);
      await db('pedidos/' + id + '/eventos', 'POST', { creado: TS, autor: 'dazk', autor_nombre: me.nombre, tipo: 'estado', texto: estado(est) }, true);
    },
    // fabrication sheet of one piece ('i0', 'i1'…) or the order's price and delivery ('pago'); staff only, and every save is noted in the history
    async guardarFicha(id, key, data, nota) {
      await db('fichas/' + id + '/' + key, Object.keys(data).length ? 'PUT' : 'DELETE', Object.keys(data).length ? data : undefined, true);
      await this.staffMensaje(id, nota, true);
    },
    // one record per visit to the client page (no personal data unless that device already sent an order); only staff can read them
    async visita(id, data, primera) { await db('visitas/' + id, 'PATCH', Object.assign({ ult: TS }, primera ? { t: TS } : {}, data)); },
    async visitas() { const q = '?orderBy=' + encodeURIComponent('"t"') + '&limitToLast=1000&auth=' + await idToken(); return Object.values((await jfetch(FB.db + '/visitas.json' + q)) || {}).sort((a, b) => b.t - a.t); },
  };

  // ---------- demo (this browser only) ----------
  const ddb = () => load('dazk-demo-db', { folio: 1000, pedidos: [] });
  const now = () => new Date().toISOString();
  function edit(find, fn) {
    const d = ddb(), p = d.pedidos.find(find); if (!p) throw new Error('No encontramos ese pedido.');
    fn(p, t => p.eventos.push(Object.assign({ id: p.eventos.length + 1, creado: now(), interno: false }, t)));
    p.actualizado = now(); save('dazk-demo-db', d);
  }
  const who = () => load('dazk-demo-yo', null);
  const demo = {
    async crearPedido(p) {
      const c = cliente(p), d = ddb(), ped = Object.assign({ id: rnd(), folio: ++d.folio, token: rnd(), estado: 'nuevo', creado: now(), actualizado: now(),
        items: p.items.map((it, i) => Object.assign({ cantidad: 1 }, it, { pos: i + 1 })),
        eventos: [{ id: 1, creado: now(), autor: 'cliente', autor_nombre: c.nombre, tipo: 'creado', texto: 'Pedido enviado desde Crea tu mesa.', interno: false }] }, c);
      d.pedidos.push(ped); save('dazk-demo-db', d);
      return { folio: ped.folio, token: ped.token };
    },
    async verPedido(t) {
      const p = ddb().pedidos.find(x => x.token === t); if (!p) throw new Error('No encontramos ese pedido.');
      return sortP(Object.assign({}, p, { eventos: p.eventos.filter(e => !e.interno) }));
    },
    async clienteMensaje(t, texto) { edit(x => x.token === t, (p, ev) => ev({ autor: 'cliente', autor_nombre: p.nombre, tipo: 'mensaje', texto })); },
    async login(codigo, nombre) { codigoOk(codigo); nombre = String(nombre || '').trim(); if (nombre.length < 2) throw new Error('Escribe tu nombre.'); const me = { nombre, rol: 'admin' }; save('dazk-demo-yo', me); return me; },
    async cambiarCodigo(codigo) { codigoOk(codigo); },
    logout() { save('dazk-demo-yo', null); },
    async yo() { return who(); },
    async listar() { const rp = load('dazk-demo-resenas', {}); return ddb().pedidos.map(p => Object.assign(sortP(p), { resenaPublica: !!rp[p.id] })).sort((a, b) => b.actualizado.localeCompare(a.actualizado)); },
    async staffMensaje(id, texto, interno) { edit(x => x.id === id, (p, ev) => ev({ autor: 'dazk', autor_nombre: who().nombre, tipo: interno ? 'nota' : 'mensaje', texto, interno: !!interno })); },
    async guardarFicha(id, key, data, nota) { edit(x => x.id === id, (p, ev) => { p.fichas = p.fichas || {}; p.fichas[key] = data; ev({ autor: 'dazk', autor_nombre: who().nombre, tipo: 'nota', texto: nota, interno: true }); }); },
    async visita(id, data, primera) { const d = load('dazk-demo-visitas', {}); d[id] = Object.assign({}, d[id], primera ? { t: Date.now() } : {}, { ult: Date.now() }, data); save('dazk-demo-visitas', d); },
    async visitas() { return Object.values(load('dazk-demo-visitas', {})).sort((a, b) => b.t - a.t); },
    async enviarCotizacion(id, cot) { edit(x => x.id === id, (p, ev) => { p.cotizacion = Object.assign({}, cot, { enviada: Date.now() }); p.estado = 'cotizado'; ev({ autor: 'dazk', autor_nombre: who().nombre, tipo: 'estado', texto: 'Cotizado' }); ev({ autor: 'dazk', autor_nombre: who().nombre, tipo: 'mensaje', texto: 'Te enviamos tu cotización. Revísala arriba y, si estás de acuerdo, toca «Acepto la cotización».' }); }); },
    async dejarResena(t, r) { edit(x => x.token === t, p => { p.resena = Object.assign({}, r, { creado: Date.now() }); }); },
    async publicarResena(q) { const d = load('dazk-demo-resenas', {}); d[q.id] = { nombre: corto(q.nombre), estrellas: q.resena.estrellas, texto: q.resena.texto || '', fecha: Date.now() }; save('dazk-demo-resenas', d); },
    async quitarResena(id) { const d = load('dazk-demo-resenas', {}); delete d[id]; save('dazk-demo-resenas', d); },
    async resenas() { return Object.values(load('dazk-demo-resenas', {})).sort((a, b) => b.fecha - a.fecha); },
    async aceptarCotizacion(q) { edit(x => x.token === q.token, (p, ev) => { p.cotizacion.aceptada = Date.now(); if (p.estado === 'cotizado') p.estado = 'confirmado'; ev({ autor: 'cliente', autor_nombre: p.nombre, tipo: 'acepto', texto: 'Aceptó la cotización.' }); }); },
    async staffEstado(id, est) { edit(x => x.id === id, (p, ev) => { p.estado = est; ev({ autor: 'dazk', autor_nombre: who().nombre, tipo: 'estado', texto: estado(est) }); }); },
  };

  window.DAZK_API = Object.assign(FB ? real : demo, { demo: !FB, rnd, canal: canalDe, ESTADOS, estado, waNum, load, save,
    esc: s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    fecha: t => new Date(t).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
    pesos: n => '$' + Number(n).toLocaleString('es-MX', { maximumFractionDigits: 2 }),
    dia: d => d ? new Date(d + 'T12:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }) : '',
    seguimiento: t => new URL('pedido.html#t=' + t, location.href).href });
})();
</script><script>/* DAZK · ficha de fabricación: the workshop's paper sheets (cubierta / MDF / base, vista aérea, volados, especificaciones, pago) as part of each order.
   It starts from what the client designed; every other measure stays empty until the workshop defines it. Volados are calculated, never typed. */
(function () {
  const A = window.DAZK_API, esc = A.esc;
  const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) && n > 0 ? n : null; };
  const spec = (it, k) => { const s = (it.specs || []).find(x => x[0] === k); return s ? s[1] : ''; };
  const SEL = { cMat: ['Piedra sinterizada', 'Mármol', 'Granito', 'Cuarzo', 'Otro'], cAcab: ['Mate', 'Brillante', 'Texturizado'], cCanto: ['Recto', 'Biselado', 'Otro'], cRef: ['Sí', 'No'],
    bAcab: ['Mate', 'Brillante', 'Texturizado'], bNiv: ['Sí', 'No'], bPlac: ['Sí', 'No'] };
  const GROUPS = [
    ['1 · Cubierta', [['cL', 'Largo (cm)', 'n'], ['cW', 'Ancho (cm)', 'n'], ['cEsp', 'Espesor (mm)', 'n'], ['cMat', 'Material'], ['cMarca', 'Marca / modelo'], ['color', 'Color / piedra'], ['cAcab', 'Acabado'], ['cCanto', 'Tipo de canto'], ['cRef', 'Refuerzo inferior']]],
    ['2 · MDF', [['mL', 'Largo (cm)', 'n'], ['mW', 'Ancho (cm)', 'n'], ['mEsp', 'Espesor (mm)', 'n'], ['mMat', 'Material del MDF']]],
    ['3 · Base de herrería', [['bL', 'Largo (cm)', 'n'], ['bW', 'Ancho (cm)', 'n'], ['bH', 'Alto (cm)', 'n'], ['bDis', 'Diseño de la base'], ['bColor', 'Color de pintura'], ['bAcab', 'Acabado'], ['bPint', 'Tipo de pintura'], ['bNiv', 'Niveladores'], ['bPlac', 'Placas de montaje']]],
    ['Mesa terminada', [['alto', 'Altura total (cm)', 'n'], ['obs', 'Observaciones de fabricación', 't']]],
  ];
  const PAGO = [['total', 'Precio total ($)', 'n'], ['anticipo', 'Anticipo ($)', 'n'], ['entrega', 'Fecha de entrega', 'd'], ['direccion', 'Dirección de entrega'], ['condiciones', 'Condiciones para el cliente (las ve en su cotización)', 't'], ['obs', 'Observaciones internas', 't']];

  // the client's design, read from the order line
  function inicio(it) {
    const m = spec(it, 'Medidas'), r = /Ø\s*(\d+)/.exec(m), d = /(\d+)\s*×\s*(\d+)/.exec(m);
    return { forma: r ? 'round' : spec(it, 'Forma') === 'Ovalada' ? 'oval' : 'rect', cL: r ? r[1] : d ? d[1] : '', cW: r ? '' : d ? d[2] : '',
      alto: (/(\d+)/.exec(spec(it, 'Altura')) || [])[1] || '', color: spec(it, 'Piedra'), bDis: spec(it, 'Base'), bColor: spec(it, 'Acabado') };
  }
  const valores = (p, it, i) => Object.assign(inicio(it), (p.fichas || {})['i' + i] || {});
  const medidas = v => ['cL', 'mL', 'bL', 'bH', 'alto', 'cEsp'].concat(v.forma === 'round' ? [] : ['cW', 'mW', 'bW']);
  const faltan = v => medidas(v).filter(k => !num(v[k])).length;
  const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ',');

  // volados and checks, all derived from the three pieces (assumed centred, as in the workshop sheets)
  function calculo(v) {
    const g = k => num(v[k]), round = v.forma === 'round', out = [], warn = [];
    const pair = (a, b, la, mal, eje) => { if (g(a) && g(b)) { const d = (g(a) - g(b)) / 2; out.push([`${la} ${eje}`, fmt(d) + ' cm']); if (d < 0 && !warn.includes(mal)) warn.push(mal); } };
    const ejeL = round ? 'todo alrededor' : 'izquierdo y derecho', ejeW = 'frontal y posterior';
    pair('cL', 'mL', 'Volado de la cubierta sobre el MDF,', 'El MDF es más grande que la cubierta.', ejeL); if (!round) pair('cW', 'mW', 'Volado de la cubierta sobre el MDF,', 'El MDF es más grande que la cubierta.', ejeW);
    pair('cL', 'bL', 'Volado de la cubierta sobre la base,', 'La base es más grande que la cubierta.', ejeL); if (!round) pair('cW', 'bW', 'Volado de la cubierta sobre la base,', 'La base es más grande que la cubierta.', ejeW);
    pair('mL', 'bL', 'El MDF sobresale de la base,', 'La base es más grande que el MDF.', ejeL); if (!round) pair('mW', 'bW', 'El MDF sobresale de la base,', 'La base es más grande que el MDF.', ejeW);
    if (g('alto') && g('bH') && g('cEsp')) { const resto = g('alto') - g('bH') - g('cEsp') / 10; out.push(['Queda para MDF y pegamento', fmt(resto) + ' cm']);
      if (resto < 0) warn.push('La base más la cubierta ya pasan la altura total.'); else if (g('mEsp') && Math.abs(resto - g('mEsp') / 10) > .3) warn.push(`Base + MDF + cubierta suman ${fmt(g('bH') + g('mEsp') / 10 + g('cEsp') / 10)} cm y la altura total dice ${fmt(g('alto'))} cm.`); }
    return { out, warn };
  }
  // vista aérea encimada, to scale
  function dibujo(v, print) {
    const g = k => num(v[k]), round = v.forma === 'round', L = g('cL'), W = round ? L : g('cW');
    if (!L || !W) return '<p class="lead">Escribe las medidas de la cubierta para ver la vista aérea.</p>';
    const k = Math.min(300 / L, 190 / W), cx = 180, cy = 120, ink = print ? '#000' : '#ece4d6';
    const shape = (a, b, fill, stroke, sw, rx) => { const w = (g(a) || 0) * k, h = (round ? g(a) || 0 : g(b) || 0) * k; if (!w || !h) return '';
      return round ? `<circle cx="${cx}" cy="${cy}" r="${w / 2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>` : `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${rx ? Math.min(w, h) / 2 : 0}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`; };
    return `<svg viewBox="0 0 360 250" role="img" aria-label="Vista aérea: cubierta, MDF y base">${shape('cL', 'cW', '#e9e3d8', '#8a7f6d', 1.5, v.forma === 'oval')}${shape('mL', 'mW', '#c9a06a', '#8a6a3a', 1)}${shape('bL', 'bW', 'none', '#1b1b1b', 4)}
      <text x="${cx}" y="${cy - W * k / 2 - 8}" text-anchor="middle" font-size="12" fill="${ink}">${round ? 'Ø ' : ''}${fmt(L)} cm</text>${round ? '' : `<text x="${cx + L * k / 2 + 6}" y="${cy + 4}" font-size="12" fill="${ink}">${fmt(W)}</text>`}
      <g font-size="10" fill="${ink}"><rect x="8" y="232" width="10" height="10" fill="#e9e3d8"/><text x="22" y="241">Cubierta</text><rect x="80" y="232" width="10" height="10" fill="#c9a06a"/><text x="94" y="241">MDF</text><rect x="130" y="232" width="10" height="10" fill="none" stroke="${print ? '#000' : '#888'}" stroke-width="2"/><text x="144" y="241">Base</text></g></svg>`;
  }
  function campo(pre, [k, label, tipo], v, round) {
    if (round && /W$/.test(k)) return '';
    const id = pre + k, val = esc(v[k] == null ? '' : v[k]), lab = round && /L$/.test(k) ? 'Diámetro (cm)' : label;
    const inp = SEL[k] ? `<select id="${id}" data-k="${k}"><option value="">Por definir</option>${SEL[k].map(o => `<option ${o === v[k] ? 'selected' : ''}>${o}</option>`).join('')}</select>`
      : tipo === 't' ? `<textarea id="${id}" data-k="${k}" rows="2" maxlength="600">${val}</textarea>`
      : `<input id="${id}" data-k="${k}" ${tipo === 'n' ? 'type="text" inputmode="decimal" maxlength="9"' : tipo === 'd' ? 'type="date"' : 'type="text" maxlength="120"'} value="${val}" placeholder="Por definir">`;
    return `<label for="${id}" class="${tipo === 't' ? 'wide' : ''}">${lab}${inp}</label>`;
  }
  const resumen = v => { const c = calculo(v); return `<div class="draw">${dibujo(v)}</div>${c.out.length ? `<dl class="specs">${c.out.map(o => `<div><dt>${o[0]}</dt><i></i><dd>${o[1]}</dd></div>`).join('')}</dl>` : ''}${c.warn.map(w => `<p class="err">${esc(w)}</p>`).join('')}`; };
  const leer = root => { const v = {}; root.querySelectorAll('[data-k]').forEach(e => { const t = e.value.trim(); if (t) v[e.dataset.k] = t; }); return v; };

  function html(p, it, i) {
    const v = valores(p, it, i), n = faltan(v), round = v.forma === 'round';
    return `<details class="fab" data-i="${i}"><summary>Ficha de fabricación <em class="badge ${n ? '' : 'nuevo'}">${n ? 'faltan ' + n + ' medidas' : 'completa'}</em></summary>
      <form data-forma="${v.forma}"><div class="calc">${resumen(v)}</div>
      ${GROUPS.map(g => `<fieldset><legend>${g[0]}</legend><div class="grid">${g[1].map(f => campo('f' + i, f, v, round)).join('')}</div></fieldset>`).join('')}
      <p class="err" role="alert" hidden></p><div class="two"><button type="submit" class="btn gold">Guardar ficha</button><button type="button" class="btn" data-print>Imprimir hoja de taller</button></div></form></details>`;
  }
  // what the client sees for each piece: the sheet's final values, falling back to what they designed
  function detalle(p, it, i) {
    if (it.tipo !== 'mesa') return [['Cantidad', String(it.cantidad || 1)], ['Modelo y tapiz', 'Por definir con DAZK']];
    const v = valores(p, it, i), round = v.forma === 'round', d = [];
    const add = (k, x) => { if (x) d.push([k, String(x)]); };
    add('Medidas', num(v.cL) ? (round ? 'Ø ' + fmt(num(v.cL)) + ' cm' : num(v.cW) ? fmt(num(v.cL)) + ' × ' + fmt(num(v.cW)) + ' cm' : '') : spec(it, 'Medidas'));
    add('Altura', num(v.alto) ? fmt(num(v.alto)) + ' cm' : spec(it, 'Altura'));
    add('Cubierta', [v.cMat, v.color].filter(Boolean).join(' · '));
    add('Espesor', num(v.cEsp) ? fmt(num(v.cEsp)) + ' mm' : '');
    add('Acabado de la piedra', v.cAcab); add('Canto', v.cCanto);
    add('Base', [v.bDis, v.bColor, v.bAcab].filter(Boolean).join(' · '));
    if (+it.cantidad > 1) add('Cantidad', String(it.cantidad));
    return d;
  }
  function cotizacion(p, v) {
    const c = { total: num(v.total), items: p.items.map((it, i) => ({ titulo: it.titulo, detalle: detalle(p, it, i) })) };
    if (num(v.anticipo)) c.anticipo = num(v.anticipo);
    if (v.entrega) c.entrega = v.entrega;
    if (v.condiciones) c.condiciones = String(v.condiciones).slice(0, 600);

        <dl class="specs">${(it.specs || []).map(s => `<div><dt>${esc(s[0])}</dt><i></i><dd>${esc(s[1])}</dd></div>`).join('')}</dl>
        ${/^https?:\/\//.test(it.link || '') ? `<a class="link" href="${esc(it.link)}" target="_blank" rel="noopener">Abrir el diseño en 3D →</a>` : ''}
        ${it.tipo === 'mesa' ? window.DAZK_FICHA.html(p, it, i) : ''}</article>`).join('')}
        ${window.DAZK_FICHA.pagoHtml(p)}
        ${p.notas ? `<p class="note"><b>Notas del cliente:</b> ${esc(p.notas)}</p>` : ''}</section>
      <section><span class="k">Historial</span><ol class="tl">${p.eventos.map(e => `<li class="${e.autor === 'cliente' ? 'cliente' : 'dazk'}${e.tipo === 'mensaje' ? ' msg' : ''}${e.interno ? ' int' : ''}">
        <div><b>${e.autor === 'cliente' ? esc(e.autor_nombre) + ' (cliente)' : esc(e.autor_nombre)}${e.interno ? ' · nota interna' : ''}</b><time>${A.fecha(e.creado)}</time></div>
        <p>${e.tipo === 'estado' ? 'Cambió el estado a: ' + esc(e.texto) : esc(e.texto)}</p></li>`).join('')}</ol>
        <form id="m-form"><textarea id="m-text" rows="3" maxlength="4000" placeholder="Mensaje para el cliente: cotización, dudas de medida, fecha de entrega…"></textarea>
        <label class="chk"><input type="checkbox" id="m-int"> Nota interna (el cliente no la ve)</label>
        <p class="err" id="m-err" role="alert" hidden></p><button class="btn gold" type="submit">Guardar en el historial</button></form></section>`;
    $('#m-text').value = draft;
    main.querySelectorAll('details.fab').forEach(d => { d.open = abiertas.includes(d.dataset.i); });
    window.DAZK_FICHA.bind(main, p, () => reload());
    $('#estado').onchange = async e => { e.target.disabled = true; try { await A.staffEstado(p.id, e.target.value); } catch (x) { alert(x.message); } await reload(); };
    $('#m-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const el = $('#m-text'), txt = el.value.trim(); if (!txt) return el.focus();
      const b = ev.target.querySelector('button'); b.disabled = true;
      try { await A.staffMensaje(p.id, txt, $('#m-int').checked); el.value = draft = ''; await reload(); } catch (e) { $('#m-err').textContent = e.message; $('#m-err').hidden = false; b.disabled = false; }
    });
  }
  // who came to the client page: counts and the latest visits
  async function visitas() {
    if (!$('#v-list')) main.innerHTML = '<a class="back" href="#">‹ Pedidos</a><span class="k">Taller DAZK</span><h1>Visitas</h1><p class="lead">Cargando…</p>';
    let all; try { all = await A.visitas(); } catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    if (location.hash !== '#visitas') return;
    const PASO = ['Vio modelos', 'Ajustó el tamaño', 'Eligió materiales', 'Llegó a cotizar'], USO = { comedor: 'Comedor', periquera: 'Periquera', centro: 'Mesa de centro', auxiliar: 'Mesa auxiliar' };
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0); const sem = hoy.getTime() - 6 * 864e5;
    const fila = (titulo, l) => `<tr><th>${titulo}</th><td>${l.length}</td><td>${new Set(l.map(x => x.v)).size}</td><td>${l.filter(x => x.paso >= 3).length}</td><td>${l.filter(x => x.folio).length}</td></tr>`;
    main.innerHTML = `<a class="back" href="#">‹ Pedidos</a><span class="k">Taller DAZK</span><h1>Visitas</h1>
      <p class="lead">Quién entró a Crea tu mesa. El nombre solo aparece si esa persona ya envió un pedido desde ese mismo celular o computadora; los demás son visitantes anónimos.</p>
      <div class="scroll"><table class="tab"><thead><tr><th></th><th>Visitas</th><th>Personas</th><th>Llegaron a cotizar</th><th>Enviaron pedido</th></tr></thead><tbody>
        ${fila('Hoy', all.filter(x => x.t >= hoy.getTime()))}${fila('Últimos 7 días', all.filter(x => x.t >= sem))}${fila('Últimas ' + all.length, all)}</tbody></table></div>
      <section><span class="k">Visitas recientes</span>${all.length ? `<ul class="rows" id="v-list">${all.slice(0, 100).map(x => `<li><a><b>${x.nombre ? esc(x.nombre) : 'Visitante'}${x.folio ? ` <mark>pedido #${esc(x.folio)}</mark>` : ''}</b>
        <span>${esc(USO[x.uso] || 'Sin elegir')}${x.modelo ? ' · modelo ' + esc(x.modelo.charAt(0).toUpperCase() + x.modelo.slice(1)) : ''} · ${PASO[x.paso] || PASO[0]}</span>
        <span class="meta">${A.fecha(x.t)} · ${esc(x.disp || '')} · llegó por: ${esc(x.origen || 'directo')}${x.ult - x.t > 60000 ? ' · estuvo ' + Math.round((x.ult - x.t) / 60000) + ' min' : ''}</span></a></li>`).join('')}</ul>` : '<p class="lead" id="v-list">Todavía no hay visitas registradas.</p>'}</section>`;
  }
  // change the shared code (everyone else uses the new one from then on)
  function codigo() {
    main.innerHTML = `<a class="back" href="#">‹ Pedidos</a><span class="k">Taller DAZK</span><h1>Código de <em>acceso.</em></h1>
      <p class="lead">Todos los de DAZK entran con el mismo código de 8 números. Si alguien deja de trabajar con ustedes, cámbialo y pásale el nuevo solo a quien deba entrar.</p>
      <form id="c-form" class="card"><label for="c-1">Nuevo código<input type="password" id="c-1" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="new-password" required></label>
      <label for="c-2">Repítelo<input type="password" id="c-2" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="new-password" required></label>
      <p class="err" id="c-err" role="alert" hidden></p><button class="btn gold" type="submit">Cambiar código</button></form>`;
    $('#c-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const b = ev.target.querySelector('button'), say = t => { $('#c-err').textContent = t; $('#c-err').hidden = false; };
      if ($('#c-1').value !== $('#c-2').value) return say('Los dos códigos no coinciden.');
      b.disabled = true;
      try { await A.cambiarCodigo($('#c-1').value.trim()); ev.target.outerHTML = '<p class="note">Listo. Desde ahora se entra con el código nuevo.</p>'; } catch (e) { say(e.message); b.disabled = false; }
    });
  }
  window.addEventListener('hashchange', () => { draft = ''; if (me) render(); window.scrollTo(0, 0); });
  setInterval(() => { if (me && !document.hidden) reload(true); }, 30000);
  A.yo().then(u => { me = u; me ? reload() : login(); }, e => login(e.message));
});
</script></body></html>
