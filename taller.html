<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0907;--sheet:#13100d;--line:rgba(236,228,214,.12);--ink:#ece4d6;--mut:#9a8f7d;--g:#c2a273;--g2:#d9bd8c;--gl:rgba(194,162,115,.42);--wa:#25d366;
--serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;--sans:'Jost','Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:300 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--g)}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);max-width:860px;margin:0 auto}
.top img{height:40px;mix-blend-mode:lighten}.top span{margin-left:auto;font-size:13px;color:var(--mut)}.top button{color:var(--g);text-decoration:underline;text-underline-offset:3px}
.demo{background:#7a4a12;color:#fff;font-size:12px;text-align:center;padding:6px 12px}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
.k{display:block;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--g);margin-bottom:8px}
h1{font:300 clamp(30px,7vw,44px)/1.05 var(--serif);margin-bottom:6px;overflow-wrap:anywhere}h1 em{color:var(--g)}
h3{font:400 21px/1.2 var(--serif);margin-bottom:6px;overflow-wrap:anywhere}
.lead{color:var(--mut);font-size:15px;margin-bottom:16px}
section{margin-top:28px}
.card{border:1px solid var(--gl);padding:16px;margin-top:12px;background:var(--sheet)}
dl.specs div{display:flex;align-items:baseline;gap:10px;padding:4px 0}
dl.specs dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
dl.specs i{flex:1;border-bottom:1px dotted rgba(194,162,115,.4);min-width:10px}dl.specs dd{font-size:14.5px;text-align:right}
.link{display:inline-block;margin-top:10px;font-size:13.5px;text-underline-offset:3px}
.note{margin-top:12px;padding:10px 12px;border-left:2px solid var(--g);background:rgba(194,162,115,.1);font-size:14px;overflow-wrap:anywhere}
.track{list-style:none;display:flex;margin:18px 0 4px}
.track li{flex:1;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:center;line-height:1.3}
.track i{display:block;height:3px;background:var(--line);margin:0 2px 8px}
.track .done{color:#cfc5b4}.track .done i{background:rgba(194,162,115,.5)}.track .on{color:var(--g)}.track .on i{background:var(--g)}
.tl{list-style:none;margin-top:6px}
.tl li{padding:12px 0 12px 14px;border-left:1px solid var(--gl);position:relative}
.tl li::before{content:'';position:absolute;left:-4px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--g)}
.tl li div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.tl b{font-weight:400;font-size:13px;color:var(--g2)}.tl time{font-size:12px;color:var(--mut)}
.tl p{font-size:14.5px;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere}
.tl li.msg p{color:var(--ink);background:var(--sheet);border:1px solid var(--line);padding:10px 12px;margin-top:6px}
.tl li.cliente::before{background:var(--ink)}.tl li.cliente b{color:var(--ink)}
.tl li.int p{color:var(--ink);background:rgba(217,180,90,.1);border:1px dashed rgba(217,180,90,.5);padding:10px 12px;margin-top:6px}
form{margin-top:14px}
label{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);margin:10px 0 0}label.chk input{width:20px;height:20px;accent-color:var(--g)}
input:not([type=checkbox]),textarea,select{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:300 16px/1.5 var(--sans);padding:12px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:10px 16px;border:1px solid var(--gl);color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-align:center;width:100%;margin-top:12px}
.btn.gold{background:var(--g);border-color:var(--g);color:#0b0907;font-weight:400}.btn.wa{background:var(--wa);border-color:var(--wa);color:#08140c;font-weight:400}.btn:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.two{grid-template-columns:1fr;gap:0}}
.err{margin-top:12px;padding:10px 12px;border-left:2px solid #d98a6a;background:rgba(217,138,106,.12);font-size:13.5px}[hidden]{display:none!important}
.rows{list-style:none;margin-top:14px}.rows a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rows b{display:block;font:400 20px/1.2 var(--serif);overflow-wrap:anywhere}.rows span{display:block;font-size:13.5px;color:var(--mut);overflow-wrap:anywhere}.rows .meta{margin-top:6px;font-size:12px}
mark{background:var(--g);color:#0b0907;font:400 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;vertical-align:middle}
.badge{display:inline-block;font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gl);padding:2px 8px;color:var(--g2);margin-right:6px}
.badge.nuevo{background:var(--g);color:#0b0907;border-color:var(--g)}.badge.entregado,.badge.cancelado,.badge.off{color:var(--mut);border-color:var(--line)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);padding:8px 12px;font-size:13px;color:var(--mut);white-space:nowrap}.filters button.on{border-color:var(--g);color:var(--ink);background:rgba(194,162,115,.13)}.filters b{font-weight:400;color:var(--g)}
.back{display:inline-block;margin-bottom:14px;font-size:13px;text-decoration:none}
details.fab{margin-top:14px;border-top:1px solid var(--line)}section>details.fab{border:1px solid var(--gl);background:var(--sheet);padding:0 16px;margin-top:12px}
details.fab summary{cursor:pointer;list-style:none;padding:14px 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.fab summary::-webkit-details-marker{display:none}details.fab summary::after{content:'+';margin-left:auto;font:300 24px/1 var(--serif)}details.fab[open] summary::after{content:'–'}
details.fab summary .badge{margin:0;letter-spacing:.08em}details.fab form{margin:0 0 16px}
.draw svg{width:100%;max-width:420px;display:block;margin:0 auto}
fieldset{border:0;margin-top:18px}legend{font:400 19px/1.2 var(--serif);color:var(--ink);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px}.grid label.wide{grid-column:1/-1}
.scroll{overflow-x:auto;margin-top:8px}.tab{border-collapse:collapse;width:100%;font-size:14px}.tab th,.tab td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:right;font-weight:300;font-variant-numeric:tabular-nums}.tab th:first-child{text-align:left;color:var(--g2)}.tab thead th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.tab td{font:400 20px/1 var(--serif)}
.cot .card{border-color:var(--g)}.cot-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;border-bottom:1px solid var(--gl);padding-bottom:10px;margin-bottom:6px;font-size:13px;color:var(--mut)}.cot-h b{color:var(--g);letter-spacing:.3em}
.cot h3{margin-top:14px}.specs.tot{margin-top:14px;border-top:1px solid var(--gl);padding-top:8px}.specs.tot dd{font:400 22px/1.2 var(--serif);color:var(--g2)}
.ok{margin-top:14px;padding:10px 12px;border-left:2px solid var(--wa);background:rgba(37,211,102,.1);font-size:14.5px}
@media print{body:has(#cot)>*:not(main),body:has(#cot) main>*:not(#cot),#cot .btn,#cot .lead,#cot .two,#cot .err,#cot>.k{display:none!important}
body:has(#cot){background:#fff!important}#cot .card{background:#fff;border:0;color:#000;padding:0}#cot *{color:#000!important}#cot dl.specs i{border-color:#999}}
.funnel .fl{display:grid;grid-template-columns:minmax(110px,38%) 1fr 44px 44px;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}.funnel .fl i{display:block;height:10px;background:var(--g);min-width:2px}
.funnel .fl b{font:400 20px/1 var(--serif);text-align:right}.funnel .fl em{font-style:normal;font-size:12px;color:var(--mut);text-align:right}
.canales{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0 10px}.canal{padding:12px}.canal h3{font-size:18px}.canal .two{grid-template-columns:1fr;gap:0}.canal .btn{min-height:44px;margin-top:8px;font-size:11px;letter-spacing:.1em}.canal code{display:block;font-size:12px;color:var(--mut);overflow-wrap:anywhere;margin:4px 0 10px}
.qr{background:#fff;padding:8px;width:120px;margin:0 auto}.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
.stars{display:flex;gap:6px}.stars button{font-size:34px;line-height:1;color:var(--line);min-width:44px;min-height:44px}.stars button.on{color:var(--g)}
#print{display:none}
@media print{html,body{background:#fff!important}body>*:not(#print){display:none!important}
#print{display:block;color:#000;font:13px/1.4 Arial,sans-serif;padding:0}
#print header{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;font-size:15px}#print header b{letter-spacing:.3em}#print header span{font-size:12px}
#print h2{font:700 18px/1.2 Arial,sans-serif;margin:12px 0 2px}#print h3{font:700 13px/1.2 Arial,sans-serif;color:#000;margin:12px 0 4px;text-transform:uppercase}
#print .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}#print svg{width:100%;border:1px solid #999}
#print table{width:100%;border-collapse:collapse;margin-top:6px}#print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left;font-weight:400;font-size:12px}#print th{width:58%;background:#f1f1f1}#print td i{color:#777}
#print .firma{margin-top:28px}}
#nav{display:flex;gap:6px;overflow-x:auto;max-width:860px;margin:0 auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}#nav:empty{display:none}
#nav a{flex:none;border:1px solid var(--line);padding:8px 12px;font-size:13px;color:var(--mut);text-decoration:none;white-space:nowrap}#nav a.on{border-color:var(--g);color:var(--ink);background:rgba(194,162,115,.13)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 10px}.kpis .card span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.kpis .card b{display:block;font:400 26px/1.2 var(--serif);color:var(--g2);margin-top:4px;overflow-wrap:anywhere}.kpis .card small{font-size:12px;color:var(--mut)}.kpis .neg b{color:#d98a6a}.kpis.sm .card b{font-size:22px}
.mes{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 4px}.mes b{font:400 22px/1 var(--serif);text-transform:capitalize;min-width:170px;text-align:center}.mes button{border:1px solid var(--gl);min-width:44px;min-height:44px;font-size:22px;color:var(--g)}.mes button:disabled{opacity:.3}
.mini{list-style:none;margin:8px 0}.mini li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.mini li span{flex:1 1 180px;color:var(--mut);overflow-wrap:anywhere}.mini li span b{color:var(--ink);font-weight:400}.mini li>b{font:400 19px/1 var(--serif);color:var(--g2)}
.mini.big{margin-top:14px}.x{font-size:12px;color:var(--mut);text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 4px}.x[data-armed]{color:#d98a6a}
mark.late{background:#d98a6a}.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px}.checks label.chk{margin:8px 0 0}.checks small{color:var(--mut);font-size:12px}
.acts2{display:flex!important;gap:14px;margin-top:4px}.prod{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}.tab td.t{font:300 14px/1.4 var(--sans)}
.card>.specs.tot:first-child{border-top:0;margin-top:0;padding-top:0}
.alt{margin-top:16px;font-size:14px;color:var(--mut)}.alt button,.top a{color:var(--g);text-decoration:underline;text-underline-offset:3px}
</style></head><body>

<script>window.DAZK_FB={"apiKey":"AIzaSyBBJqI7K_xY9RDPFzAVedS_5EyplehRATg","db":"https://dazk-pedidos-default-rtdb.firebaseio.com"};window.DAZK_WA=[{"label":"+52 55 5109 0027","num":"525551090027"},{"label":"+52 55 8556 1037","num":"525585561037"}];</script><script>/* DAZK · pedidos: one data layer for the client page, the client's tracking page and the workshop panel.
   With window.DAZK_FB = { apiKey, db } it talks to Firebase (Realtime Database + Auth over REST; rules in firebase/database.rules.json).
   Without it, it runs in demo mode: everything stays in this browser's localStorage.
   Clients are anonymous: an order lives at pedidos/<secret token>, readable only by whoever has the token.
   DAZK staff enter with email and password. The owner's email is fixed (OWNER) and the owner adds or removes admins in admins/<email with . as ,>.
   A new admin gets an email with a link to create their password (a Firebase password reset that opens taller.html); that also confirms the email, which the rules require. */
(function () {
  const FB = window.DAZK_FB || null, SITE = 'https://creadazk.github.io/';
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const ESTADOS = [['nuevo', 'Recibido'], ['cotizado', 'Cotizado'], ['confirmado', 'Confirmado'], ['fabricacion', 'En fabricación'], ['listo', 'Listo'], ['entregado', 'Entregado'], ['cancelado', 'Cancelado']];
  const estado = k => (ESTADOS.find(e => e[0] === k) || [k, k])[1];
  const digits = t => String(t || '').replace(/\D/g, '');
  // Mexican numbers are stored as typed; WhatsApp links need the country code
  const waNum = t => { const d = digits(t); return d.length === 10 ? '52' + d : d; };
  const sortP = p => { p.items = (p.items || []).slice().sort((a, b) => a.pos - b.pos); p.eventos = (p.eventos || []).slice().sort((a, b) => a.id - b.id); return p; };
  const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  // where a visitor came from, as a short channel name: a campaign link (?c=instagram) or the site that sent them
  function canalDe(x) {
    const s = String(x || '').toLowerCase();
    if (/instagram/.test(s)) return 'instagram'; if (/facebook|fb\.(com|me)|messenger/.test(s)) return 'facebook'; if (/whatsapp|wa\.me/.test(s)) return 'whatsapp';
    if (/tiktok/.test(s)) return 'tiktok'; if (/google/.test(s)) return 'google'; if (s === 'link compartido') return 'compartido';
    return s.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').slice(0, 30);
  }

      <section><span class="k">Hoy hay que escribirle a</span>${seg.length ? seg.map(([p, por, txt]) => `<div class="card"><h3>#${esc(p.folio)} · ${esc(p.nombre)}</h3><p class="lead">${esc(por)}</p>
        <div class="two">${p.tel ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(p, txt))}">Mandar WhatsApp</a>` : '<span class="note">No dejó WhatsApp: escríbele en su pedido.</span>'}<a class="btn" href="#p=${esc(p.id)}">Abrir pedido</a></div></div>`).join('') : '<p class="lead">Nadie pendiente. Bien.</p>'}</section>
      <section><span class="k">Embudo de ventas</span><div class="card funnel">${pasos.map((s, i) => `<div class="fl"><span>${s[0]}</span><i style="width:${Math.max(2, s[1] / max * 100)}%"></i><b>${s[1]}</b><em>${i ? pct(s[1], pasos[i - 1][1]) : ''}</em></div>`).join('')}
        <dl class="specs tot"><div><dt>Vendido (cotizaciones aceptadas)</dt><i></i><dd>${A.pesos(monto(acep))}</dd></div><div><dt>Cotizado en total</dt><i></i><dd>${A.pesos(monto(cot))}</dd></div>${acep.length ? `<div><dt>Venta promedio</dt><i></i><dd>${A.pesos(Math.round(monto(acep) / acep.length))}</dd></div>` : ''}</dl>
        ${vis.length >= 1000 ? '<p class="lead">Las visitas cuentan solo las últimas 1000.</p>' : ''}</div></section>
      <section><span class="k">¿Qué canal vende?</span>${filas.length ? `<div class="scroll"><table class="tab"><thead><tr><th>Canal</th><th>Visitas</th><th>A cotizar</th><th>Apartaron</th><th>Aceptaron</th><th>Vendido</th></tr></thead><tbody>
        ${filas.map(([c, r]) => `<tr><th>${esc(label(c))}</th><td>${r.v}</td><td>${r.cot}</td><td>${r.ped}</td><td>${r.ac}</td><td>${r.monto ? A.pesos(r.monto) : '—'}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="lead">Todavía no hay datos en este periodo.</p>'}<p class="lead">Para que esto funcione, usa en cada lugar su propio link o QR de aquí abajo.</p></section>
      <section><span class="k">Tus links y QR por canal</span><div class="canales">${lista.map(([c, n]) => `<div class="card canal"><h3>${esc(n)}</h3><code>${esc(linkDe(c))}</code>
        <div class="qr" data-qr="${esc(c)}"></div><div class="two"><button type="button" class="btn" data-copy="${esc(c)}">Copiar link</button><button type="button" class="btn" data-png="${esc(c)}">Descargar QR</button></div></div>`).join('')}</div>
        <form id="mk-new" class="card"><label for="mk-c">Otro canal (por ejemplo: expo-mueble, revista, constructora-x)<input type="text" id="mk-c" maxlength="30" placeholder="nombre-del-canal"></label><button class="btn gold" type="submit">Crear link y QR</button></form></section>
      <section><span class="k">Opiniones de clientes</span>${all.filter(p => p.resena).length ? all.filter(p => p.resena).map(p => `<div class="card"><h3>${'★'.repeat(p.resena.estrellas)}${'☆'.repeat(5 - p.resena.estrellas)} · ${esc(p.nombre)}</h3>
        ${p.resena.texto ? `<p>${esc(p.resena.texto)}</p>` : ''}<p class="lead">${p.resena.publicar ? 'Dio permiso de publicarla con su nombre.' : 'No dio permiso de publicarla.'}${p.resenaPublica ? ' · <b>Publicada en la página</b>' : ''}</p>
        ${p.resena.publicar ? `<button type="button" class="btn ${p.resenaPublica ? '' : 'gold'}" data-pub="${esc(p.id)}">${p.resenaPublica ? 'Quitar de la página' : 'Publicar en la página'}</button>` : ''}</div>`).join('')
        : '<p class="lead">Cuando marquen un pedido como Entregado, el cliente verá en su link un cuadro para calificar con estrellas. Aquí aparecen y ustedes eligen cuáles salen en la página.</p>'}</section>`;

    main.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { periodo = +b.dataset.per; render(main, all, reload); });

    main.querySelector('#mk-new').onsubmit = e => { e.preventDefault(); const c = A.canal($('#mk-c').value); if (!c || NOMBRE[c] || extra.includes(c)) return; extra.push(c); A.save('dazk-canales-extra', extra); render(main, all, reload); };
    main.querySelectorAll('[data-pub]').forEach(b => b.onclick = async () => { b.disabled = true; const p = all.find(x => x.id === b.dataset.pub);
      try { p.resenaPublica ? await A.quitarResena(p.id) : await A.publicarResena(p); await reload(); } catch (e) { alert(e.message); b.disabled = false; } });
    try {
      await loadQR();
      main.querySelectorAll('[data-qr]').forEach(el => { new QRCode(el, { text: linkDe(el.dataset.qr), width: 512, height: 512, colorDark: '#0b0907', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); });
      main.querySelectorAll('[data-png]').forEach(b => b.onclick = () => { const cv = main.querySelector(`[data-qr="${CSS.escape(b.dataset.png)}"] canvas`); if (!cv) return;
        const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'QR DAZK ' + b.dataset.png + '.png'; document.body.appendChild(a); a.click(); a.remove(); });
    } catch (e) { main.querySelectorAll('[data-qr]').forEach(el => { el.textContent = 'No se pudo cargar el QR (revisa tu internet).'; }); }

})();
</script><script>/* DAZK · gestión inside the panel (taller.html): monthly summary, payments per order, what is still owed, expenses, clients, and orders captured by hand
   (clients who came by WhatsApp or to the showroom). Money comes only from what staff record; nothing is estimated. */
(function () {
  const A = window.DAZK_API, esc = A.esc, $ = s => document.querySelector(s);
  const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return isFinite(n) ? n : 0; };
  const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const mesNombre = m => { const [y, n] = m.split('-'); return MESES[+n - 1] + ' ' + y; };
  const mover = (m, d) => { const [y, n] = m.split('-').map(Number), t = new Date(y, n - 1 + d, 1); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); };
  let mes = hoy().slice(0, 7);
  const ym = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const METODOS = ['Transferencia', 'Efectivo', 'Tarjeta', 'Depósito', 'Otro'];
  const CATS = ['Piedra / placa', 'Herrería / base', 'MDF y madera', 'Mano de obra', 'Flete y entrega', 'Publicidad', 'Renta y servicios', 'Herramienta', 'Otro'];
  const CANALES = [['whatsapp', 'WhatsApp'], ['showroom', 'Showroom / en persona'], ['instagram', 'Instagram'], ['facebook', 'Facebook'], ['marketplace', 'Marketplace'], ['recomendacion', 'Recomendación'], ['otro', 'Otro']];

  // an order's money: the price comes from the quote (or the price typed in the sheet), payments are what staff recorded
  const total = p => p.cotizacion ? p.cotizacion.total : num(((p.fichas || {}).pago || {}).total);
  const pagado = p => (p.pagos || []).reduce((s, x) => s + x.monto, 0);
  const vendido = p => !!(p.cotizacion && p.cotizacion.aceptada) || ['confirmado', 'fabricacion', 'listo', 'entregado'].includes(p.estado);
  const saldo = p => p.estado === 'cancelado' || !vendido(p) ? 0 : Math.max(0, total(p) - pagado(p));
  const entrega = p => ((p.fichas || {}).pago || {}).entrega || (p.cotizacion && p.cotizacion.entrega) || '';
  const abierto = p => p.estado !== 'entregado' && p.estado !== 'cancelado';
  const nom1 = p => p.nombre.split(' ')[0];
  // a button that asks "are you sure" on the first tap (the viewer has no confirm dialogs)
  function dosToques(b, fn) {
    b.onclick = async () => {
      if (!b.dataset.armed) { b.dataset.armed = b.textContent; b.textContent = '¿Seguro? Toca otra vez'; setTimeout(() => { if (b.dataset.armed) { b.textContent = b.dataset.armed; delete b.dataset.armed; } }, 4000); return; }
      b.disabled = true; try { await fn(); } catch (e) { b.textContent = e.message; b.disabled = false; }
    };
  }
  const head = (t, lead) => `<span class="k">DAZK · gestión</span><h1>${t}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}`;
  const mesBar = () => `<div class="mes"><button type="button" data-mes="-1" aria-label="Mes anterior">‹</button><b>${mesNombre(mes)}</b><button type="button" data-mes="1" aria-label="Mes siguiente" ${mes >= hoy().slice(0, 7) ? 'disabled' : ''}>›</button></div>`;
  const bindMes = (main, again) => main.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { mes = mover(mes, +b.dataset.mes); again(); });
  const dl = rows => `<dl class="specs tot">${rows.map(r => `<div><dt>${r[0]}</dt><i></i><dd>${r[1]}</dd></div>`).join('')}</dl>`;

  // ---------- resumen ----------
  async function resumen(main, all) {
    main.innerHTML = head('Resumen') + '<p class="lead">Cargando…</p>';
    let G; try { G = await A.gastos(); } catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    if (location.hash !== '#resumen') return;
    const pagosMes = all.flatMap(p => (p.pagos || []).filter(x => x.fecha.startsWith(mes)).map(x => Object.assign({ p }, x)));
    const cobrado = pagosMes.reduce((s, x) => s + x.monto, 0), gm = G.filter(g => g.fecha.startsWith(mes)), gastado = gm.reduce((s, g) => s + g.monto, 0);
    const nuevos = all.filter(p => ym(p.creado) === mes).length;
    const porCobrar = all.reduce((s, p) => s + saldo(p), 0), deben = all.filter(p => saldo(p) > 0).length;
    const ents = all.filter(p => abierto(p) && entrega(p)).sort((a, b) => entrega(a).localeCompare(entrega(b))), h = hoy();
    const sinFecha = all.filter(p => abierto(p) && vendido(p) && !entrega(p));
    const cats = CATS.map(c => [c, gm.filter(g => g.categoria === c).reduce((s, g) => s + g.monto, 0)]).filter(c => c[1]);
    const est = A.ESTADOS.filter(e => e[0] !== 'cancelado' && e[0] !== 'entregado').map(e => [e[1], all.filter(p => p.estado === e[0]).length]);
    main.innerHTML = head('Resumen', 'Lo que entró y salió en el mes, lo que les deben y lo que hay que entregar. Sale solo de los pagos y gastos que registren.') + mesBar() + `
      <div class="kpis"><div class="card"><span>Cobrado</span><b>${A.pesos(cobrado)}</b><small>${pagosMes.length} pago${pagosMes.length === 1 ? '' : 's'}</small></div>
        <div class="card"><span>Gastos</span><b>${A.pesos(gastado)}</b><small>${gm.length} registro${gm.length === 1 ? '' : 's'}</small></div>
        <div class="card ${cobrado - gastado < 0 ? 'neg' : ''}"><span>Quedó</span><b>${cobrado - gastado < 0 ? '−' : ''}${A.pesos(Math.abs(cobrado - gastado))}</b><small>cobrado − gastos</small></div>
        <div class="card"><span>Pedidos nuevos</span><b>${nuevos}</b><small>en el mes</small></div></div>
      <section><span class="k">Les deben (todos los meses)</span><div class="card">${dl([['Por cobrar', A.pesos(porCobrar)], ['Pedidos con saldo', deben]])}<a class="btn" href="#cobros">Ver cobros</a></div></section>
      <section><span class="k">En el taller ahora</span><div class="kpis sm">${est.map(e => `<div class="card"><span>${e[0]}</span><b>${e[1]}</b></div>`).join('')}</div></section>
      <section><span class="k">Entregas</span>${ents.length ? `<ul class="rows">${ents.slice(0, 20).map(p => `<li><a href="#p=${esc(p.id)}"><b>${esc(A.dia(entrega(p)))}${entrega(p) < h ? ' <mark class="late">atrasada</mark>' : entrega(p) === h ? ' <mark>hoy</mark>' : ''}</b>
        <span>#${esc(p.folio)} · ${esc(p.nombre)} · ${esc(A.estado(p.estado))}</span></a></li>`).join('')}</ul>` : '<p class="lead">No hay entregas con fecha. La fecha se pone en cada pedido, en «Precio, anticipo y entrega».</p>'}
        ${sinFecha.length ? `<p class="note">${sinFecha.length} pedido${sinFecha.length === 1 ? '' : 's'} vendido${sinFecha.length === 1 ? '' : 's'} sin fecha de entrega: ${sinFecha.slice(0, 6).map(p => `<a href="#p=${esc(p.id)}">#${esc(p.folio)}</a>`).join(', ')}</p>` : ''}</section>
      <section><span class="k">Gastos de ${mesNombre(mes)} por tipo</span>${cats.length ? `<div class="card">${dl(cats.map(c => [esc(c[0]), A.pesos(c[1])]))}</div>` : '<p class="lead">Sin gastos registrados en este mes.</p>'}<a class="btn" href="#gastos">Registrar o ver gastos</a></section>`;
    bindMes(main, () => resumen(main, all));
  }

  // ---------- cobros ----------
  function cobros(main, all) {
    const l = all.filter(p => saldo(p) > 0).sort((a, b) => saldo(b) - saldo(a));
    const sinPrecio = all.filter(p => abierto(p) && vendido(p) && !total(p));
    const rec = all.flatMap(p => (p.pagos || []).map(x => Object.assign({ p }, x))).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.creado - a.creado).slice(0, 30);
    main.innerHTML = head('Cobros', 'Pedidos vendidos (cotización aceptada o en confirmado, fabricación, listo o entregado) que todavía tienen saldo.') + `
      <div class="card">${dl([['Por cobrar en total', A.pesos(l.reduce((s, p) => s + saldo(p), 0))]])}</div>
      ${l.length ? l.map(p => { const txt = `Hola ${nom1(p)}, te escribimos de DAZK. Te compartimos el saldo de tu pedido #${p.folio}: ${A.pesos(saldo(p))}. Aquí puedes ver tu pedido: ${A.seguimiento(p.token)}`;
        return `<div class="card"><h3>#${esc(p.folio)} · ${esc(p.nombre)}</h3>${dl([['Precio', A.pesos(total(p))], ['Pagado', A.pesos(pagado(p))], ['Saldo', A.pesos(saldo(p))]])}
        <p class="lead">${esc(A.estado(p.estado))}${entrega(p) ? ' · entrega ' + esc(A.dia(entrega(p))) : ''}</p>
        <div class="two">${p.tel ? `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${A.waNum(p.tel)}?text=${encodeURIComponent(txt)}">Recordarle por WhatsApp</a>` : ''}<a class="btn" href="#p=${esc(p.id)}">Registrar pago</a></div></div>`; }).join('')
        : '<p class="lead">Nadie les debe. Los pagos se registran dentro de cada pedido.</p>'}
      ${sinPrecio.length ? `<p class="note">Vendidos sin precio capturado (no se pueden cobrar aquí hasta que tengan precio): ${sinPrecio.map(p => `<a href="#p=${esc(p.id)}">#${esc(p.folio)}</a>`).join(', ')}</p>` : ''}
      <section><span class="k">Pagos recientes</span>${rec.length ? `<div class="scroll"><table class="tab"><thead><tr><th>Pedido</th><th>Fecha</th><th>Forma</th><th>Monto</th></tr></thead><tbody>
        ${rec.map(x => `<tr><th><a href="#p=${esc(x.p.id)}">#${esc(x.p.folio)} ${esc(nom1(x.p))}</a></th><td class="t">${esc(x.fecha.slice(8))}/${esc(x.fecha.slice(5, 7))}</td><td class="t">${esc(x.metodo)}</td><td>${A.pesos(x.monto)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="lead">Todavía no hay pagos registrados.</p>'}</section>`;
  }

  // payments card inside an order
  function pagosHtml(p) {
    const t = total(p), pg = pagado(p);
    return `<div class="card pagos" id="pagos"><h3>Pagos del cliente</h3>
      ${dl([['Precio', t ? A.pesos(t) : 'por definir'], ['Pagado', A.pesos(pg)], ['Saldo', t ? A.pesos(Math.max(0, t - pg)) : '—']])}
      ${(p.pagos || []).length ? `<ul class="mini">${p.pagos.map(x => `<li><span>${esc(A.dia(x.fecha))} · ${esc(x.metodo)}${x.nota ? ' · ' + esc(x.nota) : ''} <small>(${esc(x.por)})</small></span><b>${A.pesos(x.monto)}</b><button type="button" class="x" data-delpago="${esc(x.id)}" aria-label="Borrar pago">Borrar</button></li>`).join('')}</ul>` : '<p class="lead">Sin pagos registrados.</p>'}
      <form id="pg-form"><div class="grid"><label for="pg-m">Monto ($)<input id="pg-m" inputmode="decimal" required placeholder="${t && t - pg > 0 ? esc(String(t - pg)) : ''}"></label>
        <label for="pg-f">Fecha<input type="date" id="pg-f" value="${hoy()}" required></label>
        <label for="pg-k">Forma de pago<select id="pg-k">${METODOS.map(m => `<option>${m}</option>`).join('')}</select></label>
        <label for="pg-n" class="wide">Nota (opcional)<input id="pg-n" maxlength="200" placeholder="Anticipo, saldo, referencia…"></label></div>
        <p class="err" hidden role="alert"></p><button class="btn gold" type="submit">Registrar pago</button></form></div>`;
  }
  function bindPagos(main, p, reload) {
    const f = main.querySelector('#pg-form'); if (!f) return;
    f.onsubmit = async e => {
      e.preventDefault(); const err = f.querySelector('.err'), b = f.querySelector('button'), m = num($('#pg-m').value);
      if (!m) { err.textContent = 'Escribe el monto.'; err.hidden = false; return; }
      b.disabled = true;
      try { await A.agregarPago(p.id, Object.assign({ monto: m, fecha: $('#pg-f').value || hoy(), metodo: $('#pg-k').value }, $('#pg-n').value.trim() ? { nota: $('#pg-n').value.trim().slice(0, 200) } : {})); await reload(); }
      catch (x) { err.textContent = x.message; err.hidden = false; b.disabled = false; }
    };
    main.querySelectorAll('[data-delpago]').forEach(b => dosToques(b, async () => { await A.borrarPago(p.id, b.dataset.delpago, p.pagos.find(x => x.id === b.dataset.delpago)); await reload(); }));
  }

  // ---------- gastos ----------
  async function gastos(main, all) {
    if (!$('#g-form')) main.innerHTML = head('Gastos') + '<p class="lead">Cargando…</p>';
    let G; try { G = await A.gastos(); } catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    if (location.hash !== '#gastos') return;
    const gm = G.filter(g => g.fecha.startsWith(mes)), ped = id => all.find(p => p.id === id);
    const cats = CATS.map(c => [c, gm.filter(g => g.categoria === c).reduce((s, g) => s + g.monto, 0)]).filter(c => c[1]);
    main.innerHTML = head('Gastos', 'Todo lo que se paga para hacer y vender las mesas. Si un gasto es de un pedido, elígelo para saber cuánto dejó cada mesa.') + `
      <form id="g-form" class="card"><div class="grid"><label for="g-c" class="wide">Concepto<input id="g-c" maxlength="120" required placeholder="Placa Calacatta 3.20 × 1.60"></label>
        <label for="g-m">Monto ($)<input id="g-m" inputmode="decimal" required></label><label for="g-f">Fecha<input type="date" id="g-f" value="${hoy()}" required></label>
        <label for="g-k">Tipo<select id="g-k">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
        <label for="g-p">Pedido (opcional)<select id="g-p"><option value="">— General —</option>${all.filter(abierto).concat(all.filter(p => !abierto(p))).slice(0, 80).map(p => `<option value="${esc(p.id)}">#${esc(p.folio)} · ${esc(p.nombre)}</option>`).join('')}</select></label>
        <label for="g-n" class="wide">Nota (opcional)<input id="g-n" maxlength="200"></label></div>
        <p class="err" hidden role="alert"></p><button class="btn gold" type="submit">Guardar gasto</button></form>
      ${mesBar()}<div class="card">${dl([['Total del mes', A.pesos(gm.reduce((s, g) => s + g.monto, 0))]].concat(cats.map(c => [esc(c[0]), A.pesos(c[1])])))}</div>
      ${gm.length ? `<ul class="mini big">${gm.map(g => { const p = g.pedido && ped(g.pedido); return `<li><span><b>${esc(g.concepto)}</b><br>${esc(A.dia(g.fecha))} · ${esc(g.categoria)}${p ? ` · <a href="#p=${esc(p.id)}">pedido #${esc(p.folio)}</a>` : ''}${g.nota ? ' · ' + esc(g.nota) : ''} <small>(${esc(g.por)})</small></span><b>${A.pesos(g.monto)}</b><button type="button" class="x" data-delg="${esc(g.id)}">Borrar</button></li>`; }).join('')}</ul>` : '<p class="lead">Sin gastos en este mes.</p>'}`;
    bindMes(main, () => gastos(main, all));
    const f = $('#g-form');
    f.onsubmit = async e => {
      e.preventDefault(); const err = f.querySelector('.err'), b = f.querySelector('button'), m = num($('#g-m').value), c = $('#g-c').value.trim();
      if (!c || !m) { err.textContent = 'Escribe el concepto y el monto.'; err.hidden = false; return; }
      b.disabled = true;
      const x = { concepto: c.slice(0, 120), monto: m, fecha: $('#g-f').value || hoy(), categoria: $('#g-k').value };
      if ($('#g-p').value) x.pedido = $('#g-p').value; if ($('#g-n').value.trim()) x.nota = $('#g-n').value.trim().slice(0, 200);
      try { await A.agregarGasto(x); mes = x.fecha.slice(0, 7); main.innerHTML = ''; await gastos(main, all); } catch (z) { err.textContent = z.message; err.hidden = false; b.disabled = false; }
    };
    main.querySelectorAll('[data-delg]').forEach(b => dosToques(b, async () => { await A.borrarGasto(b.dataset.delg); await gastos(main, all); }));
  }
  // what one order cost, from the expenses linked to it (shown inside the order)

    const abiertas = [...main.querySelectorAll('details.fab[open]')].map(d => d.dataset.i);
    const link = A.seguimiento(p.token), first = esc(p.nombre.split(' ')[0]);
    const wa = `https://wa.me/${A.waNum(p.tel)}?text=${encodeURIComponent(`Hola ${p.nombre.split(' ')[0]}, te escribimos de DAZK sobre tu pedido #${p.folio}. Aquí puedes ver el avance y respondernos: ${link}`)}`;
    main.innerHTML = `<a class="back" href="#">‹ Pedidos</a><span class="k">Pedido #${esc(p.folio)} · ${A.fecha(p.creado)}</span><h1>${esc(p.nombre)}</h1>
      <p class="lead">${p.tel ? `WhatsApp <a href="https://wa.me/${A.waNum(p.tel)}" target="_blank" rel="noopener">${esc(p.tel)}</a>` : 'No dejó WhatsApp: contéstale aquí y lo verá en su link de seguimiento.'}</p>
      <div class="card"><label for="estado">Estado del pedido<select id="estado">${A.ESTADOS.map(e => `<option value="${e[0]}" ${e[0] === p.estado ? 'selected' : ''}>${e[1]}</option>`).join('')}</select></label>
        <div class="two">${p.tel ? `<a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">Avisar a ${first} por WhatsApp</a>` : ''}<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Ver como cliente</a></div></div>
      <section><span class="k">Productos</span>${p.items.map((it, i) => `<article class="card"><h3>${it.cantidad > 1 ? esc(it.cantidad) + ' × ' : ''}${esc(it.titulo)}</h3>
        <dl class="specs">${(it.specs || []).map(s => `<div><dt>${esc(s[0])}</dt><i></i><dd>${esc(s[1])}</dd></div>`).join('')}</dl>
        ${/^https?:\/\//.test(it.link || '') ? `<a class="link" href="${esc(it.link)}" target="_blank" rel="noopener">Abrir el diseño en 3D →</a>` : ''}
        ${it.tipo === 'mesa' ? window.DAZK_FICHA.html(p, it, i) : ''}</article>`).join('')}
        ${window.DAZK_FICHA.pagoHtml(p)}${window.DAZK_GES.pagosHtml(p)}<div id="costo"></div>
        ${p.notas ? `<p class="note"><b>Notas del cliente:</b> ${esc(p.notas)}</p>` : ''}</section>
      <section><span class="k">Historial</span><ol class="tl">${p.eventos.map(e => `<li class="${e.autor === 'cliente' ? 'cliente' : 'dazk'}${e.tipo === 'mensaje' ? ' msg' : ''}${e.interno ? ' int' : ''}">
        <div><b>${e.autor === 'cliente' ? esc(e.autor_nombre) + ' (cliente)' : esc(e.autor_nombre)}${e.interno ? ' · nota interna' : ''}</b><time>${A.fecha(e.creado)}</time></div>
        <p>${e.tipo === 'estado' ? 'Cambió el estado a: ' + esc(e.texto) : esc(e.texto)}</p></li>`).join('')}</ol>
        <form id="m-form"><textarea id="m-text" rows="3" maxlength="4000" placeholder="Mensaje para el cliente: cotización, dudas de medida, fecha de entrega…"></textarea>
        <label class="chk"><input type="checkbox" id="m-int"> Nota interna (el cliente no la ve)</label>
        <p class="err" id="m-err" role="alert" hidden></p><button class="btn gold" type="submit">Guardar en el historial</button></form></section>`;
    $('#m-text').value = draft;
    main.querySelectorAll('details.fab').forEach(d => { d.open = abiertas.includes(d.dataset.i); });
    window.DAZK_FICHA.bind(main, p, () => reload()); window.DAZK_GES.bindPagos(main, p, () => reload()); window.DAZK_GES.costoPedido($('#costo'), p);
    $('#estado').onchange = async e => { e.target.disabled = true; try { await A.staffEstado(p.id, e.target.value); } catch (x) { alert(x.message); } await reload(); };
    $('#m-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const el = $('#m-text'), txt = el.value.trim(); if (!txt) return el.focus();
      const b = ev.target.querySelector('button'); b.disabled = true;
      try { await A.staffMensaje(p.id, txt, $('#m-int').checked); el.value = draft = ''; await reload(); } catch (e) { $('#m-err').textContent = e.message; $('#m-err').hidden = false; b.disabled = false; }
    });
  }
  // who came to the client page: counts and the latest visits
  async function visitas() {
    if (!$('#v-list')) main.innerHTML = '<a class="back" href="#">‹ Pedidos</a><span class="k">Panel DAZK</span><h1>Visitas</h1><p class="lead">Cargando…</p>';
    let all; try { all = await A.visitas(); } catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    if (location.hash !== '#visitas') return;
    const PASO = ['Vio modelos', 'Ajustó el tamaño', 'Eligió materiales', 'Llegó a cotizar'], USO = { comedor: 'Comedor', periquera: 'Periquera', centro: 'Mesa de centro', auxiliar: 'Mesa auxiliar' };
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0); const sem = hoy.getTime() - 6 * 864e5;
    const fila = (titulo, l) => `<tr><th>${titulo}</th><td>${l.length}</td><td>${new Set(l.map(x => x.v)).size}</td><td>${l.filter(x => x.paso >= 3).length}</td><td>${l.filter(x => x.folio).length}</td></tr>`;
    main.innerHTML = `<a class="back" href="#">‹ Pedidos</a><span class="k">Panel DAZK</span><h1>Visitas</h1>
      <p class="lead">Quién entró a Crea tu mesa. El nombre solo aparece si esa persona ya envió un pedido desde ese mismo celular o computadora; los demás son visitantes anónimos.</p>
      <div class="scroll"><table class="tab"><thead><tr><th></th><th>Visitas</th><th>Personas</th><th>Llegaron a cotizar</th><th>Enviaron pedido</th></tr></thead><tbody>
        ${fila('Hoy', all.filter(x => x.t >= hoy.getTime()))}${fila('Últimos 7 días', all.filter(x => x.t >= sem))}${fila('Últimas ' + all.length, all)}</tbody></table></div>
      <section><span class="k">Visitas recientes</span>${all.length ? `<ul class="rows" id="v-list">${all.slice(0, 100).map(x => `<li><a><b>${x.nombre ? esc(x.nombre) : 'Visitante'}${x.folio ? ` <mark>pedido #${esc(x.folio)}</mark>` : ''}</b>
        <span>${esc(USO[x.uso] || 'Sin elegir')}${x.modelo ? ' · modelo ' + esc(x.modelo.charAt(0).toUpperCase() + x.modelo.slice(1)) : ''} · ${PASO[x.paso] || PASO[0]}</span>
        <span class="meta">${A.fecha(x.t)} · ${esc(x.disp || '')} · llegó por: ${esc(x.origen || 'directo')}${x.ult - x.t > 60000 ? ' · estuvo ' + Math.round((x.ult - x.t) / 60000) + ' min' : ''}</span></a></li>`).join('')}</ul>` : '<p class="lead" id="v-list">Todavía no hay visitas registradas.</p>'}</section>`;
  }
  window.addEventListener('hashchange', () => { draft = ''; if (me) render(); window.scrollTo(0, 0); });
  setInterval(() => { if (me && !document.hidden) reload(true); }, 30000);
  const qs = new URLSearchParams(location.search);
  if (qs.get('oobCode') && qs.get('mode') === 'resetPassword') nuevaPass(qs.get('oobCode'));
  else A.yo().then(u => { me = u; me ? entrar() : login(); }, e => login(e.message));
});
</script></body></html>
