<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0907;--sheet:#13100d;--line:rgba(236,228,214,.12);--ink:#ece4d6;--mut:#9a8f7d;--g:#c2a273;--g2:#d9bd8c;--gl:rgba(194,162,115,.42);--wa:#25d366;
--serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;--sans:'Jost','Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:300 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--g)}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);max-width:860px;margin:0 auto}
.top img{height:40px;mix-blend-mode:lighten}.top span{margin-left:auto;font-size:13px;color:var(--mut)}.top button{color:var(--g);text-decoration:underline;text-underline-offset:3px}
.demo{background:#7a4a12;color:#fff;font-size:12px;text-align:center;padding:6px 12px}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
.k{display:block;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--g);margin-bottom:8px}
h1{font:300 clamp(30px,7vw,44px)/1.05 var(--serif);margin-bottom:6px;overflow-wrap:anywhere}h1 em{color:var(--g)}
h3{font:400 21px/1.2 var(--serif);margin-bottom:6px;overflow-wrap:anywhere}
.lead{color:var(--mut);font-size:15px;margin-bottom:16px}
section{margin-top:28px}
.card{border:1px solid var(--gl);padding:16px;margin-top:12px;background:var(--sheet)}
dl.specs div{display:flex;align-items:baseline;gap:10px;padding:4px 0}
dl.specs dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
dl.specs i{flex:1;border-bottom:1px dotted rgba(194,162,115,.4);min-width:10px}dl.specs dd{font-size:14.5px;text-align:right}
.link{display:inline-block;margin-top:10px;font-size:13.5px;text-underline-offset:3px}
.note{margin-top:12px;padding:10px 12px;border-left:2px solid var(--g);background:rgba(194,162,115,.1);font-size:14px;overflow-wrap:anywhere}
.track{list-style:none;display:flex;margin:18px 0 4px}
.track li{flex:1;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:center;line-height:1.3}
.track i{display:block;height:3px;background:var(--line);margin:0 2px 8px}
.track .done{color:#cfc5b4}.track .done i{background:rgba(194,162,115,.5)}.track .on{color:var(--g)}.track .on i{background:var(--g)}
.tl{list-style:none;margin-top:6px}
.tl li{padding:12px 0 12px 14px;border-left:1px solid var(--gl);position:relative}
.tl li::before{content:'';position:absolute;left:-4px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--g)}
.tl li div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.tl b{font-weight:400;font-size:13px;color:var(--g2)}.tl time{font-size:12px;color:var(--mut)}
.tl p{font-size:14.5px;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere}
.tl li.msg p{color:var(--ink);background:var(--sheet);border:1px solid var(--line);padding:10px 12px;margin-top:6px}
.tl li.cliente::before{background:var(--ink)}.tl li.cliente b{color:var(--ink)}
.tl li.int p{color:var(--ink);background:rgba(217,180,90,.1);border:1px dashed rgba(217,180,90,.5);padding:10px 12px;margin-top:6px}
form{margin-top:14px}
label{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);margin:10px 0 0}label.chk input{width:20px;height:20px;accent-color:var(--g)}
input:not([type=checkbox]),textarea,select{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:300 16px/1.5 var(--sans);padding:12px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:10px 16px;border:1px solid var(--gl);color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-align:center;width:100%;margin-top:12px}
.btn.gold{background:var(--g);border-color:var(--g);color:#0b0907;font-weight:400}.btn.wa{background:var(--wa);border-color:var(--wa);color:#08140c;font-weight:400}.btn:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.two{grid-template-columns:1fr;gap:0}}
.err{margin-top:12px;padding:10px 12px;border-left:2px solid #d98a6a;background:rgba(217,138,106,.12);font-size:13.5px}[hidden]{display:none!important}
.rows{list-style:none;margin-top:14px}.rows a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rows b{display:block;font:400 20px/1.2 var(--serif);overflow-wrap:anywhere}.rows span{display:block;font-size:13.5px;color:var(--mut);overflow-wrap:anywhere}.rows .meta{margin-top:6px;font-size:12px}
mark{background:var(--g);color:#0b0907;font:400 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;vertical-align:middle}
.badge{display:inline-block;font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gl);padding:2px 8px;color:var(--g2);margin-right:6px}
.badge.nuevo{background:var(--g);color:#0b0907;border-color:var(--g)}.badge.entregado,.badge.cancelado,.badge.off{color:var(--mut);border-color:var(--line)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);padding:8px 12px;font-size:13px;color:var(--mut);white-space:nowrap}.filters button.on{border-color:var(--g);color:var(--ink);background:rgba(194,162,115,.13)}.filters b{font-weight:400;color:var(--g)}
.back{display:inline-block;margin-bottom:14px;font-size:13px;text-decoration:none}
details.fab{margin-top:14px;border-top:1px solid var(--line)}section>details.fab{border:1px solid var(--gl);background:var(--sheet);padding:0 16px;margin-top:12px}
details.fab summary{cursor:pointer;list-style:none;padding:14px 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.fab summary::-webkit-details-marker{display:none}details.fab summary::after{content:'+';margin-left:auto;font:300 24px/1 var(--serif)}details.fab[open] summary::after{content:'–'}
details.fab summary .badge{margin:0;letter-spacing:.08em}details.fab form{margin:0 0 16px}
.draw svg{width:100%;max-width:420px;display:block;margin:0 auto}
fieldset{border:0;margin-top:18px}legend{font:400 19px/1.2 var(--serif);color:var(--ink);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px}.grid label.wide{grid-column:1/-1}
#print{display:none}
@media print{html,body{background:#fff!important}body>*:not(#print){display:none!important}
#print{display:block;color:#000;font:13px/1.4 Arial,sans-serif;padding:0}
#print header{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;font-size:15px}#print header b{letter-spacing:.3em}#print header span{font-size:12px}
#print h2{font:700 18px/1.2 Arial,sans-serif;margin:12px 0 2px}#print h3{font:700 13px/1.2 Arial,sans-serif;color:#000;margin:12px 0 4px;text-transform:uppercase}
#print .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}#print svg{width:100%;border:1px solid #999}
#print table{width:100%;border-collapse:collapse;margin-top:6px}#print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left;font-weight:400;font-size:12px}#print th{width:58%;background:#f1f1f1}#print td i{color:#777}
#print .firma{margin-top:28px}}

<script>window.DAZK_FB={"apiKey":"AIzaSyBBJqI7K_xY9RDPFzAVedS_5EyplehRATg","db":"https://dazk-pedidos-default-rtdb.firebaseio.com"};</script><script>/* DAZK · pedidos: one data layer for the client page, the client's tracking page and the workshop panel.
   With window.DAZK_FB = { apiKey, db } it talks to Firebase (Realtime Database + Auth over REST; rules in firebase/database.rules.json).
   Without it, it runs in demo mode: everything stays in this browser's localStorage.
   Clients are anonymous: an order lives at pedidos/<secret token>, readable only by whoever has the token. Staff sign in and must be listed in staff/. */
(function () {
  const FB = window.DAZK_FB || null, SITE = 'https://creadazk.github.io/';
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const ESTADOS = [['nuevo', 'Recibido'], ['cotizado', 'Cotizado'], ['confirmado', 'Confirmado'], ['fabricacion', 'En fabricación'], ['listo', 'Listo'], ['entregado', 'Entregado'], ['cancelado', 'Cancelado']];
  const estado = k => (ESTADOS.find(e => e[0] === k) || [k, k])[1];
  const digits = t => String(t || '').replace(/\D/g, '');
  // Mexican numbers are stored as typed; WhatsApp links need the country code
  const waNum = t => { const d = digits(t); return d.length === 10 ? '52' + d : d; };
  const sortP = p => { p.items = (p.items || []).slice().sort((a, b) => a.pos - b.pos); p.eventos = (p.eventos || []).slice().sort((a, b) => a.id - b.id); return p; };
  const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  function cliente(p) {
    const nombre = String(p.nombre || '').trim().slice(0, 80), tel = digits(p.tel);
    if (nombre.length < 2) throw new Error('Escribe tu nombre.');
    if (tel.length < 10 || tel.length > 13) throw new Error('Revisa tu número de WhatsApp.');
    if (!p.items || !p.items.length || p.items.length > 12) throw new Error('El pedido debe tener entre 1 y 12 productos.');
    return { nombre, tel, notas: String(p.notas || '').trim().slice(0, 1000) };
  }

  // ---------- Firebase ----------
  const TS = { '.sv': 'timestamp' };
  let ses = load('dazk-ses', null), yoCache = null;
  async function jfetch(url, opt) {
    let r;
    try { r = await fetch(url, opt); } catch (e) { throw new Error('Sin conexión. Revisa tu internet e intenta de nuevo.'); }
    const j = await r.json().catch(() => null);
    if (!r.ok) { const m = j && j.error && (j.error.message || j.error); const e = new Error(m || 'Error ' + r.status); e.status = r.status; e.code = String(m || ''); throw e; }
    return j;
  }
  const idp = (path, body) => jfetch('https://' + path + '?key=' + FB.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const setSes = j => { ses = j && { idToken: j.idToken, refreshToken: j.refreshToken, uid: j.localId, email: j.email, exp: Date.now() + j.expiresIn * 1000 }; yoCache = null; save('dazk-ses', ses); };
  async function idToken() {
    if (!ses) throw new Error('Tu sesión terminó. Vuelve a entrar.');
    if (Date.now() > ses.exp - 60000) {
      try { const j = await idp('securetoken.googleapis.com/v1/token', { grant_type: 'refresh_token', refresh_token: ses.refreshToken }); Object.assign(ses, { idToken: j.id_token, refreshToken: j.refresh_token, exp: Date.now() + j.expires_in * 1000 }); save('dazk-ses', ses); }
      catch (e) { setSes(null); throw new Error('Tu sesión terminó. Vuelve a entrar.'); }
    }
    return ses.idToken;
  }
  async function db(path, method, body, auth) {
    const q = auth ? '?auth=' + await idToken() : '';
    return jfetch(FB.db + '/' + path + '.json' + q, { method: method || 'GET', body: body === undefined ? undefined : JSON.stringify(body) });
  }
  const denied = e => e.status === 401 || e.status === 403;
  // one order as the pages expect it; internal notes (staff only) are merged into the history
  function shape(t, p, notas) {
    const ev = Object.entries(p.eventos || {}).map(([k, e]) => Object.assign({ key: k, interno: false }, e))
      .concat(Object.entries(notas || {}).map(([k, e]) => Object.assign({ key: k }, e, { interno: true })))
      .sort((a, b) => a.creado - b.creado || (a.key < b.key ? -1 : 1));
    return Object.assign({}, p, { id: t, token: t, notas: p.notas || '', items: Object.values(p.items || {}).map((it, i) => Object.assign({ cantidad: 1 }, it, { pos: i + 1 })), eventos: ev.map((e, i) => Object.assign(e, { id: i + 1 })) });
  }
  const AUTH_ERR = { EMAIL_EXISTS: 'Ese correo ya tiene cuenta. Entra con tu contraseña.', EMAIL_NOT_FOUND: 'Correo o contraseña incorrectos.', INVALID_PASSWORD: 'Correo o contraseña incorrectos.',
    INVALID_LOGIN_CREDENTIALS: 'Correo o contraseña incorrectos.', INVALID_EMAIL: 'Revisa el correo.', MISSING_PASSWORD: 'Escribe tu contraseña.', USER_DISABLED: 'Esta cuenta está desactivada.' };
  const authErr = e => new Error(/WEAK_PASSWORD/.test(e.code) ? 'La contraseña debe tener al menos 6 caracteres.' : /TOO_MANY_ATTEMPTS/.test(e.code) ? 'Demasiados intentos. Espera unos minutos.' : AUTH_ERR[e.code] || e.message);
  const PENDIENTE = 'Tu cuenta ya existe, pero falta que el administrador de DAZK te dé acceso al taller.';
  const real = {
    async crearPedido(p) {
      const c = cliente(p);
      const items = p.items.map(it => Object.assign({ tipo: ['mesa', 'sillas', 'bancos'].includes(it.tipo) ? it.tipo : 'mesa', titulo: String(it.titulo || 'Mesa').slice(0, 160), cantidad: Math.max(1, Math.min(99, +it.cantidad || 1)),
        specs: (it.specs || []).slice(0, 20).map(s => [String(s[0]).slice(0, 120), String(s[1]).slice(0, 120)]) }, it.uso ? { uso: String(it.uso).slice(0, 20) } : {},
        // only links to our own configurator are stored, so staff never open a foreign URL
        String(it.link || '').startsWith(SITE) ? { link: it.link.slice(0, 600) } : {}));
      // the folio counter and the order are written together; if someone else took the number first the rules reject it and we try the next one
      for (let i = 0; i < 6; i++) {
        const folio = ((await db('folio')) || 1000) + 1, t = rnd();
        const ped = Object.assign({ folio, estado: 'nuevo', creado: TS, actualizado: TS, items, eventos: { e0: { creado: TS, autor: 'cliente', autor_nombre: c.nombre, tipo: 'creado', texto: 'Pedido enviado desde Crea tu mesa.' } } }, c);
        try { await db('', 'PATCH', { folio, ['pedidos/' + t]: ped }); return { folio, token: t }; }
        catch (e) { if (!denied(e)) throw e; }
      }
      throw new Error('No se pudo enviar el pedido. Intenta de nuevo en un momento.');
    },
    async verPedido(t) { const p = await db('pedidos/' + t); if (!p) throw new Error('No encontramos ese pedido.'); return shape(t, p); },
    async clienteMensaje(t, texto) {

      try { setSes(await idp('identitytoolkit.googleapis.com/v1/accounts:signInWithPassword', { email, password: pass, returnSecureToken: true })); } catch (e) { throw authErr(e); }

      try { setSes(await idp('identitytoolkit.googleapis.com/v1/accounts:signUp', { email, password: pass, returnSecureToken: true })); } catch (e) { throw authErr(e); }

</script><script>/* DAZK · ficha de fabricación: the workshop's paper sheets (cubierta / MDF / base, vista aérea, volados, especificaciones, pago) as part of each order.

(function () {

    ['2 · MDF', [['mL', 'Largo (cm)', 'n'], ['mW', 'Ancho (cm)', 'n'], ['mEsp', 'Espesor (mm)', 'n'], ['mMat', 'Material del MDF']]],

  const PAGO = [['total', 'Precio total ($)', 'n'], ['anticipo', 'Anticipo ($)', 'n'], ['entrega', 'Fecha de entrega', 'd'], ['direccion', 'Dirección de entrega'], ['obs', 'Observaciones', 't']];

      if (resto < 0) warn.push('La base más la cubierta ya pasan la altura total.'); else if (g('mEsp') && Math.abs(resto - g('mEsp') / 10) > .3) warn.push(`Base + MDF + cubierta suman ${fmt(g('bH') + g('mEsp') / 10 + g('cEsp') / 10)} cm y la altura total dice ${fmt(g('alto'))} cm.`); }

    if ($('#l-sw')) $('#l-sw').onclick = () => login('', !nuevo);
    if ($('#l-rec')) $('#l-rec').onclick = async () => { const m = $('#l-mail').value.trim(); if (!m) { say('Escribe tu correo arriba y vuelve a tocar "Olvidé mi contraseña".'); return $('#l-mail').focus(); }
      try { await A.recuperar(m); say('Si ese correo tiene cuenta, te llegó un mensaje para cambiar tu contraseña.'); } catch (e) { say(e.message); } };
    $('#l-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const b = ev.target.querySelector('button'); b.disabled = true;
      try { me = nuevo ? await A.registrar($('#l-nom').value, $('#l-mail').value.trim(), $('#l-pass').value) : await A.login($('#l-mail').value.trim(), $('#l-pass').value); await reload(); }
      catch (e) { say(e.message); b.disabled = false; }
    });
  }
  async function reload(quiet) {
    try { all = await A.listar(); } catch (e) { if (!quiet) main.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    const sig = JSON.stringify(all.map(p => [p.id, p.estado, p.eventos.length])); if (quiet && sig === last) return; last = sig;
    render();
  }
  function render() { $('#who').innerHTML = `${esc(me.nombre)}${me.rol === 'admin' ? ' · <a href="#equipo">Equipo</a>' : ''} · <button type="button" id="out">Salir</button>`; $('#out').onclick = () => { A.logout(); me = null; $('#who').textContent = ''; login(); }; location.hash === '#equipo' && me.rol === 'admin' ? equipo() : openId() ? detail() : list(); }

  function list() {
    const F = [['abiertos', 'Abiertos', p => !cerrado(p)], ['espera', 'Por responder', p => !cerrado(p) && espera(p)]].concat(A.ESTADOS.map(e => [e[0], e[1], p => p.estado === e[0]]));
    const f = F.find(x => x[0] === filtro) || F[0], s = q.trim().toLowerCase();
    const rows = all.filter(f[2]).filter(p => !s || (p.nombre + ' ' + p.tel + ' #' + p.folio + ' ' + p.items.map(i => i.titulo).join(' ')).toLowerCase().includes(s));
    main.innerHTML = `<span class="k">Taller DAZK</span><h1>Pedidos</h1>
      <div class="filters">${F.map(x => `<button type="button" data-f="${x[0]}" class="${x[0] === f[0] ? 'on' : ''}">${x[1]} <b>${all.filter(x[2]).length}</b></button>`).join('')}</div>
      <input type="search" id="q" placeholder="Buscar por nombre, teléfono, folio o producto" value="${esc(q)}" aria-label="Buscar pedidos">
      ${rows.length ? `<ul class="rows">${rows.map(p => `<li><a href="#p=${esc(p.id)}"><b>#${esc(p.folio)} · ${esc(p.nombre)}${espera(p) && !cerrado(p) ? ' <mark>por responder</mark>' : ''}</b>
        <span>${esc(p.items.map(i => (i.cantidad > 1 ? i.cantidad + ' × ' : '') + i.titulo).join(' + '))}</span>
        <span class="meta"><em class="badge ${p.estado}">${A.estado(p.estado)}</em> ${A.fecha(p.actualizado)}</span></a></li>`).join('')}</ul>` : '<p class="lead">No hay pedidos aquí.</p>'}`;
    main.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filtro = b.dataset.f; list(); });
    $('#q').oninput = e => { q = e.target.value; const pos = e.target.selectionStart; list(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  }

  function detail() {
    const p = all.find(x => x.id === openId()); if (!p) { location.hash = ''; return; }
    const ta = $('#m-text'); if (ta) draft = ta.value;
    const abiertas = [...main.querySelectorAll('details.fab[open]')].map(d => d.dataset.i);
    const link = A.seguimiento(p.token), first = esc(p.nombre.split(' ')[0]);
    const wa = `https://wa.me/${A.waNum(p.tel)}?text=${encodeURIComponent(`Hola ${p.nombre.split(' ')[0]}, te escribimos de DAZK sobre tu pedido #${p.folio}. Aquí puedes ver el avance y respondernos: ${link}`)}`;
    main.innerHTML = `<a class="back" href="#">‹ Pedidos</a><span class="k">Pedido #${esc(p.folio)} · ${A.fecha(p.creado)}</span><h1>${esc(p.nombre)}</h1>
      <p class="lead">WhatsApp <a href="https://wa.me/${A.waNum(p.tel)}" target="_blank" rel="noopener">${esc(p.tel)}</a></p>
      <div class="card"><label for="estado">Estado del pedido<select id="estado">${A.ESTADOS.map(e => `<option value="${e[0]}" ${e[0] === p.estado ? 'selected' : ''}>${e[1]}</option>`).join('')}</select></label>
        <div class="two"><a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">Avisar a ${first} por WhatsApp</a><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Ver como cliente</a></div></div>
      <section><span class="k">Productos</span>${p.items.map((it, i) => `<article class="card"><h3>${it.cantidad > 1 ? esc(it.cantidad) + ' × ' : ''}${esc(it.titulo)}</h3>
        <dl class="specs">${(it.specs || []).map(s => `<div><dt>${esc(s[0])}</dt><i></i><dd>${esc(s[1])}</dd></div>`).join('')}</dl>
        ${/^https?:\/\//.test(it.link || '') ? `<a class="link" href="${esc(it.link)}" target="_blank" rel="noopener">Abrir el diseño en 3D →</a>` : ''}
        ${it.tipo === 'mesa' ? window.DAZK_FICHA.html(p, it, i) : ''}</article>`).join('')}
        ${window.DAZK_FICHA.pagoHtml(p)}
        ${p.notas ? `<p class="note"><b>Notas del cliente:</b> ${esc(p.notas)}</p>` : ''}</section>
      <section><span class="k">Historial</span><ol class="tl">${p.eventos.map(e => `<li class="${e.autor === 'cliente' ? 'cliente' : 'dazk'}${e.tipo === 'mensaje' ? ' msg' : ''}${e.interno ? ' int' : ''}">
        <div><b>${e.autor === 'cliente' ? esc(e.autor_nombre) + ' (cliente)' : esc(e.autor_nombre)}${e.interno ? ' · nota interna' : ''}</b><time>${A.fecha(e.creado)}</time></div>
        <p>${e.tipo === 'estado' ? 'Cambió el estado a: ' + esc(e.texto) : esc(e.texto)}</p></li>`).join('')}</ol>
        <form id="m-form"><textarea id="m-text" rows="3" maxlength="4000" placeholder="Mensaje para el cliente: cotización, dudas de medida, fecha de entrega…"></textarea>
        <label class="chk"><input type="checkbox" id="m-int"> Nota interna (el cliente no la ve)</label>
        <p class="err" id="m-err" role="alert" hidden></p><button class="btn gold" type="submit">Guardar en el historial</button></form></section>`;
    $('#m-text').value = draft;
    main.querySelectorAll('details.fab').forEach(d => { d.open = abiertas.includes(d.dataset.i); });
    window.DAZK_FICHA.bind(main, p, () => reload());
    $('#estado').onchange = async e => { e.target.disabled = true; try { await A.staffEstado(p.id, e.target.value); } catch (x) { alert(x.message); } await reload(); };
    $('#m-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const el = $('#m-text'), txt = el.value.trim(); if (!txt) return el.focus();
      const b = ev.target.querySelector('button'); b.disabled = true;
      try { await A.staffMensaje(p.id, txt, $('#m-int').checked); el.value = draft = ''; await reload(); } catch (e) { $('#m-err').textContent = e.message; $('#m-err').hidden = false; b.disabled = false; }
    });
  }
  // administrator: who can enter the workshop panel
  async function equipo() {
    main.innerHTML = '<a class="back" href="#">‹ Pedidos</a><span class="k">Taller DAZK</span><h1>Equipo</h1><p class="lead">Cargando…</p>';
    let d; try { d = await A.equipo(); } catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    const link = location.href.split('#')[0];
    main.innerHTML = `<a class="back" href="#">‹ Pedidos</a><span class="k">Taller DAZK</span><h1>Equipo</h1>
      <p class="lead">Para sumar a alguien, pásale este link y que toque "Crear mi cuenta": <b>${esc(link)}</b>. Después aparece aquí para que lo apruebes.</p>
      <section><span class="k">Esperando acceso</span>${d.solicitudes.length ? d.solicitudes.map(s => `<div class="card"><h3>${esc(s.nombre)}</h3><p class="lead">${esc(s.email)}</p>
        <div class="two"><button type="button" class="btn gold" data-ok="${esc(s.uid)}">Dar acceso</button><button type="button" class="btn" data-no="${esc(s.uid)}">Rechazar</button></div></div>`).join('') : '<p class="lead">Nadie por ahora.</p>'}</section>
      <section><span class="k">Con acceso</span>${d.staff.map(s => `<div class="card"><h3>${esc(s.nombre)}${s.rol === 'admin' ? ' · administrador' : ''}</h3><p class="lead">${esc(s.email || '')}</p>
        ${s.uid === me.uid || s.rol === 'admin' ? '' : `<button type="button" class="btn" data-rm="${esc(s.uid)}">Quitar acceso</button>`}</div>`).join('')}</section>`;
    const act = (sel, key, fn) => main.querySelectorAll(sel).forEach(b => b.onclick = async () => { b.disabled = true; try { await fn(b.dataset[key]); } catch (e) { alert(e.message); } equipo(); });
    act('[data-ok]', 'ok', uid => A.aprobar(d.solicitudes.find(s => s.uid === uid)));
    act('[data-no]', 'no', uid => A.rechazar(uid));
    act('[data-rm]', 'rm', uid => A.quitar(uid));
  }
  window.addEventListener('hashchange', () => { draft = ''; if (me) render(); window.scrollTo(0, 0); });
  setInterval(() => { if (me && !document.hidden) reload(true); }, 30000);
  A.yo().then(u => { me = u; me ? reload() : login(); }, e => login(e.message));
});
</script></body></html>
