<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DKAS · Panel</title><meta name="description" content="Panel del taller DKAS."><meta name="theme-color" content="#0e0c0a">
<meta property="og:title" content="DKAS · Panel"><meta property="og:description" content="Panel del taller DKAS."><meta property="og:image" content="https://creadazk.github.io/og.jpg">
<link rel="icon" href="img/dkas-oscuro.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><meta name="robots" content="noindex"><style>:root{--bg:#f6f4f0;--card:#fff;--tinta:#1a1917;--gris:#6e6962;--linea:#e7e3dc;--oro:#a8844f;--verde:#1f8f4e;--rojo:#c0352b;--r:16px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tinta);font:16px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:34px;line-height:1.1}
h3{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gris);margin:22px 0 6px}
.sub,.nota{color:var(--gris);font-size:14px}.nota{margin:6px 0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--linea)}
.top img{height:30px}
.top nav{display:flex;gap:4px}
.top nav a{padding:8px 12px;border-radius:999px;color:var(--gris);text-decoration:none;font-size:14.5px;font-weight:500}
.top nav a.on{background:var(--tinta);color:#fff}
#m{max-width:1100px;margin:0 auto;padding:20px 16px 120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--tinta);background:#fff;font-weight:600;font-size:15px;text-decoration:none;color:var(--tinta)}
.btn.negro{background:var(--tinta);color:#fff}.btn.verde{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.grande{width:100%;min-height:56px;margin-top:18px;font-size:17px}
.btn:disabled{opacity:.4}
.lnk{color:var(--oro);text-decoration:underline;font-size:14px;padding:0}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--linea);border-radius:12px;background:#fff;font-size:16px}
input:focus,select:focus{outline:2px solid var(--tinta);outline-offset:-1px}
label{display:block;font-size:14px;color:var(--gris)}
label input,label select{margin-top:4px;color:var(--tinta)}
.err{color:var(--rojo);margin-top:8px}
.login{max-width:360px;margin:12vh auto;text-align:center}
.login input{font-size:32px;letter-spacing:12px;text-align:center;margin-top:18px}
.cargando,.vacio{color:var(--gris);text-align:center;padding:40px 0}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.acc{display:flex;gap:8px;align-items:center}.acc select{width:auto;min-height:48px;border-radius:999px;font-weight:600}
.volver{display:inline-block;color:var(--gris);text-decoration:none;margin-bottom:10px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filtros input{flex:1;min-width:180px;border-radius:999px}
.pill{padding:10px 16px;border-radius:999px;border:1px solid var(--linea);background:#fff;font-weight:600;font-size:14.5px}
.pill.sel{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.lista{display:flex;flex-direction:column;gap:10px}
.fila{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--linea);border-radius:var(--r);text-decoration:none;color:inherit}
.fila img{width:96px;height:64px;object-fit:cover;border-radius:10px;background:var(--bg)}
.fila b{display:block}.fila span{display:block;color:var(--gris);font-size:14px}
.sigue{display:block;font-style:normal;font-size:13.5px;color:var(--oro);font-weight:600;margin-top:2px}
.der{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.der small{font-size:12.5px;font-weight:600}
.est{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:#eee;color:var(--tinta)!important}
.e-nuevo{background:#fdecc8!important}.e-cotizado{background:#e3ecfb!important}.e-confirmado,.e-fabricacion{background:#e7e0f6!important}.e-listo{background:#dff3e6!important}.e-entregado{background:#e8e6e2!important}.e-cancelado{background:#f6dcdc!important}
.bien{color:var(--verde)}.mal{color:var(--rojo)}
.banner{padding:14px 18px;border-radius:var(--r);background:var(--tinta);color:#fff;margin-bottom:14px}
.banner b{color:#e6c896}
.nota-cli{background:#fff;border-left:3px solid var(--oro);padding:10px 14px;border-radius:8px;margin-bottom:14px;color:var(--gris)}
.sec{background:var(--card);border:1px solid var(--linea);border-radius:var(--r);padding:18px;margin-bottom:14px}
.sec h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;margin-bottom:14px}
.sec h2 span{width:30px;height:30px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center;font-size:15px}
.mesa{display:grid;gap:18px}
.mesa img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--bg)}
img.sin{min-height:60px}
.tit{font-weight:700;font-size:17px;margin:4px 0 8px}
.res{list-style:none;padding:0;border-top:1px solid var(--linea)}
.res li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:15px}
.res span{color:var(--gris)}
.cambiar{margin-top:12px}.cambiar summary{cursor:pointer;font-weight:600;color:var(--oro)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.croquis{overflow:auto;border:1px solid var(--linea);border-radius:12px}
.croquis svg{display:block;width:100%;height:auto;min-width:640px}
.botones{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:12px 14px}
.kpi span{display:block;font-size:13px;color:var(--gris)}.kpi b{display:block;font-size:20px}.kpi small{color:var(--gris);font-size:12.5px}
.avisos{margin:12px 0 0;padding:10px 14px 10px 30px;background:#fdf1ef;border-radius:12px;color:var(--rojo);font-size:14px}
.cortes{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.cortes th{text-align:left;color:var(--gris);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;padding:6px 4px;border-bottom:1px solid var(--linea)}
.cortes td{padding:7px 4px;border-bottom:1px solid var(--linea)}
.precio{display:grid;gap:18px}
.lin{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.lin span{flex:1;color:var(--tinta)}.lin small{color:var(--gris)}
.lin input{width:140px;text-align:right}
.o{font-size:13px;color:var(--gris);margin:12px 0 4px;text-transform:uppercase;letter-spacing:1px}
.pactado span{display:block;font-weight:700;color:var(--tinta);margin-bottom:4px}
.pactado input{font-size:24px;font-weight:700;padding:14px 16px}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.cifras>div{background:var(--bg);border-radius:12px;padding:12px 14px}
.cifras span{display:block;font-size:13px;color:var(--gris)}.cifras b{display:block;font-size:24px}.cifras small{display:block;font-size:12.5px;color:var(--gris)}
.gan.bien{background:#e3f4ea}.gan.bien b,.gan.bien small{color:var(--verde)}
.gan.mal{background:#fbe5e2}.gan.mal b,.gan.mal small{color:var(--rojo)}
.aviso-rojo{color:var(--rojo);margin-top:10px;font-weight:600}
.ok-c{background:#e3f4ea;color:#17663a;padding:10px 14px;border-radius:12px}
.pagos{list-style:none;padding:0;margin-top:12px}
.pagos li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea)}
.pagos li span{flex:1;color:var(--gris)}
.nuevo-pago{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.nuevo-pago .btn{grid-column:1/-1}
.guardar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--linea);box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.guardar span{font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;background:var(--tinta);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;max-width:90vw}
@media (min-width:860px){
  .mesa{grid-template-columns:1.2fr 1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .precio{grid-template-columns:1fr 1fr;align-items:start}
  .nuevo-pago{grid-template-columns:1fr 1fr 1fr auto}.nuevo-pago .btn{grid-column:auto}
}
@media (max-width:520px){.fila{grid-template-columns:72px 1fr}.fila img{width:72px;height:54px}.der{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:wrap}.grid2{grid-template-columns:1fr}h1{font-size:28px}}

/* secciones: pedidos y logística · taller y creación */
.top nav a .lg{display:inline}
.tabs{display:flex;gap:6px;background:#ebe7e0;padding:5px;border-radius:999px;margin:0 0 14px;width:max-content;max-width:100%}
.tabs a{padding:10px 18px;border-radius:999px;text-decoration:none;color:var(--gris);font-weight:600;font-size:14.5px;white-space:nowrap}
.tabs a.on{background:var(--tinta);color:#fff}
.resumen-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.rg{background:var(--card);border:1px solid var(--linea);border-radius:var(--r);padding:12px 14px}
.rg b{display:block;font-size:28px;line-height:1.1}.rg span{font-size:13px;color:var(--gris)}
.rg.mal{background:#fbe5e2;border-color:#f3c9c3}.rg.mal b{color:var(--rojo)}
.rg.ambar{background:#fdf1d8;border-color:#f3dfae}.rg.ambar b{color:#9a6b00}
.rg.gris b{color:var(--gris)}
.grupo{display:flex;align-items:center;gap:8px;margin:22px 0 8px}
.grupo small{background:var(--tinta);color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;letter-spacing:0}
.g-tarde{color:var(--rojo)}.g-tarde small{background:var(--rojo)}.g-semana{color:#9a6b00}.g-semana small{background:#c48a00}
.ent{display:inline-block;font-weight:700;font-size:13.5px;padding:3px 10px;border-radius:999px;background:#eee}
.ent.mal{background:#fbe5e2;color:var(--rojo)}.ent.ambar{background:#fdf1d8;color:#9a6b00}.ent.bien{background:#e3f4ea;color:var(--verde)}.ent.gris{color:var(--gris)}
.der small{color:var(--gris);font-weight:500}
.herr{color:var(--tinta)!important;font-weight:600!important}.herr.falta{color:#9a6b00!important}
.marg{font-size:12.5px;font-weight:700}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label.full{grid-column:1/-1}
textarea{width:100%;padding:12px 14px;border:1px solid var(--linea);border-radius:12px;background:#fff;font-size:16px;resize:vertical}
.oc-vista{margin-top:14px;background:var(--bg);border-radius:12px;padding:14px;display:flex;justify-content:center}
.oc-vista img{max-width:520px;width:100%;box-shadow:0 6px 24px rgba(0,0,0,.12);border-radius:4px;background:#fff;min-height:200px}
@media (max-width:640px){.top nav a .lg{display:none}.top nav a{padding:8px 10px}.resumen-g{grid-template-columns:repeat(2,1fr)}.tabs a{padding:9px 13px;font-size:13.5px}}
.fila .marg.bien{color:var(--verde)}.fila .marg.mal{color:var(--rojo)}
.top{background:#0e0c0a;border:0}.top nav a{color:#bdb4a6}.top nav a.on{background:#c2a273;color:#16120d}</style></head><body>
