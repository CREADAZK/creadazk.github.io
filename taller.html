<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0907;--sheet:#13100d;--line:rgba(236,228,214,.12);--ink:#ece4d6;--mut:#9a8f7d;--g:#c2a273;--g2:#d9bd8c;--gl:rgba(194,162,115,.42);--wa:#25d366;
--serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;--sans:'Jost','Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:300 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--g)}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);max-width:860px;margin:0 auto}
.top img{height:40px;mix-blend-mode:lighten}.top span{margin-left:auto;font-size:13px;color:var(--mut)}.top button{color:var(--g);text-decoration:underline;text-underline-offset:3px}
.demo{background:#7a4a12;color:#fff;font-size:12px;text-align:center;padding:6px 12px}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
.k{display:block;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--g);margin-bottom:8px}
h1{font:300 clamp(30px,7vw,44px)/1.05 var(--serif);margin-bottom:6px;overflow-wrap:anywhere}h1 em{color:var(--g)}
h3{font:400 21px/1.2 var(--serif);margin-bottom:6px;overflow-wrap:anywhere}
.lead{color:var(--mut);font-size:15px;margin-bottom:16px}
section{margin-top:28px}
.card{border:1px solid var(--gl);padding:16px;margin-top:12px;background:var(--sheet)}
dl.specs div{display:flex;align-items:baseline;gap:10px;padding:4px 0}
dl.specs dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
dl.specs i{flex:1;border-bottom:1px dotted rgba(194,162,115,.4);min-width:10px}dl.specs dd{font-size:14.5px;text-align:right}
.link{display:inline-block;margin-top:10px;font-size:13.5px;text-underline-offset:3px}
.note{margin-top:12px;padding:10px 12px;border-left:2px solid var(--g);background:rgba(194,162,115,.1);font-size:14px;overflow-wrap:anywhere}
.track{list-style:none;display:flex;margin:18px 0 4px}
.track li{flex:1;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:center;line-height:1.3}
.track i{display:block;height:3px;background:var(--line);margin:0 2px 8px}
.track .done{color:#cfc5b4}.track .done i{background:rgba(194,162,115,.5)}.track .on{color:var(--g)}.track .on i{background:var(--g)}
.tl{list-style:none;margin-top:6px}
.tl li{padding:12px 0 12px 14px;border-left:1px solid var(--gl);position:relative}
.tl li::before{content:'';position:absolute;left:-4px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--g)}
.tl li div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.tl b{font-weight:400;font-size:13px;color:var(--g2)}.tl time{font-size:12px;color:var(--mut)}
.tl p{font-size:14.5px;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere}
.tl li.msg p{color:var(--ink);background:var(--sheet);border:1px solid var(--line);padding:10px 12px;margin-top:6px}
.tl li.cliente::before{background:var(--ink)}.tl li.cliente b{color:var(--ink)}
.tl li.int p{color:var(--ink);background:rgba(217,180,90,.1);border:1px dashed rgba(217,180,90,.5);padding:10px 12px;margin-top:6px}
form{margin-top:14px}
label{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);margin:10px 0 0}label.chk input{width:20px;height:20px;accent-color:var(--g)}
input:not([type=checkbox]),textarea,select{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:300 16px/1.5 var(--sans);padding:12px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:10px 16px;border:1px solid var(--gl);color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-align:center;width:100%;margin-top:12px}
.btn.gold{background:var(--g);border-color:var(--g);color:#0b0907;font-weight:400}.btn.wa{background:var(--wa);border-color:var(--wa);color:#08140c;font-weight:400}.btn:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.two{grid-template-columns:1fr;gap:0}}
.err{margin-top:12px;padding:10px 12px;border-left:2px solid #d98a6a;background:rgba(217,138,106,.12);font-size:13.5px}[hidden]{display:none!important}
.rows{list-style:none;margin-top:14px}.rows a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rows b{display:block;font:400 20px/1.2 var(--serif);overflow-wrap:anywhere}.rows span{display:block;font-size:13.5px;color:var(--mut);overflow-wrap:anywhere}.rows .meta{margin-top:6px;font-size:12px}
mark{background:var(--g);color:#0b0907;font:400 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;vertical-align:middle}
.badge{display:inline-block;font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gl);padding:2px 8px;color:var(--g2);margin-right:6px}
.badge.nuevo{background:var(--g);color:#0b0907;border-color:var(--g)}.badge.entregado,.badge.cancelado,.badge.off{color:var(--mut);border-color:var(--line)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);padding:8px 12px;font-size:13px;color:var(--mut);white-space:nowrap}.filters button.on{border-color:var(--g);color:var(--ink);background:rgba(194,162,115,.13)}.filters b{font-weight:400;color:var(--g)}
.back{display:inline-block;margin-bottom:14px;font-size:13px;text-decoration:none}
details.fab{margin-top:14px;border-top:1px solid var(--line)}section>details.fab{border:1px solid var(--gl);background:var(--sheet);padding:0 16px;margin-top:12px}
details.fab summary{cursor:pointer;list-style:none;padding:14px 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.fab summary::-webkit-details-marker{display:none}details.fab summary::after{content:'+';margin-left:auto;font:300 24px/1 var(--serif)}details.fab[open] summary::after{content:'–'}
details.fab summary .badge{margin:0;letter-spacing:.08em}details.fab form{margin:0 0 16px}
.draw svg{width:100%;max-width:420px;display:block;margin:0 auto}
fieldset{border:0;margin-top:18px}legend{font:400 19px/1.2 var(--serif);color:var(--ink);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px}.grid label.wide{grid-column:1/-1}
.scroll{overflow-x:auto;margin-top:8px}.tab{border-collapse:collapse;width:100%;font-size:14px}.tab th,.tab td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:right;font-weight:300;font-variant-numeric:tabular-nums}.tab th:first-child{text-align:left;color:var(--g2)}.tab thead th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.tab td{font:400 20px/1 var(--serif)}
.cot .card{border-color:var(--g)}.cot-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;border-bottom:1px solid var(--gl);padding-bottom:10px;margin-bottom:6px;font-size:13px;color:var(--mut)}.cot-h b{color:var(--g);letter-spacing:.3em}
.cot h3{margin-top:14px}.specs.tot{margin-top:14px;border-top:1px solid var(--gl);padding-top:8px}.specs.tot dd{font:400 22px/1.2 var(--serif);color:var(--g2)}
.ok{margin-top:14px;padding:10px 12px;border-left:2px solid var(--wa);background:rgba(37,211,102,.1);font-size:14.5px}
@media print{body:has(#cot)>*:not(main),body:has(#cot) main>*:not(#cot),#cot .btn,#cot .lead,#cot .two,#cot .err,#cot>.k{display:none!important}
body:has(#cot){background:#fff!important}#cot .card{background:#fff;border:0;color:#000;padding:0}#cot *{color:#000!important}#cot dl.specs i{border-color:#999}}
.funnel .fl{display:grid;grid-template-columns:minmax(110px,38%) 1fr 44px 44px;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}.funnel .fl i{display:block;height:10px;background:var(--g);min-width:2px}
.funnel .fl b{font:400 20px/1 var(--serif);text-align:right}.funnel .fl em{font-style:normal;font-size:12px;color:var(--mut);text-align:right}
.canales{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0 10px}.canal{padding:12px}.canal h3{font-size:18px}.canal .two{grid-template-columns:1fr;gap:0}.canal .btn{min-height:44px;margin-top:8px;font-size:11px;letter-spacing:.1em}.canal code{display:block;font-size:12px;color:var(--mut);overflow-wrap:anywhere;margin:4px 0 10px}
.qr{background:#fff;padding:8px;width:120px;margin:0 auto}.qr img,.qr canvas{width:100%!important;height:auto!important;display:block}
.stars{display:flex;gap:6px}.stars button{font-size:34px;line-height:1;color:var(--line);min-width:44px;min-height:44px}.stars button.on{color:var(--g)}
#print{display:none}
@media print{html,body{background:#fff!important}body>*:not(#print){display:none!important}
#print{display:block;color:#000;font:13px/1.4 Arial,sans-serif;padding:0}
#print header{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;font-size:15px}#print header b{letter-spacing:.3em}#print header span{font-size:12px}
#print h2{font:700 18px/1.2 Arial,sans-serif;margin:12px 0 2px}#print h3{font:700 13px/1.2 Arial,sans-serif;color:#000;margin:12px 0 4px;text-transform:uppercase}
#print .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}#print svg{width:100%;border:1px solid #999}
#print table{width:100%;border-collapse:collapse;margin-top:6px}#print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left;font-weight:400;font-size:12px}#print th{width:58%;background:#f1f1f1}#print td i{color:#777}
#print .firma{margin-top:28px}}
#nav{display:flex;gap:6px;overflow-x:auto;max-width:860px;margin:0 auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}#nav:empty{display:none}
#nav a{flex:none;border:1px solid var(--line);padding:8px 12px;font-size:13px;color:var(--mut);text-decoration:none;white-space:nowrap}#nav a.on{border-color:var(--g);color:var(--ink);background:rgba(194,162,115,.13)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 10px}.kpis .card span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.kpis .card b{display:block;font:400 26px/1.2 var(--serif);color:var(--g2);margin-top:4px;overflow-wrap:anywhere}.kpis .card small{font-size:12px;color:var(--mut)}.kpis .neg b{color:#d98a6a}.kpis.sm .card b{font-size:22px}
.mes{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 4px}.mes b{font:400 22px/1 var(--serif);text-transform:capitalize;min-width:170px;text-align:center}.mes button{border:1px solid var(--gl);min-width:44px;min-height:44px;font-size:22px;color:var(--g)}.mes button:disabled{opacity:.3}
.mini{list-style:none;margin:8px 0}.mini li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.mini li span{flex:1 1 180px;color:var(--mut);overflow-wrap:anywhere}.mini li span b{color:var(--ink);font-weight:400}.mini li>b{font:400 19px/1 var(--serif);color:var(--g2)}
.mini.big{margin-top:14px}.x{font-size:12px;color:var(--mut);text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 4px}.x[data-armed]{color:#d98a6a}
mark.late{background:#d98a6a}.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px}.checks label.chk{margin:8px 0 0}.checks small{color:var(--mut);font-size:12px}
.acts2{display:flex!important;gap:14px;margin-top:4px}.prod{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}.tab td.t{font:300 14px/1.4 var(--sans)}
.card>.specs.tot:first-child{border-top:0;margin-top:0;padding-top:0}
main.wide{max-width:1240px}.cq-lay{display:grid;gap:14px;margin-top:6px}@media (min-width:1000px){.cq-lay{grid-template-columns:minmax(330px,390px) 1fr;align-items:start}.cq-lay>.cq-out{position:sticky;top:10px;order:2}}
.cq-sheet{background:#f6f1e6;margin-top:12px;border:1px solid var(--gl);box-shadow:0 12px 30px rgba(0,0,0,.4);cursor:zoom-in}.cq-sheet svg{display:block;width:100%;height:auto}
.cq-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px}#cq-form{margin-top:0}#cq-form fieldset:first-of-type{margin-top:6px}
.rev{list-style:none;margin-top:8px}.rev li{padding:9px 10px 9px 32px;position:relative;border-bottom:1px solid var(--line);font-size:14.5px;overflow-wrap:anywhere}.rev li::before{position:absolute;left:9px;top:8px;font-weight:500}
.rev .ok::before{content:'✓';color:#7fc79a}.rev .warn{color:#f3dcc4}.rev .warn::before{content:'!';color:#e39a5c}.rev .info::before{content:'•';color:var(--g)}.cq-tab td.t{font-size:13.5px;text-align:left}
.cq-zoom{position:fixed;inset:0;z-index:50;background:rgba(8,7,5,.94);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 20px}.cq-zoom .btn{position:sticky;top:0;width:auto;margin:0 0 10px auto;background:var(--bg)}.cq-zoom>div{width:max(100%,1500px);background:#f6f1e6}.cq-zoom svg{display:block;width:100%;height:auto}
.tb .tb-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}.tb .tb-h>b{font:400 21px/1.2 var(--serif);margin-right:auto;overflow-wrap:anywhere}.tb-d{font-size:12.5px;color:var(--mut)}
.tb-i{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.tb-i>div{min-width:0}.tb-i .thumb{flex:none;width:118px;background:#f6f1e6;padding:0;border:1px solid var(--gl)}.thumb svg{display:block;width:100%;height:auto}
.tb-i b{display:block;font:400 18px/1.25 var(--serif);overflow-wrap:anywhere}.tb-i span{display:block;font-size:13px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
@media print{#print .cq-page{break-after:page;page-break-after:always}#print .cq-page:last-child{break-after:auto}#print .cq-page svg{border:0;width:100%;height:auto;display:block}}
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}.promo{margin-top:0;padding:10px}.promo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px}.promo b{display:block;font-size:14px;font-weight:400;margin-top:8px;min-height:2.6em;line-height:1.3}.promo .btn{min-height:46px;margin-top:8px;font-size:12.5px}
.alt{margin-top:16px;font-size:14px;color:var(--mut)}.alt button,.top a{color:var(--g);text-decoration:underline;text-underline-offset:3px}
</style></head><body>

<script>window.DAZK_FB={"apiKey":"AIzaSyBBJqI7K_xY9RDPFzAVedS_5EyplehRATg","db":"https://dazk-pedidos-default-rtdb.firebaseio.com"};window.DAZK_WA=[{"label":"+52 55 5109 0027","num":"525551090027"},{"label":"+52 55 8556 1037","num":"525585561037"}];</script><script>/* DAZK · pedidos: one data layer for the client page, the client's tracking page and the workshop panel.
   With window.DAZK_FB = { apiKey, db } it talks to Firebase (Realtime Database + Auth over REST; rules in firebase/database.rules.json).
   Without it, it runs in demo mode: everything stays in this browser's localStorage.
   Clients are anonymous: an order lives at pedidos/<secret token>, readable only by whoever has the token.
   DAZK staff enter with just their email: Firebase sends a one-time sign-in link that opens taller.html, and the device stays signed in.
   The owner's email is fixed (OWNER) and the owner adds or removes admins in admins/<email with . as ,>. The link also confirms the email, which the rules require. */
(function () {
  const FB = window.DAZK_FB || null, SITE = 'https://creadazk.github.io/';
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const ESTADOS = [['nuevo', 'Recibido'], ['cotizado', 'Cotizado'], ['confirmado', 'Confirmado'], ['fabricacion', 'En fabricación'], ['listo', 'Listo'], ['entregado', 'Entregado'], ['cancelado', 'Cancelado']];
  const estado = k => (ESTADOS.find(e => e[0] === k) || [k, k])[1];
  const digits = t => String(t || '').replace(/\D/g, '');
  // Mexican numbers are stored as typed; WhatsApp links need the country code
  const waNum = t => { const d = digits(t); return d.length === 10 ? '52' + d : d; };
  const sortP = p => { p.items = (p.items || []).slice().sort((a, b) => a.pos - b.pos); p.eventos = (p.eventos || []).slice().sort((a, b) => a.id - b.id); return p; };
  const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  // where a visitor came from, as a short channel name: a campaign link (?c=instagram) or the site that sent them
  function canalDe(x) {
    const s = String(x || '').toLowerCase();
    if (/instagram/.test(s)) return 'instagram'; if (/facebook|fb\.(com|me)|messenger/.test(s)) return 'facebook'; if (/whatsapp|wa\.me/.test(s)) return 'whatsapp';
    if (/tiktok/.test(s)) return 'tiktok'; if (/google/.test(s)) return 'google'; if (s === 'link compartido') return 'compartido';
    return s.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').slice(0, 30);
  }

"t":"Hecha a la medida exacta"},{"f":"promo/08-como-pedir.jpg?v=1792604869625","t":"Cómo pedir tu mesa"},{"f":"promo/09-croquis-comedor.jpg?v=1792604869625","t":"Croquis · Mesa de comedor"},{"f":"promo/10-croquis-redonda.jpg?v=1792604869625","t":"Croquis · Periquera redonda"}];</script><script>/* DAZK · ficha de fabricación: the workshop's paper sheets (cubierta / MDF / base, vista aérea, volados, especificaciones, pago) as part of each order.
   It starts from what the client designed; every other measure stays empty until the workshop defines it. Volados are calculated, never typed. */
(function () {
  const A = window.DAZK_API, esc = A.esc;
  const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) && n > 0 ? n : null; };
  const spec = (it, k) => { const s = (it.specs || []).find(x => x[0] === k); return s ? s[1] : ''; };
  const SEL = { cMat: ['Piedra sinterizada', 'Mármol', 'Granito', 'Cuarzo', 'Otro'], cAcab: ['Mate', 'Brillante', 'Texturizado'], cCanto: ['Recto', 'Biselado', 'Otro'], cRef: ['Sí', 'No'],
    bAcab: ['Mate', 'Brillante', 'Texturizado'], bNiv: ['Sí', 'No'], bPlac: ['Sí', 'No'] };
  const GROUPS = [
    ['1 · Cubierta', [['cL', 'Largo (cm)', 'n'], ['cW', 'Ancho (cm)', 'n'], ['cEsp', 'Espesor (mm)', 'n'], ['cMat', 'Material'], ['cMarca', 'Marca / modelo'], ['color', 'Color / piedra'], ['cAcab', 'Acabado'], ['cCanto', 'Tipo de canto'], ['cRef', 'Refuerzo inferior']]],
    ['2 · MDF', [['mL', 'Largo (cm)', 'n'], ['mW', 'Ancho (cm)', 'n'], ['mEsp', 'Espesor (mm)', 'n'], ['mMat', 'Material del MDF']]],
    ['3 · Base de herrería', [['bL', 'Largo (cm)', 'n'], ['bW', 'Ancho (cm)', 'n'], ['bH', 'Alto (cm)', 'n'], ['bDis', 'Diseño de la base'], ['bColor', 'Color de pintura'], ['bAcab', 'Acabado'], ['bPint', 'Tipo de pintura'], ['bPerf', 'Perfil de herrería (cm)', 'n'], ['bNiv', 'Niveladores'], ['bPlac', 'Placas de montaje']]],
    ['Mesa terminada', [['alto', 'Altura total (cm)', 'n'], ['obs', 'Observaciones de fabricación', 't']]],
  ];
  const PAGO = [['total', 'Precio total ($)', 'n'], ['anticipo', 'Anticipo ($)', 'n'], ['entrega', 'Fecha de entrega', 'd'], ['direccion', 'Dirección de entrega'], ['condiciones', 'Condiciones para el cliente (las ve en su cotización)', 't'], ['obs', 'Observaciones internas', 't']];

  // the client's design, read from the order line
  function inicio(it) {
    const m = spec(it, 'Medidas'), r = /Ø\s*(\d+)/.exec(m), d = /(\d+)\s*×\s*(\d+)/.exec(m);
    return { forma: r ? 'round' : spec(it, 'Forma') === 'Ovalada' ? 'oval' : spec(it, 'Forma') === 'Cuadrada' ? 'square' : 'rect', cL: r ? r[1] : d ? d[1] : '', cW: r ? '' : d ? d[2] : '',
      alto: (/(\d+)/.exec(spec(it, 'Altura')) || [])[1] || '', color: spec(it, 'Piedra'), bDis: spec(it, 'Base'), bColor: spec(it, 'Acabado') };
  }
  const valores = (p, it, i) => Object.assign(inicio(it), (p.fichas || {})['i' + i] || {});
  const medidas = v => ['cL', 'mL', 'bL', 'bH', 'alto', 'cEsp'].concat(v.forma === 'round' ? [] : ['cW', 'mW', 'bW']);
  const faltan = v => medidas(v).filter(k => !num(v[k])).length;
  const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ',');

  // volados and checks, all derived from the three pieces (assumed centred, as in the workshop sheets)
  function calculo(v) {
    const g = k => num(v[k]), round = v.forma === 'round', out = [], warn = [];
    const pair = (a, b, la, mal, eje) => { if (g(a) && g(b)) { const d = (g(a) - g(b)) / 2; out.push([`${la} ${eje}`, fmt(d) + ' cm']); if (d < 0 && !warn.includes(mal)) warn.push(mal); } };
    const ejeL = round ? 'todo alrededor' : 'izquierdo y derecho', ejeW = 'frontal y posterior';
    pair('cL', 'mL', 'Volado de la cubierta sobre el MDF,', 'El MDF es más grande que la cubierta.', ejeL); if (!round) pair('cW', 'mW', 'Volado de la cubierta sobre el MDF,', 'El MDF es más grande que la cubierta.', ejeW);
    pair('cL', 'bL', 'Volado de la cubierta sobre la base,', 'La base es más grande que la cubierta.', ejeL); if (!round) pair('cW', 'bW', 'Volado de la cubierta sobre la base,', 'La base es más grande que la cubierta.', ejeW);
    pair('mL', 'bL', 'El MDF sobresale de la base,', 'La base es más grande que el MDF.', ejeL); if (!round) pair('mW', 'bW', 'El MDF sobresale de la base,', 'La base es más grande que el MDF.', ejeW);
    if (g('alto') && g('bH') && g('cEsp')) { const resto = g('alto') - g('bH') - g('cEsp') / 10; out.push(['Queda para MDF y pegamento', fmt(resto) + ' cm']);
      if (resto < 0) warn.push('La base más la cubierta ya pasan la altura total.'); else if (g('mEsp') && Math.abs(resto - g('mEsp') / 10) > .3) warn.push(`Base + MDF + cubierta suman ${fmt(g('bH') + g('mEsp') / 10 + g('cEsp') / 10)} cm y la altura total dice ${fmt(g('alto'))} cm.`); }
    return { out, warn };
  }
  // vista aérea encimada, to scale
  function dibujo(v, print) {
    const g = k => num(v[k]), round = v.forma === 'round', L = g('cL'), W = round ? L : g('cW');
    if (!L || !W) return '<p class="lead">Escribe las medidas de la cubierta para ver la vista aérea.</p>';
    const k = Math.min(300 / L, 190 / W), cx = 180, cy = 120, ink = print ? '#000' : '#ece4d6';

      const m = h.m, ph = { cL: m.L, cW: m.W, alto: m.Ht, cEsp: m.esp, bPerf: m.s, bL: 2 * m.hx, bW: 2 * m.hz, bH: m.bH, mL: m.mL, mW: m.mW };
      Object.keys(ph).forEach(k => { const e = form.querySelector(`[data-k="${k}"]`); if (e && e.tagName === 'INPUT') e.placeholder = m.sug.has(k) && ph[k] ? 'sugerido ' + fmt(ph[k]) : ''; });
    };
    form.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(draw, 140); });
    form.addEventListener('change', draw);
    const mod = main.querySelector('#cq-mod');
    if (mod) mod.onchange = () => { const x = (CAT.modelos || []).find(y => y[0] === mod.value); if (!x) return;
      const set = (k, val) => { const e = form.querySelector(`[data-k="${k}"]`); if (e) e.value = val == null ? '' : val; };
      set('forma', x[3]); set('cL', x[5]); set('cW', x[3] === 'round' || x[3] === 'square' ? '' : x[6]); set('alto', x[7]); set('bDis', bName(x[4])); set('color', ((CAT.stones || []).find(s => s[0] === x[8]) || [])[1] || '');
      set('titulo', 'Mesa ' + x[1]); ['bL', 'bW', 'bH', 'bPerf'].forEach(k => set(k, '')); draw(); };
    main.querySelector('#cq-png').onclick = e => descargar(h, meta(), e.target);
    main.querySelector('#cq-pr').onclick = () => imprimir([h.svg]);
    main.querySelector('#cq-z').onclick = () => zoom(h.svg);
    const sh = main.querySelector('#cq-sh'); if (sh) sh.onclick = e => compartir(h, meta(), e.target);
    const sv = main.querySelector('#cq-save');
    if (sv) sv.onclick = async () => {
      const prev = (ctx.p.fichas || {})['i' + ctx.i] || {}, x = Object.assign({}, prev); KEYS.forEach(k => { delete x[k]; }); Object.assign(x, leer()); delete x.cant;
      sv.disabled = true; const er = main.querySelector('#cq-err'); er.hidden = true;
      try { await A.guardarFicha(ctx.p.id, 'i' + ctx.i, x, 'Actualizó el croquis y la ficha de: ' + it.titulo); draft = null; const id = ctx.p.id; await reload(true); location.hash = 'p=' + id; }
      catch (e) { er.textContent = e.message; er.hidden = false; sv.disabled = false; }
    };
    draw();
  }
  // inside an order: the drawing of each table, from its ficha
  const html = (p, it, i) => `<details class="fab cq" data-c="${i}"><summary>Croquis de taller <em class="badge">a escala</em></summary><div class="cq-in"></div></details>`;
  function bind(root, p, me) {
    root.querySelectorAll('details[data-c]').forEach(d => {
      const i = +d.dataset.c, it = p.items[i], box = d.querySelector('.cq-in');
      const draw = () => { if (box.dataset.ok) return; box.dataset.ok = 1; const h = hoja(Object.assign({}, window.DAZK_FICHA.valores(p, it, i), { cant: it.cantidad }), metaDe(p, it, me));
        box.innerHTML = `<div class="cq-sheet">${h.svg}</div>${revHtml(h.m)}<div class="cq-acts"><button type="button" class="btn gold" data-ed>Editar el croquis</button><button type="button" class="btn" data-png>Descargar imagen</button><button type="button" class="btn" data-pr>Imprimir o PDF</button></div>`;
        box.querySelector('[data-ed]').onclick = () => { ctx = { id: p.id, i }; draft = null; location.hash = 'croquis'; };
        box.querySelector('[data-png]').onclick = e => descargar(h, metaDe(p, it, me), e.target);
        box.querySelector('[data-pr]').onclick = () => imprimir([h.svg]);
        box.querySelector('.cq-sheet').onclick = () => zoom(h.svg); };
      if (d.open) draw(); d.addEventListener('toggle', () => { if (d.open) draw(); });
    });
  }

  // ---------- Taller: what to make and deliver, for the people who build the tables ----------
  let tf = 'todo';
  const entregaDe = p => ((p.fichas || {}).pago || {}).entrega || (p.cotizacion && p.cotizacion.entrega) || '';
  const SIG = { confirmado: ['fabricacion', 'Empezar fabricación'], fabricacion: ['listo', 'Marcar como lista'], listo: ['entregado', 'Marcar entregada'] };
  function cuando(e) {
    if (!e) return ['Sin fecha de entrega', ''];
    const d = Math.round((new Date(e + 'T12:00:00') - new Date(hoy() + 'T12:00:00')) / 864e5);
    return d < 0 ? [`Atrasada ${-d} día${d === -1 ? '' : 's'}`, 'late'] : d === 0 ? ['Se entrega hoy', 'hoy'] : d === 1 ? ['Se entrega mañana', 'hoy'] : [`Faltan ${d} días · ${A.dia(e)}`, ''];
  }
  function linea(v) { const m = modelo(v), s = k => m.sug.has(k) ? '*' : '';
    return `${m.round ? 'Ø ' + fmt(m.L) + s('cL') : secc(m.L, m.W) + s('cL')} × ${fmt(m.Ht)}${s('alto')} cm · ${v.color || 'piedra por definir'} ${m.esp}${s('cEsp')} mm · base ${bName(m.base)}${s('bDis')}${v.bColor ? ' ' + v.bColor.toLowerCase() : ''}`; }
  function taller(main, all, reload, me) {
    const F = window.DAZK_FICHA, h0 = hoy(), sem = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    const act = all.filter(p => SIG[p.estado]), pend = all.filter(p => p.estado === 'nuevo' || p.estado === 'cotizado').length;
    const ord = (a, b) => (entregaDe(a) || '9999').localeCompare(entregaDe(b) || '9999') || a.folio - b.folio;
    const l = act.filter(p => tf === 'todo' || p.estado === tf).sort(ord);
    const late = act.filter(p => entregaDe(p) && entregaDe(p) < h0).length, semana = act.filter(p => entregaDe(p) && entregaDe(p) >= h0 && entregaDe(p) <= sem).length;
    const card = p => { const [t, c] = cuando(entregaDe(p)), nx = SIG[p.estado];
      const wa = p.estado === 'listo' && p.tel ? `https://wa.me/${A.waNum(p.tel)}?text=${encodeURIComponent(`Hola ${p.nombre.split(' ')[0]}, te escribimos de DAZK: tu pedido #${p.folio} ya está listo. ¿Qué día te queda bien la entrega? Tu pedido: ${A.seguimiento(p.token)}`)}` : '';
      return `<article class="card tb"><div class="tb-h"><b>#${esc(p.folio)} · ${esc(p.nombre)}</b><em class="badge ${p.estado}">${esc(A.estado(p.estado))}</em>${c ? `<mark class="${c === 'late' ? 'late' : ''}">${esc(t)}</mark>` : `<span class="tb-d">${esc(t)}</span>`}</div>
        ${p.items.map((it, i) => { const v = F.valores(p, it, i), n = F.faltan(v);
          return `<div class="tb-i"><button type="button" class="thumb" data-cq="${esc(p.id)}:${i}" aria-label="Abrir croquis de ${esc(it.titulo)}">${miniatura(v)}</button><div>
            <b>${it.cantidad > 1 ? esc(it.cantidad) + ' × ' : ''}${esc(it.titulo)}</b><span>${esc(linea(v))}</span>
            <span><em class="badge ${n ? '' : 'nuevo'}">${n ? 'ficha: faltan ' + n + ' medidas' : 'ficha completa'}</em> <button type="button" class="x" data-cq="${esc(p.id)}:${i}">Croquis</button></span></div></div>`; }).join('')}
        ${p.notas ? `<p class="note">${esc(p.notas)}</p>` : ''}
        <div class="two"><button type="button" class="btn gold" data-sig="${esc(p.id)}" data-e="${nx[0]}">${nx[1]}</button>${wa ? `<a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">Avisar que está lista</a>` : `<a class="btn" href="#p=${esc(p.id)}">Abrir pedido</a>`}</div></article>`; };
    main.className = '';
    main.innerHTML = `<span class="k">DAZK · taller</span><h1>Taller</h1><p class="lead">Lo que hay que fabricar y entregar, por fecha de entrega. Toca un dibujo para ver su croquis a escala.</p>
      <div class="kpis sm"><div class="card"><span>Por empezar</span><b>${act.filter(p => p.estado === 'confirmado').length}</b></div><div class="card"><span>En fabricación</span><b>${act.filter(p => p.estado === 'fabricacion').length}</b></div>
        <div class="card"><span>Listas</span><b>${act.filter(p => p.estado === 'listo').length}</b></div><div class="card"><span>Entregas en 7 días</span><b>${semana}</b></div><div class="card ${late ? 'neg' : ''}"><span>Atrasadas</span><b>${late}</b></div></div>
      <div class="filters">${[['todo', 'Todo'], ['confirmado', 'Por empezar'], ['fabricacion', 'En fabricación'], ['listo', 'Listas']].map(x => `<button type="button" data-tf="${x[0]}" class="${x[0] === tf ? 'on' : ''}">${x[1]} <b>${x[0] === 'todo' ? act.length : act.filter(p => p.estado === x[0]).length}</b></button>`).join('')}</div>
      ${l.length ? l.map(card).join('') + `<button type="button" class="btn" id="tb-pr">Imprimir los croquis de esta lista (${l.reduce((s, p) => s + p.items.length, 0)})</button>` : '<p class="lead">No hay nada aquí. Los pedidos llegan al taller cuando pasan a «Confirmado».</p>'}
      ${pend ? `<p class="note">Además hay ${pend} pedido${pend === 1 ? '' : 's'} recibido${pend === 1 ? '' : 's'} o cotizado${pend === 1 ? '' : 's'} que todavía no se confirma${pend === 1 ? '' : 'n'}. <a href="#">Ver pedidos</a></p>` : ''}
      <a class="btn gold" href="#nuevo">+ Registrar pedido</a>`;
    main.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { tf = b.dataset.tf; taller(main, all, reload, me); });
    main.querySelectorAll('[data-cq]').forEach(b => b.onclick = () => { const [id, i] = b.dataset.cq.split(':'); ctx = { id, i: +i }; draft = null; location.hash = 'croquis'; });
    main.querySelectorAll('[data-sig]').forEach(b => b.onclick = async () => { b.disabled = true; try { await A.staffEstado(b.dataset.sig, b.dataset.e); } catch (e) { b.textContent = e.message; return; } await reload(); });
    const pr = main.querySelector('#tb-pr'); if (pr) pr.onclick = () => imprimir(l.flatMap(p => p.items.map((it, i) => hoja(Object.assign({}, F.valores(p, it, i), { cant: it.cantidad }), metaDe(p, it, me)).svg)));
  }

  window.DAZK_CQ = { modelo, hoja, miniatura, pagina, html, bind, taller, FORMAS, ACAB, BASES, bName, entregaDe };
})();
</script><script>/* DAZK · marketing inside the workshop panel (taller.html#marketing): ready-made presentations to send, links and QR per channel, sales funnel, who to follow up today, and client reviews.
   Everything comes from real visits and orders; nothing is estimated. */
(function () {
  const A = window.DAZK_API, esc = A.esc, SITE = 'https://creadazk.github.io/';
  const CANALES = [['instagram', 'Instagram'], ['facebook', 'Facebook'], ['whatsapp', 'WhatsApp (estados y difusión)'], ['marketplace', 'Marketplace'], ['tiktok', 'TikTok'], ['google', 'Google'],
    ['volante', 'Volante / tarjeta (QR)'], ['showroom', 'Showroom (QR)']];
  const NOMBRE = Object.assign(Object.fromEntries(CANALES), { directo: 'Directo (escribieron la dirección)', compartido: 'Link compartido por un cliente' });
  const label = c => NOMBRE[c] || c;
  const ms = x => typeof x === 'number' ? x : new Date(x).getTime();
  const DIA = 864e5, pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  let periodo = 30, extra = A.load('dazk-canales-extra', []);

  function loadQR() {
    if (window.QRCode) return Promise.resolve();
    return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
  }
  const linkDe = c => SITE + '?c=' + encodeURIComponent(c);
  function copiar(t, b) {
    const done = () => { const o = b.textContent; b.textContent = 'Copiado ✓'; setTimeout(() => { b.textContent = o; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => window.prompt('Copia este link:', t)); else window.prompt('Copia este link:', t);
  }
  // the ready-made presentations (presentaciones.js renders them into the site's promo/ folder)
  const PROMOS = window.DAZK_PROMOS || [];
  const mensaje = () => 'Hola, te comparto nuestras mesas DAZK. Diseña la tuya en 3D aquí: ' + SITE + '?c=whatsapp' + ((window.DAZK_WA || []).length ? ' · WhatsApp: ' + window.DAZK_WA.map(w => w.label).join(' / ') : '');
  const nombreDe = x => 'DAZK ' + x.t.replace(/[^\wÁÉÍÓÚáéíóúÑñü ·-]/g, '') + '.jpg';
  function bajar(l) { l.forEach(x => { const a = document.createElement('a'); a.href = x.f; a.download = nombreDe(x); document.body.appendChild(a); a.click(); a.remove(); }); }
  // on a phone this opens the share sheet (WhatsApp, etc.) with the images; elsewhere they are downloaded
  async function compartir(l, b) {
    const o = b.textContent; b.disabled = true; b.textContent = 'Preparando…';
    try {
      const files = await Promise.all(l.map(async x => new File([await (await fetch(x.f)).blob()], nombreDe(x), { type: 'image/jpeg' })));
      if (navigator.canShare && navigator.canShare({ files })) await navigator.share({ files, text: mensaje() }); else bajar(l);
    } catch (e) { if (e.name !== 'AbortError') bajar(l); }
    b.disabled = false; b.textContent = o;
  }
  const waLink = (p, txt) => p.tel ? `https://wa.me/${A.waNum(p.tel)}?text=${encodeURIComponent(txt)}` : '';
  const nom = p => p.nombre.split(' ')[0];

  // who needs a message today, with the message already written
  function seguimiento(all) {
    const now = Date.now(), out = [];
    all.forEach(p => {
      const link = A.seguimiento(p.token), c = p.cotizacion;
      const ult = p.eventos.filter(e => !e.interno), last = ult[ult.length - 1];
      if (p.estado === 'nuevo' && last && last.autor === 'cliente' && now - ms(last.creado) > DIA)
        out.push([p, 'Apartó hace ' + Math.floor((now - ms(p.creado)) / DIA) + ' días y no le han contestado', `Hola ${nom(p)}, gracias por apartar tu mesa en DAZK (pedido #${p.folio}). Ya estamos revisando tu diseño; ¿nos confirmas medidas del espacio y para cuándo la necesitas? ${link}`]);
      else if (p.estado === 'cotizado' && c && !c.aceptada && now - ms(c.enviada) > 3 * DIA)
        out.push([p, 'Cotización sin aceptar desde hace ' + Math.floor((now - ms(c.enviada)) / DIA) + ' días', `Hola ${nom(p)}, ¿pudiste revisar la cotización de tu mesa DAZK (pedido #${p.folio})? Si quieres ajustar medida, piedra o base, con gusto lo vemos. Aquí la tienes: ${link}`]);
      else if (p.estado === 'entregado' && !p.resena && now - ms(p.actualizado) > 2 * DIA)
        out.push([p, 'Entregado y sin opinión', `Hola ${nom(p)}, ¿cómo quedó tu mesa DAZK? Nos ayudaría muchísimo tu opinión, son 10 segundos: ${link}`]);
    });
    return out;
  }

  async function render(main, all, reload) {
    main.innerHTML = '<a class="back" href="#">‹ Pedidos</a><span class="k">Panel DAZK</span><h1>Marketing</h1><p class="lead">Cargando…</p>';
    let vis; try { vis = await A.visitas(); } catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    if (location.hash !== '#marketing') return;
    const desde = Date.now() - periodo * DIA, V = vis.filter(v => v.t >= desde), P = all.filter(p => ms(p.creado) >= desde);
    const cot = P.filter(p => p.cotizacion), acep = P.filter(p => p.cotizacion && p.cotizacion.aceptada), ent = P.filter(p => p.estado === 'entregado');
    const monto = l => l.reduce((s, p) => s + (p.cotizacion ? p.cotizacion.total : 0), 0);
    const pasos = [['Visitas', V.length], ['Personas distintas', new Set(V.map(v => v.v)).size], ['Llegaron a cotizar', V.filter(v => v.paso >= 3).length], ['Apartaron mesa', P.length],
      ['Recibieron cotización', cot.length], ['Aceptaron', acep.length], ['Entregados', ent.length]];
    const max = Math.max(1, pasos[0][1]);
    // per channel: visits and orders, with the money accepted
    const canales = {}; const fila = c => canales[c] = canales[c] || { v: 0, cot: 0, ped: 0, ac: 0, monto: 0 };
    V.forEach(v => { const r = fila(A.canal(v.origen || 'directo')); r.v++; if (v.paso >= 3) r.cot++; });
    P.forEach(p => { const r = fila(p.canal || 'directo'); r.ped++; if (p.cotizacion && p.cotizacion.aceptada) { r.ac++; r.monto += p.cotizacion.total; } });
    const filas = Object.entries(canales).sort((a, b) => b[1].ped - a[1].ped || b[1].v - a[1].v);
    const seg = seguimiento(all), pend = all.filter(p => p.resena && !p.resenaPublica);
    const lista = CANALES.concat(extra.map(c => [c, c]));

    main.innerHTML = `<a class="back" href="#">‹ Pedidos</a><span class="k">Panel DAZK</span><h1>Marketing</h1>
      <div class="filters">${[7, 30, 90, 365].map(d => `<button type="button" data-per="${d}" class="${d === periodo ? 'on' : ''}">${d === 365 ? 'Último año' : 'Últimos ' + d + ' días'}</button>`).join('')}</div>
      ${PROMOS.length ? `<section><span class="k">Presentaciones para enviar · ${PROMOS.length}</span>
        <p class="lead">Con tus números, el link de la página y su QR. Toca «Enviar» y elige WhatsApp; el mensaje de abajo lleva el link para que sepas qué clientes llegaron por aquí.</p>
        <div class="promos">${PROMOS.map((x, i) => `<div class="card promo"><img src="${esc(x.f)}" alt="${esc(x.t)}" loading="lazy"><b>${esc(x.t)}</b>
          <button type="button" class="btn gold" data-share="${i}">Enviar</button><button type="button" class="btn" data-down="${i}">Descargar</button></div>`).join('')}</div>
        <div class="card"><p>${esc(mensaje())}</p><div class="two"><button type="button" class="btn" id="pr-msg">Copiar mensaje</button><button type="button" class="btn gold" id="pr-all">Enviar las ${PROMOS.length}</button></div></div></section>` : ''}
      <section><span class="k">Hoy hay que escribirle a</span>${seg.length ? seg.map(([p, por, txt]) => `<div class="card"><h3>#${esc(p.folio)} · ${esc(p.nombre)}</h3><p class="lead">${esc(por)}</p>
        <div class="two">${p.tel ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(p, txt))}">Mandar WhatsApp</a>` : '<span class="note">No dejó WhatsApp: escríbele en su pedido.</span>'}<a class="btn" href="#p=${esc(p.id)}">Abrir pedido</a></div></div>`).join('') : '<p class="lead">Nadie pendiente. Bien.</p>'}</section>
      <section><span class="k">Embudo de ventas</span><div class="card funnel">${pasos.map((s, i) => `<div class="fl"><span>${s[0]}</span><i style="width:${Math.max(2, s[1] / max * 100)}%"></i><b>${s[1]}</b><em>${i ? pct(s[1], pasos[i - 1][1]) : ''}</em></div>`).join('')}
        <dl class="specs tot"><div><dt>Vendido (cotizaciones aceptadas)</dt><i></i><dd>${A.pesos(monto(acep))}</dd></div><div><dt>Cotizado en total</dt><i></i><dd>${A.pesos(monto(cot))}</dd></div>${acep.length ? `<div><dt>Venta promedio</dt><i></i><dd>${A.pesos(Math.round(monto(acep) / acep.length))}</dd></div>` : ''}</dl>
        ${vis.length >= 1000 ? '<p class="lead">Las visitas cuentan solo las últimas 1000.</p>' : ''}</div></section>
      <section><span class="k">¿Qué canal vende?</span>${filas.length ? `<div class="scroll"><table class="tab"><thead><tr><th>Canal</th><th>Visitas</th><th>A cotizar</th><th>Apartaron</th><th>Aceptaron</th><th>Vendido</th></tr></thead><tbody>
        ${filas.map(([c, r]) => `<tr><th>${esc(label(c))}</th><td>${r.v}</td><td>${r.cot}</td><td>${r.ped}</td><td>${r.ac}</td><td>${r.monto ? A.pesos(r.monto) : '—'}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="lead">Todavía no hay datos en este periodo.</p>'}<p class="lead">Para que esto funcione, usa en cada lugar su propio link o QR de aquí abajo.</p></section>
      <section><span class="k">Tus links y QR por canal</span><div class="canales">${lista.map(([c, n]) => `<div class="card canal"><h3>${esc(n)}</h3><code>${esc(linkDe(c))}</code>
        <div class="qr" data-qr="${esc(c)}"></div><div class="two"><button type="button" class="btn" data-copy="${esc(c)}">Copiar link</button><button type="button" class="btn" data-png="${esc(c)}">Descargar QR</button></div></div>`).join('')}</div>
        <form id="mk-new" class="card"><label for="mk-c">Otro canal (por ejemplo: expo-mueble, revista, constructora-x)<input type="text" id="mk-c" maxlength="30" placeholder="nombre-del-canal"></label><button class="btn gold" type="submit">Crear link y QR</button></form></section>
      <section><span class="k">Opiniones de clientes</span>${all.filter(p => p.resena).length ? all.filter(p => p.resena).map(p => `<div class="card"><h3>${'★'.repeat(p.resena.estrellas)}${'☆'.repeat(5 - p.resena.estrellas)} · ${esc(p.nombre)}</h3>
        ${p.resena.texto ? `<p>${esc(p.resena.texto)}</p>` : ''}<p class="lead">${p.resena.publicar ? 'Dio permiso de publicarla con su nombre.' : 'No dio permiso de publicarla.'}${p.resenaPublica ? ' · <b>Publicada en la página</b>' : ''}</p>
        ${p.resena.publicar ? `<button type="button" class="btn ${p.resenaPublica ? '' : 'gold'}" data-pub="${esc(p.id)}">${p.resenaPublica ? 'Quitar de la página' : 'Publicar en la página'}</button>` : ''}</div>`).join('')
        : '<p class="lead">Cuando marquen un pedido como Entregado, el cliente verá en su link un cuadro para calificar con estrellas. Aquí aparecen y ustedes eligen cuáles salen en la página.</p>'}</section>`;

    main.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { periodo = +b.dataset.per; render(main, all, reload); });
    main.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copiar(linkDe(b.dataset.copy), b));
    main.querySelectorAll('[data-share]').forEach(b => b.onclick = () => compartir([PROMOS[+b.dataset.share]], b));
    main.querySelectorAll('[data-down]').forEach(b => b.onclick = () => bajar([PROMOS[+b.dataset.down]]));
    const pm = main.querySelector('#pr-msg'); if (pm) pm.onclick = () => copiar(mensaje(), pm);

    try {
      await loadQR();
      main.querySelectorAll('[data-qr]').forEach(el => { new QRCode(el, { text: linkDe(el.dataset.qr), width: 512, height: 512, colorDark: '#0b0907', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); });
      main.querySelectorAll('[data-png]').forEach(b => b.onclick = () => { const cv = main.querySelector(`[data-qr="${CSS.escape(b.dataset.png)}"] canvas`); if (!cv) return;
        const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'QR DAZK ' + b.dataset.png + '.png'; document.body.appendChild(a); a.click(); a.remove(); });
    } catch (e) { main.querySelectorAll('[data-qr]').forEach(el => { el.textContent = 'No se pudo cargar el QR (revisa tu internet).'; }); }
  }
  const $ = s => document.querySelector(s);
  window.DAZK_MKT = { render, label };
})();
</script><script>/* DAZK · gestión inside the panel (taller.html): monthly summary, payments per order, what is still owed, expenses, clients, and orders captured by hand
   (clients who came by WhatsApp or to the showroom). Money comes only from what staff record; nothing is estimated. */
(function () {
  const A = window.DAZK_API, esc = A.esc, $ = s => document.querySelector(s);
  const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return isFinite(n) ? n : 0; };
  const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const mesNombre = m => { const [y, n] = m.split('-'); return MESES[+n - 1] + ' ' + y; };
  const mover = (m, d) => { const [y, n] = m.split('-').map(Number), t = new Date(y, n - 1 + d, 1); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); };
  let mes = hoy().slice(0, 7);
  const ym = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const METODOS = ['Transferencia', 'Efectivo', 'Tarjeta', 'Depósito', 'Otro'];
  const CATS = ['Piedra / placa', 'Herrería / base', 'MDF y madera', 'Mano de obra', 'Flete y entrega', 'Publicidad', 'Renta y servicios', 'Herramienta', 'Otro'];
  const CANALES = [['whatsapp', 'WhatsApp'], ['showroom', 'Showroom / en persona'], ['instagram', 'Instagram'], ['facebook', 'Facebook'], ['marketplace', 'Marketplace'], ['recomendacion', 'Recomendación'], ['otro', 'Otro']];

  // an order's money: the price comes from the quote (or the price typed in the sheet), payments are what staff recorded
  const total = p => p.cotizacion ? p.cotizacion.total : num(((p.fichas || {}).pago || {}).total);
  const pagado = p => (p.pagos || []).reduce((s, x) => s + x.monto, 0);
  const vendido = p => !!(p.cotizacion && p.cotizacion.aceptada) || ['confirmado', 'fabricacion', 'listo', 'entregado'].includes(p.estado);
  const saldo = p => p.estado === 'cancelado' || !vendido(p) ? 0 : Math.max(0, total(p) - pagado(p));
  const entrega = p => ((p.fichas || {}).pago || {}).entrega || (p.cotizacion && p.cotizacion.entrega) || '';
  const abierto = p => p.estado !== 'entregado' && p.estado !== 'cancelado';
  const nom1 = p => p.nombre.split(' ')[0];
  // a button that asks "are you sure" on the first tap (the viewer has no confirm dialogs)
  function dosToques(b, fn) {
    b.onclick = async () => {
      if (!b.dataset.armed) { b.dataset.armed = b.textContent; b.textContent = '¿Seguro? Toca otra vez'; setTimeout(() => { if (b.dataset.armed) { b.textContent = b.dataset.armed; delete b.dataset.armed; } }, 4000); return; }
      b.disabled = true; try { await fn(); } catch (e) { b.textContent = e.message; b.disabled = false; }
    };
  }
  const head = (t, lead) => `<span class="k">DAZK · gestión</span><h1>${t}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}`;
  const mesBar = () => `<div class="mes"><button type="button" data-mes="-1" aria-label="Mes anterior">‹</button><b>${mesNombre(mes)}</b><button type="button" data-mes="1" aria-label="Mes siguiente" ${mes >= hoy().slice(0, 7) ? 'disabled' : ''}>›</button></div>`;
  const bindMes = (main, again) => main.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { mes = mover(mes, +b.dataset.mes); again(); });
  const dl = rows => `<dl class="specs tot">${rows.map(r => `<div><dt>${r[0]}</dt><i></i><dd>${r[1]}</dd></div>`).join('')}</dl>`;

  // ---------- resumen ----------
  async function resumen(main, all) {
    main.innerHTML = head('Resumen') + '<p class="lead">Cargando…</p>';
    let G; try { G = await A.gastos(); } catch (e) { main.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    if (location.hash !== '#resumen') return;
    const pagosMes = all.flatMap(p => (p.pagos || []).filter(x => x.fecha.startsWith(mes)).map(x => Object.assign({ p }, x)));
    const cobrado = pagosMes.reduce((s, x) => s + x.monto, 0), gm = G.filter(g => g.fecha.startsWith(mes)), gastado = gm.reduce((s, g) => s + g.monto, 0);
    const nuevos = all.filter(p => ym(p.creado) === mes).length;
    const porCobrar = all.reduce((s, p) => s + saldo(p), 0), deben = all.filter(p => saldo(p) > 0).length;
    const ents = all.filter(p => abierto(p) && entrega(p)).sort((a, b) => entrega(a).localeCompare(entrega(b))), h = hoy();
    const sinFecha = all.filter(p => abierto(p) && vendido(p) && !entrega(p));
    const cats = CATS.map(c => [c, gm.filter(g => g.categoria === c).reduce((s, g) => s + g.monto, 0)]).filter(c => c[1]);
    const est = A.ESTADOS.filter(e => e[0] !== 'cancelado' && e[0] !== 'entregado').map(e => [e[1], all.filter(p => p.estado === e[0]).length]);
    main.innerHTML = head('Resumen', 'Lo que entró y salió en el mes, lo que les deben y lo que hay que entregar. Sale solo de los pagos y gastos que registren.') + mesBar() + `
      <div class="kpis"><div class="card"><span>Cobrado</span><b>${A.pesos(cobrado)}</b><small>${pagosMes.length} pago${pagosMes.length === 1 ? '' : 's'}</small></div>
        <div class="card"><span>Gastos</span><b>${A.pesos(gastado)}</b><small>${gm.length} registro${gm.length === 1 ? '' : 's'}</small></div>
        <div class="card ${cobrado - gastado < 0 ? 'neg' : ''}"><span>Quedó</span><b>${cobrado - gastado < 0 ? '−' : ''}${A.pesos(Math.abs(cobrado - gastado))}</b><small>cobrado − gastos</small></div>
        <div class="card"><span>Pedidos nuevos</span><b>${nuevos}</b><small>en el mes</small></div></div>
      <section><span class="k">Les deben (todos los meses)</span><div class="card">${dl([['Por cobrar', A.pesos(porCobrar)], ['Pedidos con saldo', deben]])}<a class="btn" href="#cobros">Ver cobros</a></div></section>
      <section><span class="k">En el taller ahora</span><div class="kpis sm">${est.map(e => `<div class="card"><span>${e[0]}</span><b>${e[1]}</b></div>`).join('')}</div></section>
      <section><span class="k">Entregas</span>${ents.length ? `<ul class="rows">${ents.slice(0, 20).map(p => `<li><a href="#p=${esc(p.id)}"><b>${esc(A.dia(entrega(p)))}${entrega(p) < h ? ' <mark class="late">atrasada</mark>' : entrega(p) === h ? ' <mark>hoy</mark>' : ''}</b>
        <span>#${esc(p.folio)} · ${esc(p.nombre)} · ${esc(A.estado(p.estado))}</span></a></li>`).join('')}</ul>` : '<p class="lead">No hay entregas con fecha. La fecha se pone en cada pedido, en «Precio, anticipo y entrega».</p>'}
        ${sinFecha.length ? `<p class="note">${sinFecha.length} pedido${sinFecha.length === 1 ? '' : 's'} vendido${sinFecha.length === 1 ? '' : 's'} sin fecha de entrega: ${sinFecha.slice(0, 6).map(p => `<a href="#p=${esc(p.id)}">#${esc(p.folio)}</a>`).join(', ')}</p>` : ''}</section>
      <section><span class="k">Gastos de ${mesNombre(mes)} por tipo</span>${cats.length ? `<div class="card">${dl(cats.map(c => [esc(c[0]), A.pesos(c[1])]))}</div>` : '<p class="lead">Sin gastos registrados en este mes.</p>'}<a class="btn" href="#gastos">Registrar o ver gastos</a></section>`;
    bindMes(main, () => resumen(main, all));
  }

  // ---------- cobros ----------
  function cobros(main, all) {
    const l = all.filter(p => saldo(p) > 0).sort((a, b) => saldo(b) - saldo(a));
    const sinPrecio = all.filter(p => abierto(p) && vendido(p) && !total(p));
    const rec = all.flatMap(p => (p.pagos || []).map(x => Object.assign({ p }, x))).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.creado - a.creado).slice(0, 30);
    main.innerHTML = head('Cobros', 'Pedidos vendidos (cotización aceptada o en confirmado, fabricación, listo o entregado) que todavía tienen saldo.') + `
      <div class="card">${dl([['Por cobrar en total', A.pesos(l.reduce((s, p) => s + saldo(p), 0))]])}</div>
      ${l.length ? l.map(p => { const txt = `Hola ${nom1(p)}, te escribimos de DAZK. Te compartimos el saldo de tu pedido #${p.folio}: ${A.pesos(saldo(p))}. Aquí puedes ver tu pedido: ${A.seguimiento(p.token)}`;
        return `<div class="card"><h3>#${esc(p.folio)} · ${esc(p.nombre)}</h3>${dl([['Precio', A.pesos(total(p))], ['Pagado', A.pesos(pagado(p))], ['Saldo', A.pesos(saldo(p))]])}
        <p class="lead">${esc(A.estado(p.estado))}${entrega(p) ? ' · entrega ' + esc(A.dia(entrega(p))) : ''}</p>
        <div class="two">${p.tel ? `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${A.waNum(p.tel)}?text=${encodeURIComponent(txt)}">Recordarle por WhatsApp</a>` : ''}<a class="btn" href="#p=${esc(p.id)}">Registrar pago</a></div></div>`; }).join('')
        : '<p class="lead">Nadie les debe. Los pagos se registran dentro de cada pedido.</p>'}
      ${sinPrecio.length ? `<p class="note">Vendidos sin precio capturado (no se pueden cobrar aquí hasta que tengan precio): ${sinPrecio.map(p => `<a href="#p=${esc(p.id)}">#${esc(p.folio)}</a>`).join(', ')}</p>` : ''}
      <section><span class="k">Pagos recientes</span>${rec.length ? `<div class="scroll"><table class="tab"><thead><tr><th>Pedido</th><th>Fecha</th><th>Forma</th><th>Monto</th></tr></thead><tbody>
        ${rec.map(x => `<tr><th><a href="#p=${esc(x.p.id)}">#${esc(x.p.folio)} ${esc(nom1(x.p))}</a></th><td class="t">${esc(x.fecha.slice(8))}/${esc(x.fecha.slice(5, 7))}</td><td class="t">${esc(x.metodo)}</td><td>${A.pesos(x.monto)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="lead">Todavía no hay pagos registrados.</p>'}</section>`;
  }

  // payments card inside an order
  function pagosHtml(p) {
    const t = total(p), pg = pagado(p);
    return `<div class="card pagos" id="pagos"><h3>Pagos del cliente</h3>
      ${dl([['Precio', t ? A.pesos(t) : 'por definir'], ['Pagado', A.pesos(pg)], ['Saldo', t ? A.pesos(Math.max(0, t - pg)) : '—']])}
      ${(p.pagos || []).length ? `<ul class="mini">${p.pagos.map(x => `<li><span>${esc(A.dia(x.fecha))} · ${esc(x.metodo)}${x.nota ? ' · ' + esc(x.nota) : ''} <small>(${esc(x.por)})</small></span><b>${A.pesos(x.monto)}</b><button type="button" class="x" data-delpago="${esc(x.id)}" aria-label="Borrar pago">Borrar</button></li>`).join('')}</ul>` : '<p class="lead">Sin pagos registrados.</p>'}
      <form id="pg-form"><div class="grid"><label for="pg-m">Monto ($)<input id="pg-m" inputmode="decimal" required placeholder="${t && t - pg > 0 ? esc(String(t - pg)) : ''}"></label>
        <label for="pg-f">Fecha<input type="date" id="pg-f" value="${hoy()}" required></label>
        <label for="pg-k">Forma de pago<select id="pg-k">${METODOS.map(m => `<option>${m}</option>`).join('')}</select></label>
        <label for="pg-n" class="wide">Nota (opcional)<input id="pg-n" maxlength="200" placeholder="Anticipo, saldo, referencia…"></label></div>
        <p class="err" hidden role="alert"></p><button class="btn gold" type="submit">Registrar pago</button></form></div>`;
  }
  function bindPagos(main, p, reload) {

    main.querySelectorAll('[data-delpago]').forEach(b => dosToques(b, async () => { await A.borrarPago(p.id, b.dataset.delpago, p.pagos.find(x => x.id === b.dataset.delpago)); await reload(); }));

  // ---------- gastos ----------
  async function gastos(main, all) {

    if (location.hash !== '#gastos') return;
    const gm = G.filter(g => g.fecha.startsWith(mes)), ped = id => all.find(p => p.id === id);

      ${mesBar()}<div class="card">${dl([['Total del mes', A.pesos(gm.reduce((s, g) => s + g.monto, 0))]].concat(cats.map(c => [esc(c[0]), A.pesos(c[1])])))}</div>

    };

  }
  // what one order cost, from the expenses linked to it (shown inside the order)
  async function costoPedido(el, p) {

  // ---------- clientes ----------
  let qc = '';
  function clientes(main, all) {

    const s = qc.trim().toLowerCase();

  // ---------- nuevo pedido (captured by staff) ----------
  // a table captured with its measures, so the order gets its ficha and croquis right away; delivery date and price go to the order too
  function nuevo(main, reload) {
    const C = window.DAZK_CQ, CAT = window.DAZK_CAT || {};
    const opt = (l, vacio) => (vacio ? `<option value="">${vacio}</option>` : '') + l.map(o => `<option>${esc(o)}</option>`).join('');
    const fila = i => `<div class="prod" data-row="${i}"><div class="grid">
      <label>Forma<select data-f>${C.FORMAS.map(f => `<option value="${f[0]}">${f[1]}</option>`).join('')}</select></label>

</script><script>/* DAZK · protocolo de trabajo (inlined in taller.html): the professional checklist of each stage, the shopping list for the stone supplier,

      ['precio', 'Precio puesto en «Precio, anticipo y entrega»', p => !!G().total(p)]]],

      ['piedra', 'Placa apartada con el proveedor (color y lote)'], ['base', 'Base pedida al herrero con las medidas de la ficha'],
      ['fecha', 'Fecha de entrega definida', p => !!G().entrega(p)]]],
    fabricacion: ['En el taller', [
      ['corte', 'Piedra cortada a medida'], ['canto', 'Cantos y pulido terminados'], ['baseok', 'Base soldada y pintada'],
      ['ensamble', 'Ensamble: MDF, pegado y refuerzo'], ['qc', 'Control de calidad: nivel, escuadra, cantos y manchas'], ['fotos', 'Fotos de la mesa terminada']]],

        : '<p class="lead">Nada pendiente.</p>'}${listo.length ? `<p class="note">Ya pedido: ${listo.map(f => '#' + esc(f.p.folio)).join(', ')}</p>` : ''}</section>`;

      b.disabled = true; try { await A.guardarFicha(p.id, 'checks', c, '✓ ' + PROT.confirmado[1].find(x => x[0] === k)[1]); } catch (e) { alert(e.message); } reload(); });

      .map(p => { const t = G().total(p), c = p.costo || 0; return { p, t, c, m: t - c, pct: Math.round((t - c) / t * 100) }; }).sort((a, b) => (a.c ? a.pct : 999) - (b.c ? b.pct : 999));

  const hoyStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

        <label for="gs-f">Fecha<input type="date" id="gs-f" value="${hoyStr()}" required></label></div><p class="err" role="alert" hidden></p><button class="btn gold" type="submit">Agregar gasto</button></form></details>`;
  }

    const f = main.querySelector('#gs-form'); if (!f) return;
    f.onsubmit = async e => { e.preventDefault(); const m = parseFloat(main.querySelector('#gs-m').value.replace(/[^0-9.]/g, '')), er = f.querySelector('.err');
      if (!(m > 0)) { er.textContent = 'Escribe el monto.'; er.hidden = false; return; }

  }

  window.DAZK_PROT = { PROT, lista, pendientes, html, bind, compras, bindCompras, ganancia, gastoHtml, bindGasto, ANTICIPO, pagado };
})();
</script><script>/* DAZK · flujo del pedido (inlined in taller.html): for each order it works out the step it is in, the one next action and its alerts,
   and builds the "Hoy" screen, every open order that needs something, most urgent first. Uses only data the panel already has. */
(function () {
  const A = window.DAZK_API, esc = A.esc;
  const G = () => window.DAZK_GES, FI = () => window.DAZK_FICHA, PR = () => window.DAZK_PROT, DIA = 864e5;
  const ms = t => typeof t === 'number' ? t : +new Date(t);
  const hoyStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dias = f => Math.round((new Date(f + 'T12:00:00') - new Date(hoyStr() + 'T12:00:00')) / DIA);

  const vendido = p => !!(p.cotizacion && p.cotizacion.aceptada) || ['confirmado', 'fabricacion', 'listo', 'entregado'].includes(p.estado);
  const faltan = p => p.items.reduce((s, it, i) => it.tipo === 'mesa' ? s + FI().faltan(FI().valores(p, it, i)) : s, 0);
  const n1 = p => p.nombre.split(' ')[0];
  const wa = (p, txt) => p.tel ? `https://wa.me/${A.waNum(p.tel)}?text=${encodeURIComponent(txt)}` : '';
  const plural = (n, s) => n + ' ' + s + (n === 1 ? '' : 's');
  const PASOS = ['Recibido', 'Cotizado', 'Anticipo', 'Taller', 'Lista', 'Entregada'];
  const IDX = { nuevo: 0, cotizado: 1, confirmado: 2, fabricacion: 3, listo: 4, entregado: 5 };

  // the brain: step, next action (and a second one), alerts and urgency (lower = sooner; null = nothing to do now)
  function info(p) {

    const msg = !!(ult && ult.autor === 'cliente' && ult.tipo === 'mensaje'), c = p.cotizacion, t = G().total(p), sal = G().saldo(p), pg = pagado(p);
    const ent = G().entrega(p), d = ent ? dias(ent) : null, abierto = p.estado !== 'entregado' && p.estado !== 'cancelado';
    const r = { paso: IDX[p.estado], anticipo: pg > 0, acc: null, otra: null, alertas: [], urg: null };
    if (p.estado === 'cancelado') return r;
    if (msg) r.alertas.push(['rojo', `${n1(p)} te escribió y espera respuesta`]);
    if (abierto && d != null && p.estado !== 'listo') {
      if (d < 0) r.alertas.push(['rojo', `Entrega atrasada ${plural(-d, 'día')} (${A.dia(ent)})`]);
      else if (d <= 3) r.alertas.push(['naranja', d === 0 ? 'Se entrega hoy' : `Se entrega en ${plural(d, 'día')} (${A.dia(ent)})`]);
    }
    if (abierto && vendido(p) && !ent) r.alertas.push(['amarillo', 'Sin fecha de entrega: ponla en «Precio, anticipo y entrega»']);
    if (['confirmado', 'fabricacion'].includes(p.estado)) { const f = faltan(p); if (f) r.alertas.push(['amarillo', `Faltan ${plural(f, 'medida')} en la ficha de fabricación`]); }
    if (vendido(p) && sal > 0) r.alertas.push(['info', `Saldo pendiente: ${A.pesos(sal)}`]);
    if (t && p.costo > t) r.alertas.push(['rojo', `Los gastos (${A.pesos(p.costo)}) ya superan el precio (${A.pesos(t)})`]);

    if (p.estado === 'nuevo') { r.acc = { txt: t ? 'Enviar la cotización' : 'Poner precio y enviar cotización', tipo: 'cot' }; r.urg = 2; r.grupo = 'Cotizar'; }
    else if (p.estado === 'cotizado') {

        : { txt: 'Esperando que el cliente acepte la cotización', tipo: null };

      if (hace >= 3) { r.urg = 6; r.grupo = 'Seguimiento'; }
    } else if (p.estado === 'confirmado') {
      const need = t * PR().ANTICIPO, pend = PR().pendientes(p).filter(x => x.k !== 'anticipo'), f0 = pend[0], fm = faltan(p);
      if (!t) { r.acc = { txt: 'Poner el precio en «Precio, anticipo y entrega»', tipo: 'cot' }; r.grupo = 'Cobrar anticipo'; }
      else if (pg < need) { r.acc = { txt: pg ? `Completar el anticipo: faltan ${A.pesos(need - pg)} para el 50%` : `Registrar el anticipo (50%: ${A.pesos(need)})`, tipo: 'pago', monto: Math.round(need - pg) }; r.grupo = 'Cobrar anticipo'; }
      else if (f0) {
        r.acc = f0.k === 'ficha' ? { txt: `Completar la ficha de fabricación (faltan ${plural(fm, 'medida')})`, tipo: 'ficha' } : f0.k === 'fecha' ? { txt: 'Poner la fecha de entrega', tipo: 'cot' } : { txt: 'Falta: ' + f0.t, tipo: 'check' };
        r.otra = { txt: 'Pasar a fabricación', tipo: 'estado', val: 'fabricacion' }; r.grupo = 'Mandar a fabricar';
      }
      else { r.acc = { txt: 'Pasar a fabricación', tipo: 'estado', val: 'fabricacion' }; r.grupo = 'Mandar a fabricar'; }
      r.urg = 3;
    } else if (p.estado === 'fabricacion') {
      r.acc = { txt: 'Marcar como lista', tipo: 'estado', val: 'listo' };
      if (d != null && d <= 3) { r.urg = 4; r.grupo = 'Taller'; }
    } else if (p.estado === 'listo') {
      r.acc = sal > 0 ? { txt: `Registrar el pago del saldo (${A.pesos(sal)})`, tipo: 'pago', monto: sal } : { txt: 'Marcar como entregada', tipo: 'estado', val: 'entregado' };
      if (p.tel) r.otra = { txt: `Avisar a ${n1(p)} que su mesa está lista`, tipo: 'wa', href: wa(p, `Hola ${n1(p)}, ¡tu mesa DAZK ya está lista! (pedido #${p.folio}). ¿Qué día te queda bien para la entrega? ${link}`) };
      r.urg = 5; r.grupo = 'Entregar y cobrar';
    } else if (p.estado === 'entregado') {
      if (!p.resena && p.tel) {
        r.acc = { txt: 'Pedir su opinión por WhatsApp', tipo: 'wa', href: wa(p, `Hola ${n1(p)}, ¿cómo quedó tu mesa DAZK? Nos ayudaría muchísimo tu opinión, son 10 segundos: ${link}`) };
        if (Date.now() - ms(p.actualizado) > 2 * DIA) { r.urg = 7; r.grupo = 'Seguimiento'; }
      } else r.acc = { txt: 'Pedido terminado ✓', tipo: null };
      if (sal > 0) { r.acc = { txt: `Registrar el pago del saldo (${A.pesos(sal)})`, tipo: 'pago' }; r.urg = 5; r.grupo = 'Entregar y cobrar'; }
    }
    // the protocol: a pending manual step of this stage is the next thing to do (the stage's own action stays as the second button)
    if (['nuevo', 'fabricacion', 'listo', 'entregado'].includes(p.estado) && !(p.estado === 'listo' && sal > 0)) {
      const man = PR().pendientes(p).filter(x => !x.auto), reciente = Date.now() - ms(p.actualizado) < 14 * DIA;
      if (man.length && (p.estado !== 'entregado' || reciente)) {
        if (r.acc && r.acc.tipo) r.otra = r.acc;
        r.acc = { txt: 'Falta: ' + man[0].t, tipo: 'check' };
        if (p.estado === 'entregado') { r.urg = 7; r.grupo = 'Seguimiento'; }
      }

  // a warning before skipping a step by hand; '' when the move is fine

    if (est === 'fabricacion' && pg < t * PR().ANTICIPO) return pg ? `El anticipo cobrado (${A.pesos(pg)}) es menor al 50% (${A.pesos(t * PR().ANTICIPO)}). ¿Mandar a fabricar de todos modos?` : '¿Mandar a fabricar sin anticipo registrado?';
    const falta = orden.indexOf(est) > orden.indexOf(p.estado) ? PR().pendientes(p).filter(x => !x.auto) : [];
    if (falta.length) return 'Faltan pasos de esta etapa:\n• ' + falta.map(x => x.t).join('\n• ') + '\n\n¿Avanzar de todos modos?';
    if (est === 'fabricacion' && faltan(p)) return 'A la ficha le faltan medidas. ¿Mandar a fabricar de todos modos?';
    if (est === 'entregado' && sal > 0) return `Todavía hay saldo pendiente de ${A.pesos(sal)}. ¿Marcar como entregada de todos modos?`;
    if (est === 'cotizado' && !p.cotizacion) return 'Todavía no le envías la cotización desde «Precio, anticipo y entrega». ¿Cambiar el estado de todos modos?';

    : a.tipo === 'wa' ? `<a class="btn ${cls} wa" href="${esc(a.href)}" target="_blank" rel="noopener">${esc(a.txt)}</a>`

  function html(p) {
    const r = info(p);

    return `<div class="card flujo"><ol class="pasos">${PASOS.map((s, i) => `<li class="${i < r.paso || (i === 2 && r.anticipo && r.paso >= 2) ? 'done' : i === r.paso ? 'on' : ''}"><i></i>${s}</li>`).join('')}</ol>

  }

      if (a.tipo === 'cot') { const d = main.querySelector('details[data-i="pago"]'); if (d) { T(d); d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
      else if (a.tipo === 'pago') { const f = main.querySelector('#pagos'); if (f) { T(f); f.scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => { const m = main.querySelector('#pg-m'); if (m) { if (a.monto) m.placeholder = String(a.monto); m.focus({ preventScroll: true }); } }, 400); } }

  function hoy(main, all) {

</script><script>/* DAZK · tablero (inlined in taller.html): business numbers, charts and the delivery week for the "Hoy" screen.
   Single-series charts in the brand gold (thin marks, rounded data ends, hairline grid, hover tooltip, table view). Only real payments, quotes and orders. */
(function () {
  const A = window.DAZK_API, esc = A.esc, G = () => window.DAZK_GES;
  const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const ms = t => typeof t === 'number' ? t : +new Date(t);
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const ymOf = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const corto = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.0', '') + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : '$' + Math.round(n);
  const spec = (it, k) => { const s = (it.specs || []).find(x => x[0] === k); return s ? s[1] : ''; };
  const vivo = p => p.estado !== 'cancelado';

  // the last n months, oldest first: { ym, label, cobrado, vendido }
  function meses(all, n) {
    const out = [], d = new Date(); d.setDate(1);
    for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push({ ym: ymOf(x), label: MES[x.getMonth()], cobrado: 0, vendido: 0 }); }
    const at = Object.fromEntries(out.map(m => [m.ym, m]));
    all.filter(vivo).forEach(p => {
      (p.pagos || []).forEach(x => { const m = at[x.fecha.slice(0, 7)]; if (m) m.cobrado += x.monto; });
      if (p.cotizacion && p.cotizacion.aceptada) { const m = at[ymOf(ms(p.cotizacion.aceptada))]; if (m) m.vendido += p.cotizacion.total; }
    });
    return out;
  }

  function kpis(all) {
    const m = meses(all, 1)[0], abiertos = all.filter(p => p.estado !== 'entregado' && p.estado !== 'cancelado').length;
    const cobrar = all.reduce((s, p) => s + G().saldo(p), 0);
